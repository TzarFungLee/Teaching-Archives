<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTF Teaching Archives</title>
    <style>
        :root { --primary: #0b3d91; --primary-2: #062b6e; --bg: linear-gradient(180deg,#fef9f3 0%,#faf6f1 100%); --surface: #ffffff; --text: #083344; --muted: #5b6b70; --border: rgba(8,51,68,0.08); }
        body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: var(--bg); color: var(--text); padding: 28px; line-height: 1.65; }
        .container { max-width: 900px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary); margin-bottom: 5px; }
        .subtitle { color: #64748b; font-size: 0.95rem; }

        .tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
        .tab-btn { background: transparent; border: 1px solid transparent; padding: 9px 26px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); transition: all 0.18s ease; box-shadow: none; }
        .tab-btn:hover { background: rgba(11,61,145,0.07); color: var(--primary); transform: translateY(-2px); }
        .tab-btn.active { background: linear-gradient(90deg,var(--primary),var(--primary-2)); color: white; border-color: transparent; box-shadow: 0 8px 20px rgba(6,22,23,0.08); }

        .search-wrapper { margin-bottom: 25px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box; }

        .resource-card {
            background: linear-gradient(180deg,#ffffff,#fbffff); padding: 18px; border-radius: 12px; border: 1px solid var(--border);
            display: block; margin-bottom: 14px;
            cursor: pointer; transition: transform 0.18s ease, box-shadow 0.18s ease; text-decoration: none; color: inherit;
            box-shadow: 0 8px 18px rgba(2,30,80,0.04);
        }
        .resource-card:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(2,30,80,0.08); }

        .tags-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.2px; }
        .tag-papers { background: linear-gradient(90deg,#e6eefb,#eaf4ff); color: #042a66; border: 1px solid rgba(6,42,111,0.08); }

        .btn { background: linear-gradient(90deg,var(--primary),var(--primary-2)); color: white; padding: 9px 16px; border-radius: 8px; text-decoration: none; border: none; font-size: 0.95rem; box-shadow: 0 8px 20px rgba(2,30,80,0.06); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LTF Teaching Archives</h1>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="filterTab('All', this)">All</button>
        <button class="tab-btn" onclick="filterTab('Grammar', this)">Grammar</button>
        <button class="tab-btn" onclick="filterTab('Reading', this)">Reading</button>
        <button class="tab-btn" onclick="filterTab('Writing', this)">Writing</button>
        <button class="tab-btn" onclick="filterTab('Listening', this)">Listening</button>
    </div>

    <div class="search-wrapper">
        <input type="text" id="search" placeholder="🔍 Search resources..." onkeyup="renderList()">
    </div>

    <div id="list" class="resource-list"></div>
</div>

<script>
    const resources = [
        {
            id: 1,
            title: "Text Types",
            papers: ["Writing"],
            file: "Writing/Text Types.html"
        },
        {
            id: 2,
            title: "First Conditional",
            papers: ["Grammar"],
            file: "Grammar/First Conditional.html"
        },
        {
            id: 3,
            title: "Second Conditional",
            papers: ["Grammar"],
            file: "Grammar/Second Conditional.html"
        },
        {
            id: 4,
            title: "Passive Voice",
            papers: ["Grammar"],
            file: "Grammar/Passive Voice.html"
        },
        {
            id: 5,
            title: "Pronoun Table",
            papers: ["Grammar"],
            file: "Grammar/Pronoun Table.html"
        },
        {
            id: 6,
            title: "Tenses",
            papers: ["Grammar"],
            file: "Grammar/Tenses.html"
        }
    ];

    let currentTab = 'All';

    function filterTab(tabName, btnElement) {
        currentTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderList();
    }

        function renderList() {
        const query = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('list');
        container.innerHTML = '';

        const filtered = resources.filter(item => {
            const papers = Array.isArray(item.papers) ? item.papers : [item.papers];
            
            // FIX: Removed 'item.subject' and added check for 'papers'
            const matchSearch = item.title.toLowerCase().includes(query) || 
                              papers.some(p => p.toLowerCase().includes(query));
            
            const matchTab = currentTab === 'All' || papers.includes(currentTab);
            return matchSearch && matchTab;
        });

        if (!filtered.length) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8">No resources found.</div>`;
            return;
        }

        filtered.forEach(item => {
            const link = document.createElement('a');
            link.className = 'resource-card';
            link.href = item.file;
            
            const papers = Array.isArray(item.papers) ? item.papers : [item.papers];
            const badges = papers.map(l => `<span class="tag tag-papers">${l}</span>`).join('');

            link.innerHTML = `
                <div>
                    <div class="tags-row">${badges}</div>
                    <h3 style="margin:0 0 5px 0">${item.title}</h3>
                </div>
            `;
            container.appendChild(link);
        });
    }


    renderList();
</script>

</body>
</html>
