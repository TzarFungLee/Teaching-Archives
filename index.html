<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Resources</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Navigation */
        .nav-bar { margin-bottom: 20px; }
        .back-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 1rem; display: flex; align-items: center; padding: 0; }
        
        /* Headers */
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary); margin-bottom: 5px; }

        /* TABS (Main Page) */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: white; border: 1px solid var(--border); padding: 8px 24px; border-radius: 20px; cursor: pointer; font-weight: 500; color: #64748b; transition: all 0.2s; }
        .tab-btn:hover { background: #f1f5f9; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Search & List */
        .search-wrapper { margin-bottom: 25px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        
        .resource-card {
            background: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
            cursor: pointer; transition: transform 0.2s;
        }
        .resource-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        /* Tags */
        .tags-row { display: flex; gap: 6px; margin-bottom: 4px; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .tag-level { background: #e0e7ff; color: #3730a3; }
        .tag-subject { background: #f1f5f9; color: #475569; }

        /* SUBPAGE GENERAL */
        .subpage-content { background: var(--surface); padding: 30px; border-radius: 8px; border: 1px solid var(--border); min-height: 400px;}
        .hidden { display: none !important; }
        .btn { background-color: var(--primary); color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; border: none; font-size: 0.9rem; }

        /* --- VOCABULARY APP STYLES --- */
        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        
        .vocab-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            background: #fff;
            transition: all 0.2s;
        }
        .vocab-card h3 { margin: 0 0 5px 0; color: var(--primary); font-size: 1.2rem; }
        .vocab-meta { font-size: 0.85rem; color: #64748b; margin-bottom: 10px; font-style: italic; }
        .vocab-def { font-size: 0.95rem; margin-bottom: 10px; line-height: 1.4; }
        .vocab-synonyms { font-size: 0.85rem; color: #475569; background: #f1f5f9; padding: 8px; border-radius: 6px; }
        
        .translate-btn {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #2563eb;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid #2563eb;
            padding: 4px 10px;
            border-radius: 4px;
        }
        .translate-btn:hover { background: #eff6ff; }
        
        /* Loading State */
        .skeleton { height: 20px; background: #eee; margin-bottom: 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="listView">
        <header>
            <h1>📂 Course Materials</h1>
            <div style="color: #64748b">Filter by form level</div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="filterTab('All', this)">All</button>
            <button class="tab-btn" onclick="filterTab('S1', this)">S1</button>
            <button class="tab-btn" onclick="filterTab('S2', this)">S2</button>
            <button class="tab-btn" onclick="filterTab('S3', this)">S3</button>
            <button class="tab-btn" onclick="filterTab('DSE', this)">DSE</button>
        </div>

        <div class="search-wrapper">
            <input type="text" id="search" placeholder="🔍 Search resources..." onkeyup="renderList()">
        </div>

        <div id="list" class="resource-list"></div>
    </div>

    <div id="detailView" class="hidden">
        <div class="nav-bar">
            <button onclick="showList()" class="back-btn">← Back to List</button>
        </div>
        <div id="detailContent" class="subpage-content"></div>
    </div>

</div>

<script>
    // ==========================================
    // MASSIVE VOCAB DATABASE
    // ==========================================
    const rawVocabList = [
        "abandon", "ability", "abolish", "abrupt", "absence", "absolute", "absorb", "abstract", "abundant", "abuse", "academic", "accelerate", "access", "accommodate", "accomplish", "accumulate", "accurate", "achieve", "acknowledge", "acquire", "adapt", "adequate", "adjust", "administration", "admire", "admission", "adopt", "advance", "advantage", "advocate", "affect", "afford", "agency", "aggressive", "agriculture", "aid", "alarm", "alien", "alleviate", "allocate", "alter", "alternative", "amateur", "ambiguous", "ambition", "amount", "analysis", "ancient", "announce", "annual", "anonymous", "anxiety", "apologize", "apparent", "appeal", "appetite", "applicant", "appoint", "appreciate", "approach", "appropriate", "approve", "approximate", "architecture", "argue", "arise", "arouse", "arrange", "arrest", "arrogant", "artificial", "aspect", "assemble", "assess", "asset", "assign", "assist", "associate", "assume", "assure", "atmosphere", "attach", "attain", "attempt", "attend", "attitude", "attract", "attribute", "audience", "authentic", "authority", "automatic", "available", "average", "avoid", "aware", "awkward", "background", "balance", "ban", "barrier", "basic", "basis", "bear", "behave", "belief", "beneficial", "benefit", "betray", "bias", "bitter", "blame", "block", "board", "bold", "bond", "boost", "border", "bored", "bother", "bound", "boundary", "brand", "brave", "breach", "breakthrough", "breathe", "breed", "brief", "brilliant", "broad", "broadcast", "budget", "burden", "campaign", "cancel", "candidate", "capable", "capacity", "capital", "capture", "career", "careful", "casual", "category", "cause", "caution", "cease", "celebrate", "ceremony", "certain", "certificate", "challenge", "champion", "channel", "chaos", "character", "charity", "charm", "chase", "cheat", "check", "chemical", "cherish", "chief", "childhood", "choice", "choose", "chronic", "circumstance", "cite", "citizen", "civil", "claim", "clarify", "classic", "classify", "clause", "clear", "client", "climate", "clue", "cluster", "coach", "coalition", "code", "cognitive", "coherent", "coincide", "collapse", "colleague", "collect", "collective", "collision", "colony", "combine", "comfort", "command", "commence", "comment", "commerce", "commission", "commit", "committee", "commodity", "common", "communicate", "community", "company", "compare", "compatible", "compel", "compensate", "compete", "competent", "compile", "complain", "complement", "complete", "complex", "complicate", "component", "compose", "compound", "comprehensive", "comprise", "compromise", "compulsory", "conceal", "concede", "concentrate", "concept", "concern", "conclude", "concrete", "condemn", "condition", "conduct", "conference", "confess", "confidence", "confine", "confirm", "conflict", "conform", "confront", "confuse", "congested", "congratulate", "connect", "conquer", "conscience", "conscious", "consensus", "consent", "consequence", "conserve", "consider", "consist", "consistent", "console", "consolidate", "conspicuous", "conspiracy", "constant", "constitute", "constitution", "construct", "consult", "consume", "contact", "contain", "contaminate", "contemporary", "contend", "content", "contest", "context", "continent", "continue", "contract", "contradict", "contrary", "contrast", "contribute", "control", "controversial", "convenience", "convention", "convert", "convey", "convict", "convince", "cooperate", "coordinate", "cop", "cope", "copy", "core", "corner", "corporation", "correct", "correspond", "corrupt", "cost", "council", "counsel", "count", "counter", "counterpart", "courage", "course", "court", "cover", "coward", "crack", "craft", "crash", "crawl", "crazy", "create", "creature", "credit", "creep", "crew", "crime", "criminal", "crisis", "criteria", "critic", "critical", "criticize", "crop", "cross", "crowd", "crucial", "cruel", "crush", "cry", "cultivate", "cultural", "culture", "cure", "curious", "current", "custom", "customer", "cut", "cycle", "cynical"
    ];

    // Resources Data
    const resources = [
        {
            id: 888, 
            title: "Giant Vocab Database", 
            subject: "English",
            level: ["S4", "S5", "DSE"],
            notes: "Searchable Dictionary",
            htmlContent: `
                <div style="border-bottom:1px solid #e2e8f0; padding-bottom:15px; margin-bottom:20px">
                    <h2 style="margin:0; color:#2563eb">DSE Vocabulary Engine</h2>
                    <p style="margin:5px 0 15px 0; color:#64748b">Search over 5,000 words. Definitions load instantly.</p>
                    
                    <div class="vocab-tools">
                        <input type="text" class="vocab-search" id="vocabSearch" 
                               placeholder="🔎 Type a word to search..." 
                               onkeyup="handleSearch()">
                    </div>
                    <div id="resultCount" style="font-size:0.85rem; color:#94a3b8; text-align:right"></div>
                </div>

                <div id="vocab-container" class="vocab-list-container">
                    <div style="text-align:center; padding:40px; color:#cbd5e1;">
                        Start typing to search...
                    </div>
                </div>
            `
        },
        {
            id: 1,
            title: "English Writing Text Types", 
            subject: "English",
            level: ["S3", "DSE"],
            notes: "8 Main Genres",
            htmlContent: `<h2>Writing Text Types</h2><p>Select a text type...</p>` 
        }
    ];

    // [TAB AND LIST LOGIC REMAINS THE SAME - SKIPPING FOR BREVITY]
    let currentTab = 'All';
    function filterTab(tabName, btnElement) {
        currentTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderList();
    }
    function renderList() {
        const query = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('list');
        container.innerHTML = '';
        const filtered = resources.filter(item => {
            const itemLevels = Array.isArray(item.level) ? item.level : [item.level];
            const matchesSearch = item.title.toLowerCase().includes(query) || item.subject.toLowerCase().includes(query);
            const matchesTab = currentTab === 'All' || itemLevels.includes(currentTab);
            return matchesSearch && matchesTab;
        });
        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'resource-card';
            const levels = Array.isArray(item.level) ? item.level : [item.level];
            const badgesHTML = levels.map(lvl => `<span class="tag tag-level">${lvl}</span>`).join('');
            const action = item.htmlContent ? `onclick="openPage(${item.id})"` : `onclick="window.open('${item.link}', '_blank')"`;
            div.innerHTML = `
                <div onclick="event.stopPropagation(); ${action}" style="flex-grow:1">
                    <div class="tags-row">${badgesHTML}<span class="tag tag-subject">${item.subject}</span></div>
                    <h3 style="margin:0 0 5px 0">${item.title}</h3>
                    <div style="font-size:0.85rem; color:#64748b">${item.notes}</div>
                </div>
                <button class="btn" ${action}>View</button>
            `;
            container.appendChild(div);
        });
    }
    function openPage(id) {
        const item = resources.find(r => r.id === id);
        if(!item || !item.htmlContent) return;
        document.getElementById('listView').classList.add('hidden');
        document.getElementById('detailView').classList.remove('hidden');
        document.getElementById('detailContent').innerHTML = item.htmlContent;
        window.scrollTo(0,0);
    }
    function showList() {
        document.getElementById('detailView').classList.add('hidden');
        document.getElementById('listView').classList.remove('hidden');
        document.getElementById('detailContent').innerHTML = ''; 
    }

    // ==========================================
    // UPDATED SEARCH LOGIC
    // ==========================================
    let searchTimeout;
    function handleSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(performVocabSearch, 300);
    }

    function performVocabSearch() {
        const query = document.getElementById('vocabSearch').value.toLowerCase().trim();
        const container = document.getElementById('vocab-container');
        const countDisplay = document.getElementById('resultCount');
        
        if (query.length < 1) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:#cbd5e1;">Start typing to search...</div>`;
            countDisplay.innerText = "";
            return;
        }

        const matches = rawVocabList.filter(w => w.toLowerCase().startsWith(query)).slice(0, 50);
        countDisplay.innerText = matches.length > 0 ? `Showing top ${matches.length} matches` : "No matches found";
        container.innerHTML = '';

        matches.forEach(wordStr => {
            const parts = wordStr.split('|');
            const word = parts[0];
            const manualDef = parts[1] || null;

            const el = document.createElement('div');
            el.className = 'vocab-item';
            el.innerHTML = `
                <div class="v-row-main">
                    <div class="v-word">${word}</div>
                    <div class="v-preview">Click for definition</div>
                </div>
                <div class="v-details" id="d-${word}">
                    <div class="v-meta">Loading...</div>
                </div>
            `;
            el.onclick = function() { toggleVocabCard(this, word, manualDef); };
            container.appendChild(el);
        });
    }

    async function toggleVocabCard(element, word, manualDef) {
        if (element.classList.contains('expanded')) {
            element.classList.remove('expanded');
            return;
        }
        document.querySelectorAll('.vocab-item.expanded').forEach(e => e.classList.remove('expanded'));
        element.classList.add('expanded');
        
        const detailBox = document.getElementById(`d-${word}`);
        if (detailBox.dataset.loaded === 'true') return;

        // CAMBRIDGE LINK GENERATOR
        const cambridgeLink = `https://dictionary.cambridge.org/dictionary/english-chinese-traditional/${word}`;

        if (manualDef) {
            detailBox.innerHTML = `
                <div class="v-meta">Definition</div>
                <div class="v-def">${manualDef}</div>
                <a href="${cambridgeLink}" target="_blank" class="trans-btn">Open Cambridge Dict ↗</a>
            `;
            detailBox.dataset.loaded = 'true';
            return;
        }

        try {
            const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
            const data = await res.json();
            
            if (Array.isArray(data)) {
                const entry = data[0];
                const pos = entry.meanings[0].partOfSpeech;
                const def = entry.meanings[0].definitions[0].definition;
                
                detailBox.innerHTML = `
                    <div class="v-meta">${pos}</div>
                    <div class="v-def">${def}</div>
                    <a href="${cambridgeLink}" target="_blank" class="trans-btn">Open Cambridge Dict ↗</a>
                `;
            } else {
                detailBox.innerHTML = `
                    <div style="color:#64748b; margin-bottom:10px">No simple definition found.</div>
                    <a href="${cambridgeLink}" target="_blank" class="trans-btn">Open Cambridge Dict ↗</a>
                `;
            }
        } catch (e) {
            detailBox.innerHTML = `<div style="color:red">Error loading definition.</div>`;
        }
        detailBox.dataset.loaded = 'true';
    }

    renderList();
</script>


</body>
</html>
