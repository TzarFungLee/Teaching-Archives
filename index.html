<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTF Teaching Archives</title>
    <style>
        :root { --primary: #0b3d91; --primary-2: #062b6e; --bg: linear-gradient(180deg,#fef9f3 0%,#faf6f1 100%); --surface: #ffffff; --text: #083344; --muted: #5b6b70; --border: rgba(8,51,68,0.08); }
        body { font-family: 'Segoe UI', Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); padding: 28px; padding-bottom: 140px; line-height: 1.8; font-size: 18px; }
        .container { max-width: 900px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 20px; padding: 20px; }
        h1 { color: var(--primary); margin-bottom: 10px; font-size: 2.5em; font-weight: 700; }
        .subtitle { color: #64748b; font-size: 1.2rem; margin: 10px 0; }
        .instructions { background: #f0f9ff; border-left: 5px solid var(--primary); padding: 15px 20px; margin: 20px 0; border-radius: 5px; font-size: 1rem; }

        .tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab-btn { background: transparent; border: 2px solid var(--border); padding: 12px 28px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); transition: all 0.18s ease; font-size: 1rem; }
        .tab-btn:hover { background: rgba(11,61,145,0.1); color: var(--primary); border-color: var(--primary); }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 8px 20px rgba(6,22,23,0.15); }

        .search-wrapper { margin-bottom: 30px; }
        input { width: 100%; padding: 16px; border: 2px solid var(--border); border-radius: 8px; font-size: 1.1rem; box-sizing: border-box; transition: border-color 0.2s; }
        input:focus { border-color: var(--primary); outline: none; }

        .resource-card {
            background: linear-gradient(180deg,#ffffff,#fbffff); padding: 24px; border-radius: 12px; border: 2px solid var(--border);
            display: block; margin-bottom: 18px;
            cursor: pointer; transition: all 0.2s ease; text-decoration: none; color: inherit;
            box-shadow: 0 8px 18px rgba(2,30,80,0.04);
        }
        .resource-card:hover { transform: translateY(-8px); box-shadow: 0 18px 40px rgba(2,30,80,0.12); border-color: var(--primary); }

        .tags-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
        .tag { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: 700; letter-spacing: 0.3px; }
        .tag-grammar { background: #e6f3ff; color: #0a3d7a; border: 2px solid #b3d9ff; }
        .tag-writing { background: #fff4e6; color: #7a4a0a; border: 2px solid #ffd9b3; }
        .tag-secondary { background: #fce7f3; color: #831843; border: 2px solid #fbcfe8; }

        .resource-card h3 { margin: 0 0 8px 0; font-size: 1.5em; color: var(--primary); }
        .resource-card p { margin: 0; color: #5b6b70; font-size: 1rem; }

        .no-results { text-align: center; padding: 60px 20px; color: #94a3b8; font-size: 1.1rem; }
        
        /* Password Protection Styles */
        #password-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        #password-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 400px; width: 90%; text-align: center; }
        #password-box h2 { margin: 0 0 10px 0; color: #1e293b; font-size: 1.8rem; }
        #password-box p { color: #64748b; margin-bottom: 25px; }
        #password-input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; box-sizing: border-box; margin-bottom: 15px; }
        #password-input:focus { border-color: #667eea; outline: none; }
        #password-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        #password-btn:hover { transform: translateY(-2px); }
        #password-error { color: #dc2626; margin-top: 15px; font-size: 0.9rem; display: none; }
        .content-hidden { display: none !important; }
    </style>
</head>
<body>

<!-- Password Protection -->
<div id="password-overlay">
    <div id="password-box">
        <h2>🔒 Protected Content</h2>
        <p>Please enter the password to access the teaching archives</p>
        <input type="password" id="password-input" placeholder="Enter password" onkeypress="if(event.key==='Enter') checkPassword()">
        <button id="password-btn" onclick="checkPassword()">Unlock</button>
        <div id="password-error">Incorrect password. Please try again.</div>
    </div>
</div>

<div class="container content-hidden">
    <header>
        <h1>📚 LTF Teaching Archives</h1>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="filterTab('All', this)">All Topics</button>
        <button class="tab-btn" onclick="filterTab('Reading', this)">Reading</button>
        <button class="tab-btn" onclick="filterTab('Grammar', this)">Grammar</button>
        <button class="tab-btn" onclick="filterTab('Writing', this)">Writing</button>
        <button class="tab-btn" onclick="filterTab('Listening', this)">Listening</button>
    </div>

    <div class="search-wrapper">
        <input type="text" id="search" placeholder="🔍 Search for a resource..." onkeyup="renderList()">
    </div>

    <div id="list" class="resource-list"></div>
</div>

<script>
    // Password Protection
    const CORRECT_PASSWORD = 'i will cry if you do not pass'; // Change this to your desired password
    
    function checkPassword() {
        const input = document.getElementById('password-input').value;
        if (input === CORRECT_PASSWORD) {
            document.getElementById('password-overlay').style.display = 'none';
            document.querySelector('.container').classList.remove('content-hidden');
            sessionStorage.setItem('authenticated', 'true');
        } else {
            document.getElementById('password-error').style.display = 'block';
            document.getElementById('password-input').value = '';
            document.getElementById('password-input').focus();
        }
    }
    
    // Check if already authenticated in this session
    if (sessionStorage.getItem('authenticated') === 'true') {
        document.getElementById('password-overlay').style.display = 'none';
        document.querySelector('.container').classList.remove('content-hidden');
    }
    
    const resources = [
        {
            id: 1,
            title: "Paper 2 - Writing Formats",
            category: "Writing",
            file: "Writing/Text Types.html"
        },
        {
            id: 2,
            title: "First Conditional - IF Sentences",
            category: "Grammar",
            Grade: "S2",
            file: "Grammar/First Conditional.html"
        },
        {
            id: 3,
            title: "Second Conditional - Imaginary IF",
            Grade: "S2",
            category: "Grammar",
            file: "Grammar/Second Conditional.html"
        },
        {
            id: 4,
            title: "Passive Voice",
            Grade: ["S2", "S3"],
            category: "Grammar",
            file: "Grammar/Passive Voice.html"
        },
        {
            id: 5,
            title: "Pronouns Table",
            Grade: ["S1", "S2", "S3"],
            category: "Grammar",
            file: "Grammar/Pronoun Table.html"
        },
        {
            id: 6,
            title: "Tenses",
            Grade: ["S1", "S2", "S3"],            
            category: "Grammar",
            file: "Grammar/Tenses.html"
        },
        {
            id: 7,
            title: "So, So That, and So As To",
            category: "Grammar",
            Grade: ["S2", "S3"],
            file: "Grammar/So That So As To.html"
        },
        {
            id: 8,
            title: "Defining and Non-Defining Relative Clauses",
            category: "Grammar",
            Grade: ["S2", "S3"],
            file: "Grammar/Defining Non-Defining Relative Clauses.html"
        },
        {
            id: 9,
            title: "Unless",
            category: "Grammar",
            Grade: "S3",
            file: "Grammar/Unless.html"
        },
        {
            id: 10,
            title: "Comparative and Superlative Adjectives",
            category: "Grammar",
            Grade: "S2",
            file: "Grammar/Comparative and Superlative Adjectives.html"
        },
        {
            id: 11,
            title: "Connectives: Because, Since, So",
            category: "Grammar",
            Grade: "S2",
            file: "Grammar/Connectives Because Since So.html"
        },
        {
            id: 12,
            title: "Connectives: So, Therefore, As a result",
            category: "Grammar",
            Grade: "S2",
            file: "Grammar/Connectives So Therefore As a result.html"
        },
        {
            id: 13,
            title: "Adverbs of Sequence",
            category: "Grammar",
            Grade: "S2",
            file: "Grammar/Adverbs of Sequence.html"
        },
        {
            id: 14,
            title: "Prepositions of Movement",
            category: "Grammar",
            Grade: "S1",
            file: "Grammar/Prepositions of Movement.html"
        },
        {
            id: 15,
            title: "Must, Have to, Need to",
            category: "Grammar",
            Grade: "S3",
            file: "Grammar/Must Have to Need to.html"
        },
        {
            id: 16,
            title: "Paper 3 - Strategies",
            category: "Listening",
            Grade: "DSE",
            file: "Listening/Listening Strategies.html"
        },
        {
            id: 17,
            title: "Paper 3 - Key Vocabulary",
            category: "Listening",
            Grade: "DSE",
            file: "Listening/Listening Vocabulary.html"
        },
        {
            id: 18,
            title: "Paper 1 - Strategies",
            category: "Reading",
            Grade: "DSE",
            file: "Reading/Tips.html"
        },
        {
            id: 19,
            title: "Paper 1 - Vocabulary Building",
            category: "Reading",
            Grade: "DSE",
            file: "Reading/Reading Vocabulary.html"
        },
        {
            id: 20,
            title: "Paper 1 - Understanding Question Types",
            category: "Reading",
            Grade: "DSE",
            file: "Reading/Question Types.html"
        }
    ];

    let currentTab = 'All';

    function filterTab(tabName, btnElement) {
        currentTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderList();
    }

    function renderList() {
        const query = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('list');
        container.innerHTML = '';

        const filtered = resources.filter(item => {
            const matchSearch = item.title.toLowerCase().includes(query) || 
                              item.category.toLowerCase().includes(query) ||
                              (item.Grade && (Array.isArray(item.Grade) 
                                ? item.Grade.some(tag => tag.toLowerCase().includes(query))
                                : item.Grade.toLowerCase().includes(query)));
            
            const matchTab = currentTab === 'All' || item.category === currentTab;
            return matchSearch && matchTab;
        });

        if (!filtered.length) {
            container.innerHTML = `<div class="no-results">No resources found. Try a different search or choose a different topic.</div>`;
            return;
        }

        filtered.forEach(item => {
            const link = document.createElement('a');
            link.className = 'resource-card';
            link.href = item.file;
            
            const tagClass = item.category === 'Grammar' ? 'tag-grammar' : 'tag-writing';
            const tagLabel = item.category;
            
            let secondaryTagHTML = '';
            if (item.Grade) {
                const tags = Array.isArray(item.Grade) ? item.Grade : [item.Grade];
                secondaryTagHTML = tags.map(tag => `<span class="tag tag-secondary">${tag}</span>`).join('');
            }

            link.innerHTML = `
                <div>
                    <div class="tags-row"><span class="tag ${tagClass}">${tagLabel}</span>${secondaryTagHTML}</div>
                    <h3>${item.title}</h3>
                </div>
            `;
            container.appendChild(link);
        });
    }

    renderList();
</script>

</body>
</html>
