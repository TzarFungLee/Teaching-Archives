<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Resources</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Navigation */
        .nav-bar { margin-bottom: 20px; }
        .back-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 1rem; display: flex; align-items: center; padding: 0; }
        
        /* Headers */
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary); margin-bottom: 5px; }

        /* TABS (Main Page) */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: white; border: 1px solid var(--border); padding: 8px 24px; border-radius: 20px; cursor: pointer; font-weight: 500; color: #64748b; transition: all 0.2s; }
        .tab-btn:hover { background: #f1f5f9; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Search & List */
        .search-wrapper { margin-bottom: 25px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        
        .resource-card {
            background: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
            cursor: pointer; transition: transform 0.2s;
        }
        .resource-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        /* Tags */
        .tags-row { display: flex; gap: 6px; margin-bottom: 4px; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .tag-level { background: #e0e7ff; color: #3730a3; }
        .tag-subject { background: #f1f5f9; color: #475569; }

        /* SUBPAGE GRID SYSTEM (New!) */
        .text-type-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .text-type-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .text-type-card:hover { border-color: var(--primary); background: #eff6ff; }
        .text-type-card.active { background: var(--primary); color: white; border-color: var(--primary); }
        .text-type-icon { font-size: 24px; margin-bottom: 8px; display: block; }

        /* Content Areas */
        .subpage-content { background: var(--surface); padding: 30px; border-radius: 8px; border: 1px solid var(--border); min-height: 400px;}
        .content-section { display: none; animation: fadeIn 0.3s; } /* Hidden by default */
        .content-section.show { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #eee; border-radius: 8px; margin-bottom: 25px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .essay-box { background: #fdfbf7; border-left: 4px solid var(--primary); padding: 20px; white-space: pre-wrap; font-family: "Georgia", serif; }

        .hidden { display: none !important; }
        .btn { background-color: var(--primary); color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; border: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="listView">
        <header>
            <h1>📂 Course Materials</h1>
            <div style="color: #64748b">Filter by form level</div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="filterTab('All', this)">All</button>
            <button class="tab-btn" onclick="filterTab('S1', this)">S1</button>
            <button class="tab-btn" onclick="filterTab('S2', this)">S2</button>
            <button class="tab-btn" onclick="filterTab('S3', this)">S3</button>
            <button class="tab-btn" onclick="filterTab('DSE', this)">DSE</button>
        </div>

        <div class="search-wrapper">
            <input type="text" id="search" placeholder="🔍 Search resources..." onkeyup="renderList()">
        </div>

        <div id="list" class="resource-list"></div>
    </div>

    <div id="detailView" class="hidden">
        <div class="nav-bar">
            <button onclick="showList()" class="back-btn">← Back to List</button>
        </div>
        <div id="detailContent" class="subpage-content"></div>
    </div>

</div>

<script>
    // ==========================================
    // DATA CONFIGURATION
    // ==========================================
    const resources = [
        {
            id: 1,
            title: "English Writing Text Types", // Renamed as requested
            subject: "English",
            level: ["S3", "DSE"],
            notes: "8 Main Genres",
            
            // This huge string contains the "Mini App" for the writing types
            htmlContent: `
                <h2 style="margin-top:0">Writing Text Types Dashboard</h2>
                <p>Select a text type below to view structure, samples, and useful phrases.</p>
                
                <!-- GRID MENU -->
                <div class="text-type-grid">
                    <div class="text-type-card active" onclick="switchTextType('arg', this)">
                        <span class="text-type-icon">⚖️</span> Argumentative
                    </div>
                    <div class="text-type-card" onclick="switchTextType('letter', this)">
                        <span class="text-type-icon">✉️</span> Letter to Ed.
                    </div>
                    <div class="text-type-card" onclick="switchTextType('proposal', this)">
                        <span class="text-type-icon">📋</span> Proposal
                    </div>
                    <div class="text-type-card" onclick="switchTextType('report', this)">
                        <span class="text-type-icon">📊</span> Report
                    </div>
                    <div class="text-type-card" onclick="switchTextType('article', this)">
                        <span class="text-type-icon">📰</span> Article
                    </div>
                    <div class="text-type-card" onclick="switchTextType('speech', this)">
                        <span class="text-type-icon">🎤</span> Speech
                    </div>
                    <div class="text-type-card" onclick="switchTextType('story', this)">
                        <span class="text-type-icon">📖</span> Story
                    </div>
                    <div class="text-type-card" onclick="switchTextType('blog', this)">
                        <span class="text-type-icon">💻</span> Blog
                    </div>
                </div>

                <!-- CONTENT SECTIONS (Only one shows at a time) -->
                
                <!-- 1. Argumentative -->
                <div id="arg" class="content-section show">
                    <h3>⚖️ Argumentative Essay</h3>
                    <p><strong>Tone:</strong> Formal, Objective, Persuasive</p>
                    <div class="video-container">
                        <!-- Argumentative PPT Embed -->
                        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vR6x_dD-sKq-tAPFqI6LzQ8V_V7V8zL4F6kX-pQ/embed?start=false&loop=false&delayms=3000"></iframe>
                    </div>
                    <h4>Sample Opening</h4>
                    <div class="essay-box">"Recent debates concerning X have sparked controversy. While some argue that..., others believe..."</div>
                </div>

                <!-- 2. Letter to Editor -->
                <div id="letter" class="content-section">
                    <h3>✉️ Letter to the Editor</h3>
                    <p><strong>Tone:</strong> Formal, Critical but polite</p>
                    <h4>Structure Guide</h4>
                    <ul>
                        <li><strong>Salutation:</strong> Dear Editor,</li>
                        <li><strong>Opening:</strong> I am writing to express my views on...</li>
                        <li><strong>Body:</strong> 3 clear points with evidence.</li>
                        <li><strong>Closing:</strong> I hope the government will take action...</li>
                        <li><strong>Sign-off:</strong> Yours faithfully, Chris Wong</li>
                    </ul>
                </div>

                <!-- 3. Proposal -->
                <div id="proposal" class="content-section">
                    <h3>📋 Proposal</h3>
                    <p><strong>Tone:</strong> Persuasive, Solution-oriented</p>
                    <div class="essay-box">
Title: Proposal on Improving School Facilities
To: The Principal
From: Chris Wong, Head Prefect
Date: 18 Jan 2026

1. Introduction
The purpose of this proposal is to suggest upgrades to...
                    </div>
                </div>

                <!-- 4. Report -->
                <div id="report" class="content-section">
                    <h3>📊 Report</h3>
                    <p><strong>Tone:</strong> Factual, Past Tense, Passive Voice</p>
                    <p>Remember to use headings like <strong>Findings</strong>, <strong>Analysis</strong>, and <strong>Recommendations</strong>.</p>
                </div>

                <!-- 5. Article -->
                <div id="article" class="content-section">
                    <h3>📰 Feature Article</h3>
                    <p><strong>Tone:</strong> Engaging, Semi-formal, Catchy Title needed.</p>
                </div>

                <!-- 6. Speech -->
                <div id="speech" class="content-section">
                    <h3>🎤 Speech</h3>
                    <p><strong>Tone:</strong> Engaging, Rhetorical questions, Direct address ("You")</p>
                    <div class="essay-box">"Good morning Principal, teachers and fellow students. Today, I would like to talk about..."</div>
                </div>

                <!-- 7. Story -->
                <div id="story" class="content-section">
                    <h3>📖 Short Story</h3>
                    <p><strong>Focus:</strong> Imagery, Descriptive adjectives, Show don't tell.</p>
                </div>

                <!-- 8. Blog -->
                <div id="blog" class="content-section">
                    <h3>💻 Blog Post</h3>
                    <p><strong>Tone:</strong> Chatty, Personal, "Comment below!"</p>
                </div>
            `
        },
        // ... Other resources ...
        {
            id: 2,
            title: "Math: Geometry Basics",
            subject: "Math",
            level: ["S1"],
            notes: "Angles and Lines",
            link: "#"
        }
    ];

    // ==========================================
    // LOGIC
    // ==========================================
    let currentTab = 'All';

    // 1. Filter Logic (Main Page)
    function filterTab(tabName, btnElement) {
        currentTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderList();
    }

    function renderList() {
        const query = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('list');
        container.innerHTML = '';

        const filtered = resources.filter(item => {
            const itemLevels = Array.isArray(item.level) ? item.level : [item.level];
            const searchMatch = item.title.toLowerCase().includes(query) || item.subject.toLowerCase().includes(query);
            const tabMatch = currentTab === 'All' || itemLevels.includes(currentTab);
            return searchMatch && tabMatch;
        });

        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8">No resources found.</div>`;
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'resource-card';
            const levels = Array.isArray(item.level) ? item.level : [item.level];
            const badgesHTML = levels.map(lvl => `<span class="tag tag-level">${lvl}</span>`).join('');
            const action = item.htmlContent ? `onclick="openPage(${item.id})"` : `onclick="window.open('${item.link}', '_blank')"`;
            
            div.innerHTML = `
                <div onclick="event.stopPropagation(); ${action}" style="flex-grow:1">
                    <div class="tags-row">${badgesHTML}<span class="tag tag-subject">${item.subject}</span></div>
                    <h3 style="margin:0 0 5px 0">${item.title}</h3>
                    <div style="font-size:0.85rem; color:#64748b">${item.notes}</div>
                </div>
                <button class="btn" ${action}>View</button>
            `;
            container.appendChild(div);
        });
    }

    function openPage(id) {
        const item = resources.find(r => r.id === id);
        if(!item || !item.htmlContent) return;
        document.getElementById('listView').classList.add('hidden');
        document.getElementById('detailView').classList.remove('hidden');
        document.getElementById('detailContent').innerHTML = item.htmlContent;
        window.scrollTo(0,0);
        
        // IMPORTANT: Re-attach the switching logic since we just injected new HTML
        window.switchTextType = function(typeId, btn) {
            // 1. Reset all buttons
            document.querySelectorAll('.text-type-card').forEach(b => b.classList.remove('active'));
            // 2. Activate clicked button
            btn.classList.add('active');
            
            // 3. Hide all content
            document.querySelectorAll('.content-section').forEach(c => c.classList.remove('show'));
            // 4. Show selected content
            document.getElementById(typeId).classList.add('show');
        }
    }

    function showList() {
        document.getElementById('detailView').classList.add('hidden');
        document.getElementById('listView').classList.remove('hidden');
        document.getElementById('detailContent').innerHTML = ''; 
    }

    renderList();
</script>

</body>
</html>
