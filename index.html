<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Resources</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Navigation */
        .nav-bar { margin-bottom: 20px; }
        .back-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 1rem; display: flex; align-items: center; padding: 0; }
        
        /* Headers */
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary); margin-bottom: 5px; }

        /* TABS (Main Page) */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: white; border: 1px solid var(--border); padding: 8px 24px; border-radius: 20px; cursor: pointer; font-weight: 500; color: #64748b; transition: all 0.2s; }
        .tab-btn:hover { background: #f1f5f9; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Search & List */
        .search-wrapper { margin-bottom: 25px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        
        .resource-card {
            background: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
            cursor: pointer; transition: transform 0.2s;
        }
        .resource-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        /* Tags */
        .tags-row { display: flex; gap: 6px; margin-bottom: 4px; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .tag-level { background: #e0e7ff; color: #3730a3; }
        .tag-subject { background: #f1f5f9; color: #475569; }

        /* SUBPAGE GENERAL */
        .subpage-content { background: var(--surface); padding: 30px; border-radius: 8px; border: 1px solid var(--border); min-height: 400px;}
        .hidden { display: none !important; }
        .btn { background-color: var(--primary); color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; border: none; font-size: 0.9rem; }

        /* --- VOCABULARY APP STYLES --- */
        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        
        .vocab-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            background: #fff;
            transition: all 0.2s;
        }
        .vocab-card h3 { margin: 0 0 5px 0; color: var(--primary); font-size: 1.2rem; }
        .vocab-meta { font-size: 0.85rem; color: #64748b; margin-bottom: 10px; font-style: italic; }
        .vocab-def { font-size: 0.95rem; margin-bottom: 10px; line-height: 1.4; }
        .vocab-synonyms { font-size: 0.85rem; color: #475569; background: #f1f5f9; padding: 8px; border-radius: 6px; }
        
        .translate-btn {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #2563eb;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid #2563eb;
            padding: 4px 10px;
            border-radius: 4px;
        }
        .translate-btn:hover { background: #eff6ff; }
        
        /* Loading State */
        .skeleton { height: 20px; background: #eee; margin-bottom: 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="listView">
        <header>
            <h1>📂 Course Materials</h1>
            <div style="color: #64748b">Filter by form level</div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="filterTab('All', this)">All</button>
            <button class="tab-btn" onclick="filterTab('S1', this)">S1</button>
            <button class="tab-btn" onclick="filterTab('S2', this)">S2</button>
            <button class="tab-btn" onclick="filterTab('S3', this)">S3</button>
            <button class="tab-btn" onclick="filterTab('DSE', this)">DSE</button>
        </div>

        <div class="search-wrapper">
            <input type="text" id="search" placeholder="🔍 Search resources..." onkeyup="renderList()">
        </div>

        <div id="list" class="resource-list"></div>
    </div>

    <div id="detailView" class="hidden">
        <div class="nav-bar">
            <button onclick="showList()" class="back-btn">← Back to List</button>
        </div>
        <div id="detailContent" class="subpage-content"></div>
    </div>

</div>

<script>
    // ==========================================
    // 1. TEACHER: LIST YOUR WORDS HERE
    // ==========================================
    const myVocabList = [
        "abundant", "benevolent", "candid", "diligent", "empathy", 
        "feasible", "gratitude", "hypothetical", "inevitable", "juxtapose"
    ];

    // ==========================================
    // DATA RESOURCES
    // ==========================================
    const resources = [
        {
            id: 999, // Unique ID for Vocab
            title: "Smart Vocabulary List (S4-S6)",
            subject: "English",
            level: ["S4", "S5", "DSE"],
            notes: "Auto-generated definitions",
            htmlContent: `
                <h2>DSE High Frequency Words</h2>
                <p>These definitions are loaded live from the dictionary.</p>
                <div id="vocab-container" class="vocab-grid">
                    <div style="text-align:center; width:100%; grid-column: 1/-1;">Loading words...</div>
                </div>
            `
        },
        // ... Your existing resources ...
        {
            id: 1,
            title: "English Writing Text Types", 
            subject: "English",
            level: ["S3", "DSE"],
            notes: "8 Main Genres",
            htmlContent: `<h2>Writing Text Types</h2><p>Select a text type...</p>` // (Simplified for brevity)
        }
    ];

    // ==========================================
    // APP LOGIC
    // ==========================================
    let currentTab = 'All';

    function filterTab(tabName, btnElement) {
        currentTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderList();
    }

    function renderList() {
        const query = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('list');
        container.innerHTML = '';

        const filtered = resources.filter(item => {
            const itemLevels = Array.isArray(item.level) ? item.level : [item.level];
            const matchesSearch = item.title.toLowerCase().includes(query) || item.subject.toLowerCase().includes(query);
            const matchesTab = currentTab === 'All' || itemLevels.includes(currentTab);
            return matchesSearch && matchesTab;
        });

        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8">No resources found.</div>`;
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'resource-card';
            const levels = Array.isArray(item.level) ? item.level : [item.level];
            const badgesHTML = levels.map(lvl => `<span class="tag tag-level">${lvl}</span>`).join('');
            const action = item.htmlContent ? `onclick="openPage(${item.id})"` : `onclick="window.open('${item.link}', '_blank')"`;
            
            div.innerHTML = `
                <div onclick="event.stopPropagation(); ${action}" style="flex-grow:1">
                    <div class="tags-row">${badgesHTML}<span class="tag tag-subject">${item.subject}</span></div>
                    <h3 style="margin:0 0 5px 0">${item.title}</h3>
                    <div style="font-size:0.85rem; color:#64748b">${item.notes}</div>
                </div>
                <button class="btn" ${action}>View</button>
            `;
            container.appendChild(div);
        });
    }

    function openPage(id) {
        const item = resources.find(r => r.id === id);
        if(!item || !item.htmlContent) return;
        document.getElementById('listView').classList.add('hidden');
        document.getElementById('detailView').classList.remove('hidden');
        document.getElementById('detailContent').innerHTML = item.htmlContent;
        window.scrollTo(0,0);

        // If this is the Vocab Page, trigger the AI loader
        if(id === 999) {
            loadVocab();
        }
    }

    function showList() {
        document.getElementById('detailView').classList.add('hidden');
        document.getElementById('listView').classList.remove('hidden');
        document.getElementById('detailContent').innerHTML = ''; 
    }

    // ==========================================
    // DICTIONARY "AI" LOGIC
    // ==========================================
    async function loadVocab() {
        const container = document.getElementById('vocab-container');
        container.innerHTML = ''; // Clear loading text

        for (const word of myVocabList) {
            // Create a skeleton card first (UI trick for perceived speed)
            const card = document.createElement('div');
            card.className = 'vocab-card';
            card.innerHTML = `<h3>${word}</h3><div class="skeleton" style="width:60%"></div><div class="skeleton"></div>`;
            container.appendChild(card);

            try {
                // Fetch data from Free Dictionary API
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                const data = await response.json();

                if(Array.isArray(data)) {
                    const entry = data[0];
                    const meaning = entry.meanings[0];
                    const def = meaning.definitions[0].definition;
                    const pos = meaning.partOfSpeech;
                    // Get up to 3 synonyms
                    const synonyms = meaning.synonyms.slice(0, 3).join(", ") || "No direct synonyms";

                    // Update the card with real data
                    card.innerHTML = `
                        <h3>${word}</h3>
                        <div class="vocab-meta">${pos}</div>
                        <div class="vocab-def">${def}</div>
                        <div class="vocab-synonyms"><strong>Syn:</strong> ${synonyms}</div>
                        <a href="https://translate.google.com/?sl=en&tl=zh-TW&text=${word}&op=translate" target="_blank" class="translate-btn">See Chinese Translation ↗</a>
                    `;
                } else {
                    card.innerHTML = `<h3>${word}</h3><div style="color:red">Definition not found.</div>`;
                }

            } catch (err) {
                console.error(err);
                card.innerHTML = `<h3>${word}</h3><div style="color:red">Error loading.</div>`;
            }
        }
    }

    renderList();
</script>

</body>
</html>
