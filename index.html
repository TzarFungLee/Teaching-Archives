---
layout: default
title: "Home"
icon: "🏠"
---

<style>
    .subtitle {
        color: var(--accent);
        font-size: 1.35rem;
        margin: 16px 0;
        text-align: center;
        font-weight: 500;
        letter-spacing: 0.02em;
    }

    .instructions {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(110, 193, 228, 0.22);
        padding: 30px 28px;
        margin: 30px auto 40px auto;
        border-radius: 28px;
        font-size: 1.15rem;
        text-align: center;
        max-width: 720px;
        color: #d9e9ff;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(14px);
    }

    .tabs {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 36px;
        flex-wrap: wrap;
    }

    .tab-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 14px 24px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 700;
        color: #c7d7ec;
        transition: all 0.25s ease;
        font-size: 1.05rem;
        min-width: 130px;
        letter-spacing: 0.01em;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
    }

    .tab-btn:hover {
        background: rgba(110, 193, 228, 0.18);
        color: #f5fcff;
        transform: translateY(-1px);
    }

    .tab-btn.active {
        background: linear-gradient(135deg, rgba(110, 193, 228, 0.35), rgba(63, 141, 188, 0.28));
        color: #effcff;
        border-color: rgba(110, 193, 228, 0.35);
        box-shadow: 0 20px 48px rgba(16, 38, 62, 0.28);
    }

    .search-wrapper {
        margin-bottom: 42px;
        position: relative;
    }

    input {
        width: 100%;
        padding: 20px 24px 20px 56px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 22px;
        font-size: 1.1rem;
        box-sizing: border-box;
        transition: border-color 0.25s ease, background 0.25s ease;
        box-shadow: inset 0 2px 14px rgba(0, 0, 0, 0.25);
        background: rgba(255, 255, 255, 0.05);
        color: #edf7ff;
        font-family: inherit;
    }

    input::placeholder {
        color: rgba(231, 238, 247, 0.62);
    }

    input:focus {
        border-color: rgba(110, 193, 228, 0.5);
        outline: none;
        background: rgba(255, 255, 255, 0.08);
    }

    .search-icon {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1.4rem;
        color: rgba(255, 255, 255, 0.75);
    }

    .resource-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 24px;
    }

    .resource-card {
        background: rgba(255, 255, 255, 0.05);
        padding: 32px;
        border-radius: 28px;
        border: 1px solid rgba(110, 193, 228, 0.15);
        display: block;
        cursor: pointer;
        transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        text-decoration: none;
        color: inherit;
        position: relative;
        overflow: hidden;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
        min-height: 170px;
    }

    .resource-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(110, 193, 228, 0.08), transparent 40%);
        pointer-events: none;
    }

    .resource-card:hover {
        transform: translateY(-5px);
        border-color: rgba(110, 193, 228, 0.42);
        box-shadow: 0 26px 70px rgba(0, 0, 0, 0.26);
        background: rgba(255, 255, 255, 0.08);
    }

    .tags-row {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
        align-items: center;
        flex-wrap: wrap;
        position: relative;
        z-index: 1;
    }

    .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .tag-grammar {
        background: rgba(110, 193, 228, 0.12);
        color: #b7e6ff;
        border: 1px solid rgba(110, 193, 228, 0.22);
    }

    .tag-writing {
        background: rgba(143, 160, 255, 0.12);
        color: #d5d8ff;
        border: 1px solid rgba(143, 160, 255, 0.22);
    }

    .tag-reading {
        background: rgba(97, 205, 200, 0.12);
        color: #bdf4f0;
        border: 1px solid rgba(97, 205, 200, 0.22);
    }

    .tag-listening {
        background: rgba(115, 157, 255, 0.12);
        color: #d5e5ff;
        border: 1px solid rgba(115, 157, 255, 0.22);
    }

    .tag-quizzes {
        background: rgba(119, 225, 191, 0.12);
        color: #d7fff2;
        border: 1px solid rgba(119, 225, 191, 0.22);
    }

    .tag-secondary {
        background: rgba(255, 255, 255, 0.06);
        color: #d8e4f5;
        border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .resource-card h3 {
        margin: 0 0 12px 0;
        font-size: 1.85rem;
        color: #f7fbff;
        font-weight: 800;
        letter-spacing: -0.03em;
        position: relative;
        z-index: 1;
    }

    .resource-card:hover h3 {
        color: #d1f4ff;
    }

    .no-results {
        text-align: center;
        padding: 60px 20px;
        color: #a3bbd9;
        font-size: 1.35rem;
        font-weight: 600;
    }
</style>

<div class="instructions">
    👋 <strong>Welcome!</strong> Choose a topic below or type in the search box to find a lesson.
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="filterTab('All', this)">🌟 All Topics</button>
    <button class="tab-btn" onclick="filterTab('Reading', this)">📖 Reading</button>
    <button class="tab-btn" onclick="filterTab('Grammar', this)">🧩 Grammar</button>
    <button class="tab-btn" onclick="filterTab('Writing', this)">✍️ Writing</button>
    <button class="tab-btn" onclick="filterTab('Listening', this)">🎧 Listening</button>
    <button class="tab-btn" onclick="filterTab('Quizzes', this)">📝 Quizzes</button>
</div>

<div class="search-wrapper">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search for a lesson (e.g. 'Tenses' or 'Writing')..." onkeyup="renderList()">
</div>

<div id="list" class="resource-list"></div>

<script>
    const resources = [
{% assign sorted_pages = site.pages | sort: "title" %}
{% assign first = true %}
{% for p in sorted_pages %}
    {% if p.title and p.category and p.url != '/' %}
        {% unless first %},{% endunless %}
        {
            title: {{ p.title | jsonify }},
            category: {{ p.category | jsonify }},
            icon: {{ p.icon | jsonify }},
            file: "{{ p.url | relative_url | replace: ' ', '%20' }}"
        }{% assign first = false %}
    {% endif %}
{% endfor %}
    ];

    let currentTab = 'All';

    function filterTab(tabName, btnElement) {
        currentTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderList();
    }

    function renderList() {
        const query = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('list');
        container.innerHTML = '';

        const filtered = resources.filter(item => {
            const matchSearch = item.title.toLowerCase().includes(query) || 
                              item.category.toLowerCase().includes(query);
            
            const matchTab = currentTab === 'All' || item.category === currentTab;
            return matchSearch && matchTab;
        });

        if (!filtered.length) {
            container.innerHTML = `<div class="no-results">No lessons found. Try a different search!</div>`;
            return;
        }

        filtered.forEach(item => {
            const link = document.createElement('a');
            link.className = 'resource-card';
            link.href = item.file;
            
            let tagClass = 'tag-secondary';
            if(item.category === 'Grammar') tagClass = 'tag-grammar';
            else if(item.category === 'Writing') tagClass = 'tag-writing';
            else if(item.category === 'Reading') tagClass = 'tag-reading';
            else if(item.category === 'Listening') tagClass = 'tag-listening';
            else if(item.category === 'Quizzes') tagClass = 'tag-quizzes';

            link.innerHTML = `
                <div>
                    <div class="tags-row">
                        <span class="tag ${tagClass}">${item.icon} ${item.category}</span>
                    </div>
                    <h3>${item.title}</h3>
                </div>
            `;
            container.appendChild(link);
        });
    }

    // Sort alphabetically by title initially
    resources.sort((a, b) => a.title.localeCompare(b.title));
    renderList();
</script>
