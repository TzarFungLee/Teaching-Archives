<!-- Freytag's Pyramid -->
<div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; border-radius: 10px; margin: 25px 0; box-shadow: 0 6px 16px rgba(102, 126, 234, 0.3);">
    <h4 style="color: white; text-align: center; margin-top: 0; font-size: 1.1em; text-shadow: 2px 2px 4px rgba(0,0,0,0.2);">📖 Freytag's Pyramid - Story Structure Map!</h4>
    <svg viewBox="0 0 800 380" style="width: 100%; max-width: 700px; margin: 0 auto; display: block;">
        <!-- Background stars -->
        <circle cx="50" cy="50" r="2" fill="#ffd700" opacity="0.8">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="750" cy="60" r="2" fill="#ffd700" opacity="0.8">
            <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        
        <!-- The pyramid mountain shape -->
        <path d="M 100 340 L 100 290 L 250 140 L 400 40 L 550 140 L 700 290 L 700 340 Z" 
              fill="url(#pyramidGradient)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
        
        <defs>
            <linearGradient id="pyramidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#c471ed;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
            </linearGradient>
        </defs>
        
        <!-- Anime character 1: Exposition - Reading character -->
        <g transform="translate(100, 260)">
            <circle cx="0" cy="0" r="18" fill="#ffdbf0" stroke="#ff6b9d" stroke-width="2"/>
            <circle cx="-5" cy="-3" r="2" fill="#333"/>
            <circle cx="5" cy="-3" r="2" fill="#333"/>
            <path d="M -4 3 Q 0 6 4 3" stroke="#ff6b9d" stroke-width="1.5" fill="none"/>
            <rect x="-8" y="20" width="16" height="20" rx="3" fill="#ff6b9d"/>
            <circle cx="-12" cy="15" r="3" fill="#ffdbf0"/>
            <circle cx="12" cy="15" r="3" fill="#ffdbf0"/>
        </g>
        <text x="100" y="305" font-size="20" text-anchor="middle">📚</text>
        
        <!-- Anime character 2: Rising Action - Horrified character -->
        <g transform="translate(250, 110)">
            <circle cx="0" cy="0" r="18" fill="#e9d5ff" stroke="#c471ed" stroke-width="2"/>
            <!-- Wide scared eyes -->
            <circle cx="-5" cy="-3" r="3" fill="#333"/>
            <circle cx="5" cy="-3" r="3" fill="#333"/>
            <circle cx="-5" cy="-3" r="1" fill="white"/>
            <circle cx="5" cy="-3" r="1" fill="white"/>
            <!-- Open scared mouth -->
            <ellipse cx="0" cy="6" rx="4" ry="6" fill="#333"/>
            <rect x="-8" y="20" width="16" height="20" rx="3" fill="#c471ed"/>
            <line x1="-15" y1="28" x2="-20" y2="35" stroke="#c471ed" stroke-width="3"/>
            <line x1="15" y1="28" x2="20" y2="22" stroke="#c471ed" stroke-width="3"/>
        </g>
        <text x="250" y="150" font-size="20" text-anchor="middle">🚀</text>
        
        <!-- Anime character 3: Climax - Hero pose with energy -->
        <g transform="translate(400, 30)">
            <circle cx="-3" cy="-8" r="3" fill="#ffd700" opacity="0.7">
                <animate attributeName="r" values="3;5;3" dur="1s" repeatCount="indefinite"/>
            </circle>
            <circle cx="3" cy="-8" r="3" fill="#ffd700" opacity="0.7">
                <animate attributeName="r" values="3;5;3" dur="1s" repeatCount="indefinite"/>
            </circle>
            <circle cx="0" cy="0" r="20" fill="#ffd700" stroke="#ffd700" stroke-width="3"/>
            <circle cx="-6" cy="-3" r="3" fill="#333">
                <animate attributeName="cy" values="-3;-5;-3" dur="0.5s" repeatCount="indefinite"/>
            </circle>
            <circle cx="6" cy="-3" r="3" fill="#333">
                <animate attributeName="cy" values="-3;-5;-3" dur="0.5s" repeatCount="indefinite"/>
            </circle>
            <!-- Neutral mouth - just a line -->
            <line x1="-6" y1="6" x2="6" y2="6" stroke="#333" stroke-width="2"/>
            <rect x="-10" y="22" width="20" height="22" rx="3" fill="#ffd700"/>
            <line x1="-20" y1="30" x2="-28" y2="25" stroke="#ffd700" stroke-width="4"/>
            <line x1="20" y1="30" x2="28" y2="25" stroke="#ffd700" stroke-width="4"/>
        </g>
        <text x="400" y="75" font-size="22" text-anchor="middle">⭐</text>
        
        <!-- Anime character 4: Falling Action - Smiling character -->
        <g transform="translate(550, 110)">
            <circle cx="0" cy="0" r="18" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
            <circle cx="-5" cy="-3" r="2" fill="#333"/>
            <circle cx="5" cy="-3" r="2" fill="#333"/>
            <!-- Happy smile -->
            <path d="M -6 4 Q 0 8 6 4" stroke="#8b5cf6" stroke-width="2" fill="none"/>
            <rect x="-8" y="20" width="16" height="20" rx="3" fill="#8b5cf6"/>
            <path d="M -10 28 Q -8 32 -5 30" stroke="#ddd6fe" stroke-width="2" fill="none"/>
        </g>
        <text x="550" y="150" font-size="20" text-anchor="middle">💫</text>
        
        <!-- Anime character 5: Resolution - Very Happy character -->
        <g transform="translate(700, 260)">
            <circle cx="0" cy="0" r="18" fill="#dbeafe" stroke="#667eea" stroke-width="2"/>
            <!-- Happy eyes (curved) -->
            <path d="M -7 -4 Q -5 -2 -3 -4" stroke="#333" stroke-width="2" fill="none"/>
            <path d="M 3 -4 Q 5 -2 7 -4" stroke="#333" stroke-width="2" fill="none"/>
            <!-- Very wide happy smile -->
            <path d="M -8 4 Q 0 11 8 4" stroke="#667eea" stroke-width="2.5" fill="none"/>
            <rect x="-8" y="20" width="16" height="20" rx="3" fill="#667eea"/>
            <line x1="-15" y1="28" x2="-10" y2="35" stroke="#667eea" stroke-width="3"/>
            <line x1="15" y1="28" x2="10" y2="35" stroke="#667eea" stroke-width="3"/>
        </g>
        <text x="700" y="305" font-size="20" text-anchor="middle">🎉</text>
        
        <!-- Labels with white background bubbles (smaller) -->
        <rect x="45" y="315" width="110" height="40" rx="8" fill="white" stroke="#ff6b9d" stroke-width="2"/>
        <text x="100" y="332" font-size="11" font-weight="bold" text-anchor="middle" fill="#ff6b9d">EXPOSITION</text>
        <text x="100" y="345" font-size="9" text-anchor="middle" fill="#666">Beginning</text>
        
        <rect x="195" y="165" width="110" height="50" rx="8" fill="white" stroke="#c471ed" stroke-width="2"/>
        <text x="250" y="180" font-size="10" font-weight="bold" text-anchor="middle" fill="#c471ed">PROBLEM /</text>
        <text x="250" y="193" font-size="10" font-weight="bold" text-anchor="middle" fill="#c471ed">RISING ACTION</text>
        <text x="250" y="206" font-size="8" text-anchor="middle" fill="#666">Tension Builds</text>
        
        <rect x="345" y="60" width="110" height="40" rx="8" fill="#ffd700" stroke="#ff6b9d" stroke-width="3">
            <animate attributeName="y" values="60;57;60" dur="1.5s" repeatCount="indefinite"/>
        </rect>
        <text x="400" y="78" font-size="12" font-weight="bold" text-anchor="middle" fill="#d946ef">CLIMAX! 🔥</text>
        <text x="400" y="91" font-size="9" text-anchor="middle" fill="#666">Peak!</text>
        
        <rect x="495" y="165" width="110" height="50" rx="8" fill="white" stroke="#8b5cf6" stroke-width="2"/>
        <text x="550" y="180" font-size="10" font-weight="bold" text-anchor="middle" fill="#8b5cf6">SOLUTION /</text>
        <text x="550" y="193" font-size="10" font-weight="bold" text-anchor="middle" fill="#8b5cf6">FALLING ACTION</text>
        <text x="550" y="206" font-size="8" text-anchor="middle" fill="#666">Wrapping Up</text>
        
        <rect x="645" y="315" width="110" height="40" rx="8" fill="white" stroke="#667eea" stroke-width="2"/>
        <text x="700" y="332" font-size="11" font-weight="bold" text-anchor="middle" fill="#667eea">RESOLUTION</text>
        <text x="700" y="345" font-size="9" text-anchor="middle" fill="#666">The End</text>
        
        <!-- Decorative sparkles -->
        <text x="420" y="25" font-size="16" opacity="0.7">✨</text>
        <text x="380" y="25" font-size="16" opacity="0.7">✨</text>
    </svg>
    
    <div style="background: rgba(255,255,255,0.95); padding: 15px; border-radius: 8px; margin-top: 15px;">
        <p style="color: #333; margin: 0; text-align: center; font-size: 0.88rem; line-height: 1.6;">
            <strong style="color: #ff6b9d;">📚 Exposition:</strong> Introduce characters & setting → 
            <strong style="color: #c471ed;">🚀 Rising Action:</strong> Build tension & conflict → 
            <strong style="color: #d946ef;">⭐ Climax:</strong> The BIG moment! → 
            <strong style="color: #8b5cf6;">💫 Falling Action:</strong> After the peak → 
            <strong style="color: #667eea;">🎉 Resolution:</strong> Wrap it up!
        </p>
    </div>
</div>
