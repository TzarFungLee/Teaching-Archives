<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <style>
        :root { --primary: #0b3d91; --primary-2: #062b6e; --bg: linear-gradient(180deg,#fef9f3 0%,#faf6f1 100%); --surface: #ffffff; --text: #083344; --muted: #5b6b70; --border: rgba(8,51,68,0.08); }
        body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: var(--bg); color: var(--text); padding: 28px; line-height: 1.65; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary); margin-bottom: 5px; }
        .subtitle { color: #64748b; font-size: 0.95rem; }
        .nav-bar { margin-bottom: 20px; }
        .back-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 1rem; display: flex; align-items: center; padding: 0; text-decoration: none; }
        .back-btn:hover { text-decoration: underline; }
        .content { background: var(--surface); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        .resource-card { background: linear-gradient(180deg,#ffffff,#fbffff); padding: 18px; border-radius: 12px; border: 1px solid var(--border); display: block; margin-bottom: 14px; cursor: pointer; transition: transform 0.18s ease, box-shadow 0.18s ease; text-decoration: none; color: inherit; box-shadow: 0 8px 18px rgba(2,30,80,0.04); }
        .resource-card:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(2,30,80,0.08); }
        .tags-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.2px; }
        .tag-papers { background: linear-gradient(90deg,#e6eefb,#eaf4ff); color: #042a66; border: 1px solid rgba(6,42,111,0.08); }
        
        /* Lesson specific styles */
        mark { background-color: #fef3c7; padding: 2px 6px; border-radius: 3px; }
        mark.cyan { background-color: #a5f3fc; }
        mark.green { background-color: #bbf7d0; }
        mark.yellow { background-color: #fef3c7; }
        mark.red { background-color: #fecaca; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border: 1px solid #e2e8f0; text-align: left; }
        th { background: #eff6ff; font-weight: 600; }
        tr:nth-child(even) { background: #f8fafc; }
        hr { margin: 30px 0; border: none; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
<div class="container">
    {% block content %}{% endblock content %}
</div>
</body>
</html>
