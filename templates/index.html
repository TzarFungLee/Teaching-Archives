{% extends "base.html" %}

{% block content %}
    <header>
        <h1>{{ section.title }}</h1>
    </header>

    <div class="search-wrapper" style="margin-bottom: 25px;">
        <input type="text" id="search" placeholder="🔍 Search resources..." style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box;">
    </div>

    <div id="list" class="resource-list">
        {% set section_grammar = get_section(path="grammar/_index.md") %}
        
        {% for page in section_grammar.pages %}
        <a href="{{ page.permalink }}" class="resource-card">
            <div>
                <div class="tags-row">
                    <span class="tag tag-papers">Grammar</span>
                </div>
                <h3 style="margin:0 0 5px 0">{{ page.title }}</h3>
            </div>
        </a>
        {% endfor %}
    </div>

    <script>
        // Simple search functionality for the static list
        document.getElementById('search').addEventListener('keyup', function(e) {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.resource-card');
            
            cards.forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                if(title.includes(term)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>
{% endblock content %}
