# LTF Teaching Archives — curriculum structure.
# THE single source of truth for unit grouping and lesson order.
#
# Adding a lesson  = one line under its unit (slug + optional quiz).
# Adding a unit    = a new block (unit / icon / lessons).
# Reordering       = move lines. Nothing else on the site needs editing.
#
# Fail-soft: pages NOT listed here still appear in a "More resources"
# section at the bottom of their category — nothing can go invisible.
#
# Future (Writing): lessons there will also carry `level:` (e.g. P4/P5/DSE)
# for multi-level filtering. Grammar stays single-level by design.

grammar:
  - unit: "Foundations"
    icon: "🧱"
    lessons:
      - slug: /grammar/pronoun-table/
        quiz: /quizzes/pronoun-table-quiz/

