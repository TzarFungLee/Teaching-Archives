<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Second Conditional</title>
    <style>
        :root { --primary: #0b3d91; --primary-2: #062b6e; --bg: linear-gradient(180deg,#f0fbfb 0%,#f7fff9 100%); --surface: #ffffff; --text: #083344; --muted: #5b6b70; --border: rgba(8,51,68,0.08); --success: #10b981; --error: #ef4444; }
        body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: var(--bg); color: var(--text); padding: 28px; line-height: 1.65; }
        .container { max-width: 900px; margin: 0 auto; }

        .nav-bar { margin-bottom: 20px; }
        .back-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 1rem; display: flex; align-items: center; padding: 0; text-decoration: none; }
        .back-btn:hover { text-decoration: underline; }

        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary); margin-bottom: 5px; }

        .quiz-container { background: var(--surface); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }

        .question { margin-bottom: 30px; padding: 20px; background: #f8fafc; border-radius: 8px; border-left: 4px solid var(--primary); }
        .question-text { font-weight: 600; margin-bottom: 15px; font-size: 1.1rem; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option { padding: 12px 16px; background: white; border: 2px solid #e2e8f0; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .option:hover { border-color: var(--primary); background: #eff6ff; }
        .option input[type="radio"] { margin-right: 10px; cursor: pointer; }
        
        .feedback { margin-top: 10px; padding: 12px; border-radius: 6px; font-weight: 500; display: none; }
        .feedback.correct { background: #d1fae5; color: #065f46; border: 1px solid #10b981; display: block; }
        .feedback.incorrect { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; display: block; }

        .check-btn { background: linear-gradient(90deg,var(--primary),var(--primary-2)); color: white; padding: 8px 20px; border-radius: 8px; border: none; font-size: 0.9rem; cursor: pointer; box-shadow: 0 4px 12px rgba(2,30,80,0.06); margin-top: 12px; }
        .check-btn:hover { opacity: 0.9; }
        .check-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #9ca3af; }

        .progress-container { text-align: center; padding: 15px; background: #eff6ff; border-radius: 8px; margin-bottom: 20px; position: sticky; top: 20px; z-index: 10; }
        .progress-text { font-size: 1.1rem; font-weight: 600; color: var(--primary); }

        .reset-btn { background: #6b7280; color: white; padding: 8px 16px; border-radius: 6px; border: none; font-size: 0.85rem; cursor: pointer; margin-left: 10px; }
        .reset-btn:hover { background: #4b5563; }

        .explanation { margin-top: 8px; padding: 10px; background: #fef3c7; border-left: 3px solid #f59e0b; border-radius: 4px; font-size: 0.95rem; display: none; }
        .explanation.show { display: block; }
    </style>
</head>

<body>

<div class="container">
    <div class="nav-bar">
        <a href="../Grammar/Second Conditional.html" class="back-btn">← Back to Lesson</a>
    </div>

    <header>
        <h1>📝 Quiz: Second Conditional</h1>
    </header>

    <div class="quiz-container">
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Answer the questions below</span>
            <button class="reset-btn" onclick="resetQuiz()">Reset All</button>
        </div>

        <form id="quizForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>
</div>

<script>
    let checkedQuestions = new Set();
    let currentQuestions = [];
    let answers = {};
    
    // Question bank with all possible questions
    const questionBank = [
        {
            question: "If I _____ a millionaire, I would travel the world.",
            options: ["were", "was", "am"],
            correct: 0,
            explanation: "In second conditional, use past simple in the if-clause. With 'I/he/she/it', use 'were'."
        },
        {
            question: "She _____ buy a new car if she had enough money.",
            options: ["would", "will", "can"],
            correct: 0,
            explanation: "Use 'would' + base verb in the main clause of second conditional sentences."
        },
        {
            question: "If you _____ harder, you would pass the exam.",
            options: ["studied", "study", "will study"],
            correct: 0,
            explanation: "Use past simple in the if-clause of second conditional."
        },
        {
            question: "They would come to the party if they _____ invited.",
            options: ["were", "are", "will be"],
            correct: 0,
            explanation: "Use past simple (were) in the if-clause of second conditional."
        },
        {
            question: "If he _____ me, I would help him.",
            options: ["asked", "asks", "will ask"],
            correct: 0,
            explanation: "Use past simple in the if-clause of second conditional."
        },
        {
            question: "We _____ go to the beach if the weather were nice.",
            options: ["would", "will", "can"],
            correct: 0,
            explanation: "Use 'would' in the main clause for imaginary or unlikely situations."
        },
        {
            question: "If I _____ you, I would apologize.",
            options: ["were", "was", "am"],
            correct: 0,
            explanation: "Use 'were' (not 'was') with all subjects in second conditional for formal English."
        },
        {
            question: "Which sentence is CORRECT?",
            options: ["If she would come, I would be happy.", "If she came, I would be happy.", "If she comes, I would be happy."],
            correct: 1,
            explanation: "Second conditional: If + past simple, would + verb. 'If she came' is correct."
        },
        {
            question: "You would feel better if you _____ more exercise.",
            options: ["did", "do", "will do"],
            correct: 0,
            explanation: "Use past simple in the if-clause of second conditional."
        },
        {
            question: "If I _____ a bird, I would fly around the world.",
            options: ["were", "was", "am"],
            correct: 0,
            explanation: "Use 'were' for impossible or imaginary situations in second conditional."
        },
        {
            question: "She _____ be happier if she lived in the countryside.",
            options: ["would", "will", "can"],
            correct: 0,
            explanation: "Use 'would' in the main clause for hypothetical results."
        },
        {
            question: "If they _____ the lottery, they would buy a mansion.",
            options: ["won", "win", "will win"],
            correct: 0,
            explanation: "Use past simple in the if-clause of second conditional."
        },
        {
            question: "I would travel more if I _____ more time.",
            options: ["had", "have", "will have"],
            correct: 0,
            explanation: "Use past simple in the if-clause for hypothetical situations."
        },
        {
            question: "Which is INCORRECT?",
            options: ["If you will study, you would pass.", "If you studied, you would pass.", "You would pass if you studied."],
            correct: 0,
            explanation: "Don't use 'will' in the if-clause of second conditional. Use past simple."
        },
        {
            question: "If she _____ the truth, she would tell you.",
            options: ["knew", "knows", "will know"],
            correct: 0,
            explanation: "Use past simple in the if-clause of second conditional."
        },
        {
            question: "They _____ move to a bigger house if they could afford it.",
            options: ["would", "will", "can"],
            correct: 0,
            explanation: "Use 'would' in the main clause for hypothetical situations."
        },
        {
            question: "If I _____ more money, I would save some.",
            options: ["earned", "earn", "will earn"],
            correct: 0,
            explanation: "Use past simple in the if-clause of second conditional."
        },
        {
            question: "He would be healthier if he _____ smoking.",
            options: ["stopped", "stops", "will stop"],
            correct: 0,
            explanation: "Use past simple in the if-clause of second conditional."
        },
        {
            question: "If it _____ so expensive, I would buy it.",
            options: ["weren't", "isn't", "won't be"],
            correct: 0,
            explanation: "Use past simple negative (weren't) in the if-clause of second conditional."
        },
        {
            question: "We _____ be late if we took a taxi.",
            options: ["wouldn't", "won't", "don't"],
            correct: 0,
            explanation: "Use 'wouldn't' (would not) in the main clause for negative hypothetical results."
        }
    ];

    // Shuffle array function
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Generate quiz on page load
    function generateQuiz() {
        // Shuffle and select 12 random questions
        const shuffled = shuffle(questionBank);
        currentQuestions = shuffled.slice(0, 12);
        
        // Generate HTML for questions
        const quizForm = document.getElementById('quizForm');
        quizForm.innerHTML = '';
        
        currentQuestions.forEach((q, index) => {
            const questionNum = index + 1;
            const questionId = `q${questionNum}`;
            
            // Shuffle options
            const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            const shuffledOptionsArray = shuffle(shuffledOptions);
            
            // Find correct answer index after shuffle
            const correctIndex = shuffledOptionsArray.findIndex(opt => opt.isCorrect);
            answers[questionId] = String.fromCharCode(97 + correctIndex); // 'a', 'b', 'c', etc.
            
            // Build question HTML
            const questionHTML = `
            <div class="question">
                <div class="question-text">${questionNum}. ${q.question}</div>
                <div class="options">
                    ${shuffledOptionsArray.map((opt, idx) => `
                    <label class="option">
                        <input type="radio" name="${questionId}" value="${String.fromCharCode(97 + idx)}">
                        ${opt.text}
                    </label>`).join('')}
                </div>
                <div class="feedback" id="feedback${questionNum}"></div>
                <div class="explanation" id="explanation${questionNum}">
                    ${q.explanation}
                </div>
                <button type="button" class="check-btn" onclick="checkQuestion(${questionNum})">Check Answer</button>
            </div>`;
            
            quizForm.innerHTML += questionHTML;
        });
    }

    // Initialize quiz on page load
    window.addEventListener('DOMContentLoaded', generateQuiz);

    function checkQuestion(questionNum) {
        const question = `q${questionNum}`;
        const selected = document.querySelector(`input[name="${question}"]:checked`);
        
        if (!selected) {
            alert('Please select an answer first.');
            return;
        }

        const feedbackEl = document.getElementById(`feedback${questionNum}`);
        const explanationEl = document.getElementById(`explanation${questionNum}`);
        const button = event.target;
        
        if (selected.value === answers[question]) {
            feedbackEl.className = 'feedback correct';
            feedbackEl.textContent = '✓ Correct!';
        } else {
            feedbackEl.className = 'feedback incorrect';
            feedbackEl.textContent = '✗ Incorrect. Check the explanation below.';
        }
        
        explanationEl.classList.add('show');
        button.disabled = true;
        button.textContent = 'Checked ✓';
        
        // Mark as checked
        checkedQuestions.add(questionNum);
        updateProgress();
    }
    
    function updateProgress() {
        const totalQuestions = Object.keys(answers).length;
        const checked = checkedQuestions.size;
        const progressText = document.getElementById('progressText');
        
        if (checked === 0) {
            progressText.textContent = 'Answer the questions below';
        } else if (checked === totalQuestions) {
            const correctCount = Array.from(checkedQuestions).filter(num => {
                const question = `q${num}`;
                const selected = document.querySelector(`input[name="${question}"]:checked`);
                return selected && selected.value === answers[question];
            }).length;
            
            progressText.textContent = `Quiz Complete! Score: ${correctCount}/${totalQuestions}`;
        } else {
            progressText.textContent = `Progress: ${checked}/${totalQuestions} questions checked`;
        }
    }

    function resetQuiz() {
        // Regenerate the quiz with new random questions
        generateQuiz();
        
        // Reset progress
        checkedQuestions.clear();
        updateProgress();
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
