<script>
    // Question bank for the shared quiz engine (assets/js/quiz-engine.js)
    // Mirrors the lesson: be + past participle across tenses, active/passive

    const questionBank = [
        {
            question: "The book _____ by the author last year.",
            options: ["was written", "is written", "wrote", "was wrote"],
            correct: 0,
            explanation: "'Last year' = past passive: was + written (irregular participle)."
        },
        {
            question: "English _____ all over the world.",
            options: ["is spoken", "speaks", "is speaking", "spoke"],
            correct: 0,
            explanation: "Present passive fact: is + spoken."
        },
        {
            question: "The Tsing Ma Bridge _____ completed in 1997.",
            options: ["was", "is", "has", "were"],
            correct: 0,
            explanation: "A finished past event: was completed."
        },
        {
            question: "The classroom _____ cleaned every afternoon after lessons.",
            options: ["is", "was", "will", "has"],
            correct: 0,
            explanation: "A present routine ('every afternoon' + present context): is cleaned."
        },
        {
            question: "The cake _____ by my mother yesterday.",
            options: ["was made", "is made", "made", "was make"],
            correct: 0,
            explanation: "Past passive: was + made."
        },
        {
            question: "Which sentence is in the PASSIVE VOICE?",
            options: ["The lesson is taught by the teacher.", "The teacher teaches the lesson.", "The teacher is teaching now.", "The teacher taught well."],
            correct: 0,
            explanation: "Passive = the subject RECEIVES the action: be + past participle."
        },
        {
            question: "The car _____ repaired at the moment, so we're taking the bus.",
            options: ["is being", "is", "was", "has"],
            correct: 0,
            explanation: "Happening right now: present continuous passive = is being + participle."
        },
        {
            question: "The painting _____ stolen from the gallery last night.",
            options: ["was", "is", "has", "is being"],
            correct: 0,
            explanation: "Past event: was stolen. (Note: the thief is unknown — perfect for passive!)"
        },
        {
            question: "A lot of tea _____ grown in China.",
            options: ["is", "are", "was being", "have been"],
            correct: 0,
            explanation: "General present fact; 'a lot of tea' is uncountable → is grown."
        },
        {
            question: "The exam results _____ announced next Friday.",
            options: ["will be", "are being", "were", "have"],
            correct: 0,
            explanation: "'Next Friday' = future passive: will be + announced."
        },
        {
            question: "The students _____ given extra homework every day.",
            options: ["are", "is", "was", "be"],
            correct: 0,
            explanation: "Plural subject, present routine: are given."
        },
        {
            question: "Which is INCORRECT?",
            options: ["The movie is watch by millions.", "The movie is watched by millions.", "The movie was watched by millions.", "The movie will be watched by millions."],
            correct: 0,
            explanation: "Passive needs the PAST PARTICIPLE: is watchED."
        },
        {
            question: "This song _____ written by a famous local composer.",
            options: ["was", "is being", "has", "wrote"],
            correct: 0,
            explanation: "Completed past: was written."
        },
        {
            question: "The email _____ already been sent — you can't unsend it.",
            options: ["has", "is", "was", "have"],
            correct: 0,
            explanation: "Present perfect passive: has been + sent."
        },
        {
            question: "The maths problem _____ solved by the whole class working together.",
            options: ["was", "is being always", "has being", "were"],
            correct: 0,
            explanation: "Past passive with an agent: was solved by…"
        },
        {
            question: "New computers _____ installed in the library next week.",
            options: ["will be", "are being now", "were", "have"],
            correct: 0,
            explanation: "'Next week' → will be installed."
        },
        {
            question: "Change to passive: 'The chef cooks the meal.'",
            options: ["The meal is cooked by the chef.", "The meal cooked the chef.", "The chef is cooked by the meal.", "The meal was cooking the chef."],
            correct: 0,
            explanation: "Object moves to the front + is + cooked + by-agent."
        },
        {
            question: "When do we usually LEAVE OUT 'by + agent'?",
            options: ["When the doer is unknown or obvious", "Always — it is never allowed", "Only in questions", "When the verb is irregular"],
            correct: 0,
            explanation: "'My phone was stolen' — we don't know who; 'The thief was arrested' — obviously by police."
        },
        {
            question: "The report _____ finished yet, so please wait.",
            options: ["hasn't been", "isn't being never", "wasn't be", "hasn't"],
            correct: 0,
            explanation: "'Yet' signals present perfect passive negative: hasn't been finished."
        },
        {
            question: "Which verb form completes: 'The window was _____ by the strong wind'?",
            options: ["broken", "breaked", "broke", "breaking"],
            correct: 0,
            explanation: "Irregular participle: break, broke, BROKEN."
        }
    ];
