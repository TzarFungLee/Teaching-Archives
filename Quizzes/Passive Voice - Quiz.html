---
layout: default
title: "Quiz: Passive Voice"
category: "Quizzes"
icon: "📝"
---

<div class="quiz-container">
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Answer the questions below</span>
            <button class="reset-btn" onclick="resetQuiz()">Reset All</button>
        </div>

        <form id="quizForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>
</div>

<script>
    let checkedQuestions = new Set();
    let currentQuestions = [];
    let answers = {};
    
    // Question bank with all possible questions
    const questionBank = [
        {
            question: "The book _____ by the author last year.",
            options: ["was written", "is written", "writes"],
            correct: 0,
            explanation: "Use 'was/were + past participle' for passive voice in past tense."
        },
        {
            question: "English _____ all over the world.",
            options: ["is spoken", "speaks", "is speaking"],
            correct: 0,
            explanation: "Use 'is/are + past participle' for passive voice in present tense."
        },
        {
            question: "The house _____ built in 1990.",
            options: ["was", "is", "has"],
            correct: 0,
            explanation: "Use 'was' for passive voice with singular subjects in past tense."
        },
        {
            question: "The letters _____ delivered every morning.",
            options: ["are", "is", "were"],
            correct: 0,
            explanation: "Use 'are' with plural subjects in passive voice present tense."
        },
        {
            question: "The cake _____ by my mother yesterday.",
            options: ["was made", "is made", "makes"],
            correct: 0,
            explanation: "Use 'was + past participle' for passive voice in past tense."
        },
        {
            question: "This bridge _____ in 2010.",
            options: ["was completed", "is completed", "completes"],
            correct: 0,
            explanation: "Use past passive (was completed) for actions completed in the past."
        },
        {
            question: "The windows _____ cleaned once a week.",
            options: ["are", "is", "was"],
            correct: 0,
            explanation: "Use 'are' with plural subjects in present passive voice."
        },
        {
            question: "Which sentence is in PASSIVE VOICE?",
            options: ["The teacher teaches the lesson.", "The lesson is taught by the teacher.", "The teacher is teaching."],
            correct: 1,
            explanation: "Passive voice: subject + be + past participle (+ by agent)."
        },
        {
            question: "The car _____ repaired at the moment.",
            options: ["is being", "is", "was"],
            correct: 0,
            explanation: "Use 'is/are being + past participle' for passive continuous tense."
        },
        {
            question: "The painting _____ stolen last night.",
            options: ["was", "is", "has"],
            correct: 0,
            explanation: "Use 'was/were' for passive voice in past simple tense."
        },
        {
            question: "Coffee _____ grown in Brazil.",
            options: ["is", "was", "are"],
            correct: 0,
            explanation: "Use 'is' with singular uncountable nouns in present passive."
        },
        {
            question: "The documents _____ sent tomorrow.",
            options: ["will be", "are", "were"],
            correct: 0,
            explanation: "Use 'will be + past participle' for future passive voice."
        },
        {
            question: "The students _____ given homework every day.",
            options: ["are", "is", "was"],
            correct: 0,
            explanation: "Use 'are' with plural subjects in present passive voice."
        },
        {
            question: "Which is INCORRECT?",
            options: ["The movie was watched by millions.", "The movie is watch by millions.", "The movie is watched by millions."],
            correct: 1,
            explanation: "Must use past participle 'watched', not base form 'watch'."
        },
        {
            question: "This song _____ written by a famous composer.",
            options: ["was", "is", "has"],
            correct: 0,
            explanation: "Use 'was' for completed actions in past passive voice."
        },
        {
            question: "The email _____ already sent.",
            options: ["has been", "is", "was"],
            correct: 0,
            explanation: "Use 'has/have been + past participle' for present perfect passive."
        },
        {
            question: "The problem _____ solved by the engineer.",
            options: ["was", "is", "has"],
            correct: 0,
            explanation: "Use 'was' for passive voice describing past completed actions."
        },
        {
            question: "New computers _____ installed next week.",
            options: ["will be", "are", "were"],
            correct: 0,
            explanation: "Use 'will be' for future passive voice."
        },
        {
            question: "The flowers _____ watered every morning.",
            options: ["are", "is", "was"],
            correct: 0,
            explanation: "Use 'are' with plural subjects in present passive for habitual actions."
        },
        {
            question: "The report _____ finished yet.",
            options: ["hasn't been", "isn't", "wasn't"],
            correct: 0,
            explanation: "Use 'hasn't/haven't been' for negative present perfect passive with 'yet'."
        }
    ];

    // Shuffle array function
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Generate quiz on page load
    function generateQuiz() {
        // Shuffle and select 12 random questions
        const shuffled = shuffle(questionBank);
        currentQuestions = shuffled.slice(0, 12);
        
        // Generate HTML for questions
        const quizForm = document.getElementById('quizForm');
        quizForm.innerHTML = '';
        
        currentQuestions.forEach((q, index) => {
            const questionNum = index + 1;
            const questionId = `q${questionNum}`;
            
            // Shuffle options
            const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            const shuffledOptionsArray = shuffle(shuffledOptions);
            
            // Find correct answer index after shuffle
            const correctIndex = shuffledOptionsArray.findIndex(opt => opt.isCorrect);
            answers[questionId] = String.fromCharCode(97 + correctIndex); // 'a', 'b', 'c', etc.
            
            // Build question HTML
            const questionHTML = `
            <div class="question">
                <div class="question-text">${questionNum}. ${q.question} <span class="audio-icon" onclick="speakSentence(this)">🔊</span></div>
                <div class="options">
                    ${shuffledOptionsArray.map((opt, idx) => `
                    <label class="option">
                        <input type="radio" name="${questionId}" value="${String.fromCharCode(97 + idx)}">
                        ${opt.text}
                    </label>`).join('')}
                </div>
                <div class="feedback" id="feedback${questionNum}"></div>
                <div class="explanation" id="explanation${questionNum}">
                    ${q.explanation}
                </div>
                <button type="button" class="check-btn" onclick="checkQuestion(${questionNum})">Check Answer</button>
            </div>`;
            
            quizForm.innerHTML += questionHTML;
        });
    }

    // Initialize quiz on page load
    window.addEventListener('DOMContentLoaded', generateQuiz);

    function checkQuestion(questionNum) {
        const question = `q${questionNum}`;
        const selected = document.querySelector(`input[name="${question}"]:checked`);
        
        if (!selected) {
            alert('Please select an answer first.');
            return;
        }

        const isCorrect = (selected.value === answers[question]);
        renderSemanticFeedback(questionNum, isCorrect);
        
        const button = event.target;
        button.disabled = true;
        button.textContent = 'Checked ✓';
        
        checkedQuestions.add(questionNum);
        updateProgress();
    }
    
    function updateProgress() {
        const totalQuestions = Object.keys(answers).length;
        const checked = checkedQuestions.size;
        const progressText = document.getElementById('progressText');
        
        if (checked === 0) {
            progressText.textContent = 'Answer the questions below';
        } else if (checked === totalQuestions) {
            const correctCount = Array.from(checkedQuestions).filter(num => {
                const question = `q${num}`;
                const selected = document.querySelector(`input[name="${question}"]:checked`);
                return selected && selected.value === answers[question];
            }).length;
            
            progressText.textContent = `Quiz Complete! Score: ${correctCount}/${totalQuestions}`;
        } else {
            progressText.textContent = `Progress: ${checked}/${totalQuestions} questions checked`;
        }
    }

    function resetQuiz() {
        // Regenerate the quiz with new random questions
        generateQuiz();
        
        // Reset progress
        checkedQuestions.clear();
        updateProgress();
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
