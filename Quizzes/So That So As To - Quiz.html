<script>
    // Question bank for the shared quiz engine (assets/js/quiz-engine.js)
    // Mirrors the lesson: so (result) vs the purpose family — so that + clause,
    // to / in order to / so as to + base verb, and so as not to.
    const questionBank = [
        {
            question: "She studied hard _____ she could pass the exam.",
            options: ["so that", "so as to", "in order", "so"],
            correct: 0,
            explanation: "A new subject + could follows: use so that + clause."
        },
        {
            question: "I woke up early _____ catch the first train.",
            options: ["so as to", "so that", "because", "so"],
            correct: 0,
            explanation: "A bare verb follows: so as to + base verb."
        },
        {
            question: "He saved money _____ he could buy a PS5.",
            options: ["so that", "so as to", "for", "in order to"],
            correct: 0,
            explanation: "Subject + could follows: so that."
        },
        {
            question: "We arrived early _____ get good seats.",
            options: ["in order to", "so that", "because", "so"],
            correct: 0,
            explanation: "A bare verb follows: in order to + base verb."
        },
        {
            question: "Which is CORRECT?",
            options: ["I called her so as to tell her the news.", "I called her so that told her the news.", "I called her so as that tell her.", "I called her for tell her the news."],
            correct: 0,
            explanation: "so as to + base verb. (so that would need subject + verb after it.)"
        },
        {
            question: "They whispered _____ they wouldn't wake the baby.",
            options: ["so that", "so as to", "for", "to"],
            correct: 0,
            explanation: "Subject + wouldn't follows: so that + clause."
        },
        {
            question: "She exercises regularly _____ stay healthy.",
            options: ["to", "so that", "because", "so"],
            correct: 0,
            explanation: "The everyday purpose form: to + base verb."
        },
        {
            question: "I'm learning English _____ I can travel easily.",
            options: ["so that", "so as to", "for", "to"],
            correct: 0,
            explanation: "Subject + can follows: so that."
        },
        {
            question: "He left home early _____ avoid the rush hour.",
            options: ["in order to", "so that", "because", "so"],
            correct: 0,
            explanation: "Bare verb follows: in order to avoid."
        },
        {
            question: "Which is INCORRECT?",
            options: ["I study so that pass exams.", "I study so that I can pass exams.", "I study to pass exams.", "I study in order to pass exams."],
            correct: 0,
            explanation: "so that needs a subject + verb after it: so that I can pass."
        },
        {
            question: "We set an alarm _____ we wouldn't be late.",
            options: ["so that", "so as to", "for", "to"],
            correct: 0,
            explanation: "Subject + wouldn't follows: so that."
        },
        {
            question: "She wore glasses _____ see the whiteboard better.",
            options: ["to", "so that", "because", "for"],
            correct: 0,
            explanation: "Bare verb follows: to + base verb."
        },
        {
            question: "He tiptoed upstairs _____ wake his parents.",
            options: ["so as not to", "so that not", "to not that", "so as to not"],
            correct: 0,
            explanation: "Negative purpose: so as NOT to + base verb."
        },
        {
            question: "I opened the window _____ let in fresh air.",
            options: ["to", "so that", "because", "so"],
            correct: 0,
            explanation: "Bare verb follows: to let."
        },
        {
            question: "He spoke slowly _____ everyone could understand.",
            options: ["so that", "so as to", "for", "to"],
            correct: 0,
            explanation: "Subject + could follows: so that."
        },
        {
            question: "She took notes _____ remember the key points.",
            options: ["in order to", "so that", "because", "so"],
            correct: 0,
            explanation: "Bare verb follows: in order to remember."
        },
        {
            question: "I was exhausted, _____ I went to bed at nine.",
            options: ["so", "so that", "so as to", "in order to"],
            correct: 0,
            explanation: "This is a RESULT, not a purpose: comma + so."
        },
        {
            question: "Which sentence expresses PURPOSE (not result)?",
            options: ["She jogs daily to keep fit.", "She was tired, so she slept.", "It rained, so we stayed in.", "He was late, so he ran."],
            correct: 0,
            explanation: "to keep fit = the goal of jogging. The others show results."
        },
        {
            question: "They saved for months _____ they could visit Japan.",
            options: ["so that", "so as to", "for", "to"],
            correct: 0,
            explanation: "Subject + could follows: so that."
        },
        {
            question: "Write it formally: I left early ______ miss the crowd.",
            options: ["so as not to", "so that not", "for not to", "not to that"],
            correct: 0,
            explanation: "Formal negative purpose: so as not to + base verb."
        }
    ];
</script>
