---
layout: default
title: "Quiz: Comparative and Superlative Adjectives"
category: "Quizzes"
icon: "📝"
---

<div class="quiz-container">
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Answer the questions below</span>
            <button class="reset-btn" onclick="resetQuiz()">Reset All</button>
        </div>

        <form id="quizForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>
</div>

<script>
    let checkedQuestions = new Set();
    let currentQuestions = [];
    let answers = {};
    
    // Question bank with all possible questions
    const questionBank = [
        {
            question: "This car is _____ than that one.",
            options: ["faster", "fastest", "more fast"],
            correct: 0,
            explanation: "Use comparative form (-er) to compare two things. 'Fast' becomes 'faster'."
        },
        {
            question: "She is the _____ student in the class.",
            options: ["smartest", "smarter", "most smart"],
            correct: 0,
            explanation: "Use superlative form (-est) with 'the' to show the highest degree. 'Smart' becomes 'smartest'."
        },
        {
            question: "This book is _____ interesting than the other one.",
            options: ["more", "most", "much"],
            correct: 0,
            explanation: "Use 'more' + adjective for comparative with longer adjectives."
        },
        {
            question: "Mount Everest is the _____ mountain in the world.",
            options: ["highest", "higher", "high"],
            correct: 0,
            explanation: "Use superlative (-est) with 'the' for the highest degree."
        },
        {
            question: "My house is _____ than yours.",
            options: ["bigger", "biggest", "more big"],
            correct: 0,
            explanation: "Use comparative (-er) for one-syllable adjectives. 'Big' becomes 'bigger' (double the consonant)."
        },
        {
            question: "This is the _____ beautiful painting I've ever seen.",
            options: ["most", "more", "very"],
            correct: 0,
            explanation: "Use 'the most' + adjective for superlative with longer adjectives."
        },
        {
            question: "Which sentence is CORRECT?",
            options: ["He is more tall than his brother.", "He is taller than his brother.", "He is tallest than his brother."],
            correct: 1,
            explanation: "Short adjectives use -er for comparison. 'Tall' becomes 'taller'."
        },
        {
            question: "Today is _____ than yesterday.",
            options: ["colder", "coldest", "more cold"],
            correct: 0,
            explanation: "Use comparative (-er) for one-syllable adjectives."
        },
        {
            question: "She is the _____ person I know.",
            options: ["kindest", "kinder", "most kind"],
            correct: 0,
            explanation: "Use superlative (-est) with 'the' for the highest degree."
        },
        {
            question: "This exercise is _____ difficult than the last one.",
            options: ["more", "most", "much"],
            correct: 0,
            explanation: "Use 'more' for comparative with adjectives of two or more syllables."
        },
        {
            question: "What is the _____ city in your country?",
            options: ["largest", "larger", "large"],
            correct: 0,
            explanation: "Use superlative (-est) with 'the' when comparing more than two things."
        },
        {
            question: "Gold is _____ than silver.",
            options: ["more expensive", "most expensive", "expensiver"],
            correct: 0,
            explanation: "Use 'more' + adjective for comparative with longer adjectives."
        },
        {
            question: "This is the _____ day of my life!",
            options: ["best", "better", "good"],
            correct: 0,
            explanation: "'Good' has an irregular superlative form: 'best'."
        },
        {
            question: "Which is INCORRECT?",
            options: ["more beautiful", "beautifuler", "most beautiful"],
            correct: 1,
            explanation: "Don't add -er to long adjectives. Use 'more beautiful' instead."
        },
        {
            question: "His performance was _____ than mine.",
            options: ["worse", "worst", "bad"],
            correct: 0,
            explanation: "'Bad' has an irregular comparative form: 'worse'."
        },
        {
            question: "She ran _____ than all the other runners.",
            options: ["faster", "fastest", "fast"],
            correct: 0,
            explanation: "Use comparative when comparing with others (than)."
        },
        {
            question: "This is the _____ movie I've ever watched.",
            options: ["worst", "worse", "bad"],
            correct: 0,
            explanation: "'Bad' has an irregular superlative form: 'worst'."
        },
        {
            question: "The weather is getting _____ and _____.",
            options: ["colder and colder", "more cold and more cold", "coldest and coldest"],
            correct: 0,
            explanation: "Use 'comparative + and + comparative' to show continuous change."
        },
        {
            question: "She is _____ her sister.",
            options: ["younger than", "youngest than", "young than"],
            correct: 0,
            explanation: "Use comparative + 'than' when comparing two things."
        },
        {
            question: "This is _____ than I expected.",
            options: ["easier", "easiest", "more easy"],
            correct: 0,
            explanation: "Adjectives ending in -y change to -ier for comparative."
        }
    ];

    // Shuffle array function
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Generate quiz on page load
    function generateQuiz() {
        // Shuffle and select 12 random questions
        const shuffled = shuffle(questionBank);
        currentQuestions = shuffled.slice(0, 12);
        
        // Generate HTML for questions
        const quizForm = document.getElementById('quizForm');
        quizForm.innerHTML = '';
        
        currentQuestions.forEach((q, index) => {
            const questionNum = index + 1;
            const questionId = `q${questionNum}`;
            
            // Shuffle options
            const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            const shuffledOptionsArray = shuffle(shuffledOptions);
            
            // Find correct answer index after shuffle
            const correctIndex = shuffledOptionsArray.findIndex(opt => opt.isCorrect);
            answers[questionId] = String.fromCharCode(97 + correctIndex); // 'a', 'b', 'c', etc.
            
            // Build question HTML
            const questionHTML = `
            <div class="question">
                <div class="question-text">${questionNum}. ${q.question}</div>
                <div class="options">
                    ${shuffledOptionsArray.map((opt, idx) => `
                    <label class="option">
                        <input type="radio" name="${questionId}" value="${String.fromCharCode(97 + idx)}">
                        ${opt.text}
                    </label>`).join('')}
                </div>
                <div class="feedback" id="feedback${questionNum}"></div>
                <div class="explanation" id="explanation${questionNum}">
                    ${q.explanation}
                </div>
                <button type="button" class="check-btn" onclick="checkQuestion(${questionNum})">Check Answer</button>
            </div>`;
            
            quizForm.innerHTML += questionHTML;
        });
    }

    // Initialize quiz on page load
    window.addEventListener('DOMContentLoaded', generateQuiz);

    function checkQuestion(questionNum) {
        const question = `q${questionNum}`;
        const selected = document.querySelector(`input[name="${question}"]:checked`);
        
        if (!selected) {
            alert('Please select an answer first.');
            return;
        }

        const feedbackEl = document.getElementById(`feedback${questionNum}`);
        const explanationEl = document.getElementById(`explanation${questionNum}`);
        const button = event.target;
        
        if (selected.value === answers[question]) {
            feedbackEl.className = 'feedback correct';
            feedbackEl.textContent = '✓ Correct!';
        } else {
            feedbackEl.className = 'feedback incorrect';
            feedbackEl.textContent = '✗ Incorrect. Check the explanation below.';
        }
        
        explanationEl.classList.add('show');
        button.disabled = true;
        button.textContent = 'Checked ✓';
        
        // Mark as checked
        checkedQuestions.add(questionNum);
        updateProgress();
    }
    
    function updateProgress() {
        const totalQuestions = Object.keys(answers).length;
        const checked = checkedQuestions.size;
        const progressText = document.getElementById('progressText');
        
        if (checked === 0) {
            progressText.textContent = 'Answer the questions below';
        } else if (checked === totalQuestions) {
            const correctCount = Array.from(checkedQuestions).filter(num => {
                const question = `q${num}`;
                const selected = document.querySelector(`input[name="${question}"]:checked`);
                return selected && selected.value === answers[question];
            }).length;
            
            progressText.textContent = `Quiz Complete! Score: ${correctCount}/${totalQuestions}`;
        } else {
            progressText.textContent = `Progress: ${checked}/${totalQuestions} questions checked`;
        }
    }

    function resetQuiz() {
        // Regenerate the quiz with new random questions
        generateQuiz();
        
        // Reset progress
        checkedQuestions.clear();
        updateProgress();
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
