<script>
    // Question bank for the shared quiz engine (assets/js/quiz-engine.js)
    // Mirrors the lesson: -er/-est, doubling, y->ier, more/most, irregulars,
    // than/the usage, as...as, and the "more taller" trap.
    const questionBank = [
        {
            question: "This car is _____ than that one.",
            options: ["faster", "fastest", "more fast", "more faster"],
            correct: 0,
            explanation: "One syllable: add -er. Comparatives pair with 'than'."
        },
        {
            question: "She is the _____ student in the class.",
            options: ["smartest", "smarter", "most smart", "more smart"],
            correct: 0,
            explanation: "Superlative of a short adjective: the + -est."
        },
        {
            question: "This book is _____ interesting than that one.",
            options: ["more", "most", "much", "very"],
            correct: 0,
            explanation: "Long adjectives use more + adjective for the comparative."
        },
        {
            question: "Summer in Hong Kong is getting _____ every year.",
            options: ["hotter", "hoter", "more hot", "hottest"],
            correct: 0,
            explanation: "Short vowel + consonant: double the consonant (hot becomes hotter)."
        },
        {
            question: "My little sister is much _____ than me.",
            options: ["happier", "happyer", "more happy", "happiest"],
            correct: 0,
            explanation: "Two syllables ending in -y: change y to i and add -er (happier)."
        },
        {
            question: "This is the _____ street in Mong Kok.",
            options: ["busiest", "busyest", "most busy", "busier"],
            correct: 0,
            explanation: "Busy becomes busiest (y to iest) for the superlative."
        },
        {
            question: "My house is _____ than yours.",
            options: ["bigger", "biger", "more big", "biggest"],
            correct: 0,
            explanation: "Big becomes bigger: double the final consonant."
        },
        {
            question: "This is the _____ beautiful painting in the gallery.",
            options: ["most", "more", "very", "much"],
            correct: 0,
            explanation: "Long adjectives use the most + adjective for the superlative."
        },
        {
            question: "Which sentence is CORRECT?",
            options: ["He is taller than his brother.", "He is more tall than his brother.", "He is more taller than his brother.", "He is tallest than his brother."],
            correct: 0,
            explanation: "Short adjective takes -er, and never mix 'more' with '-er'."
        },
        {
            question: "His performance was _____ than mine.",
            options: ["worse", "worst", "badder", "more bad"],
            correct: 0,
            explanation: "Irregular: bad, worse, worst."
        },
        {
            question: "This is the _____ movie I have ever watched.",
            options: ["worst", "worse", "baddest", "most bad"],
            correct: 0,
            explanation: "Irregular superlative: the worst."
        },
        {
            question: "Sha Tin is _____ from Central than Kowloon Tong.",
            options: ["further", "farrer", "more far", "furthest"],
            correct: 0,
            explanation: "Irregular: far, further (or farther), furthest."
        },
        {
            question: "Gold is _____ than silver.",
            options: ["more expensive", "expensiver", "most expensive", "much expensive"],
            correct: 0,
            explanation: "Three syllables: more expensive."
        },
        {
            question: "The weather is getting _____ and _____.",
            options: ["colder and colder", "more cold and more cold", "coldest and coldest", "cold and colder"],
            correct: 0,
            explanation: "Growing change: comparative + and + comparative."
        },
        {
            question: "She is _____ her sister.",
            options: ["younger than", "younger then", "youngest than", "young than"],
            correct: 0,
            explanation: "Comparative + THAN (careful: 'then' is about time!)."
        },
        {
            question: "Mount Everest is _____ mountain in the world.",
            options: ["the highest", "the higher", "highest", "a highest"],
            correct: 0,
            explanation: "Superlatives need 'the': the highest."
        },
        {
            question: "Which is INCORRECT?",
            options: ["beautifuler", "more beautiful", "most beautiful", "as beautiful as"],
            correct: 0,
            explanation: "Long adjectives never take -er: use 'more beautiful'."
        },
        {
            question: "The exam was easier _____ I expected.",
            options: ["than", "then", "as", "that"],
            correct: 0,
            explanation: "Comparisons use 'than' (not 'then')."
        },
        {
            question: "My flat is _____ big _____ yours — exactly the same size!",
            options: ["as / as", "more / than", "so / as", "as / than"],
            correct: 0,
            explanation: "Equal comparison: as + adjective + as."
        },
        {
            question: "Which sentence is CORRECT?",
            options: ["This is the easiest question.", "This is the most easy question.", "This is the easiest most question.", "This is more easiest question."],
            correct: 0,
            explanation: "Easy becomes easiest (y to iest); do not use 'most' with short adjectives."
        }
    ];
</script>
