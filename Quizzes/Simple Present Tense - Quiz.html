<script>
    // Question bank for the shared quiz engine (assets/js/quiz-engine.js)
    // Mirrors the lesson: s/es/ies forms, do/does negatives and questions,
    // and when the simple present is the right choice.
    const questionBank = [
        {
            question: "She _____ to school by bus every day.",
            options: ["goes", "go", "going", "is go"],
            correct: 0,
            explanation: "He/she/it + verb ending in -o takes -es: goes."
        },
        {
            question: "My brother _____ English very well.",
            options: ["speaks", "speak", "speaking", "is speaks"],
            correct: 0,
            explanation: "Third person singular adds -s: speaks."
        },
        {
            question: "The baby _____ a lot at night.",
            options: ["cries", "crys", "cry", "crying"],
            correct: 0,
            explanation: "Consonant + y → ies: cry → cries."
        },
        {
            question: "He _____ TV after dinner.",
            options: ["watches", "watchs", "watch", "watching"],
            correct: 0,
            explanation: "Verbs ending in -ch take -es: watches."
        },
        {
            question: "She _____ two dogs and a cat.",
            options: ["has", "have", "haves", "is have"],
            correct: 0,
            explanation: "Special form: he/she/it + have → has."
        },
        {
            question: "I _____ coffee every morning.",
            options: ["drink", "drinks", "drinking", "am drink"],
            correct: 0,
            explanation: "'I' uses the base verb — no -s: I drink."
        },
        {
            question: "They _____ football on weekends.",
            options: ["play", "plays", "playing", "are play"],
            correct: 0,
            explanation: "Plural subjects use the base verb: they play."
        },
        {
            question: "The Earth _____ around the Sun.",
            options: ["orbits", "orbit", "is orbit", "orbiting"],
            correct: 0,
            explanation: "General facts use the simple present; the Earth (it) takes -s."
        },
        {
            question: "He _____ like spicy food.",
            options: ["does not", "do not", "is not", "not"],
            correct: 0,
            explanation: "Negative for he/she/it: does not + base verb."
        },
        {
            question: "We _____ eat meat.",
            options: ["don't", "doesn't", "aren't", "not"],
            correct: 0,
            explanation: "Negative for I/you/we/they: don't + base verb."
        },
        {
            question: "She _____ play the piano — she plays the violin.",
            options: ["doesn't", "don't", "isn't", "not"],
            correct: 0,
            explanation: "He/she/it → doesn't + base verb."
        },
        {
            question: "Which sentence is CORRECT?",
            options: ["He doesn't eat breakfast.", "He doesn't eats breakfast.", "He don't eat breakfast.", "He not eats breakfast."],
            correct: 0,
            explanation: "After doesn't, use the BASE verb: doesn't eat (the -s moves to 'does')."
        },
        {
            question: "_____ she work in Central?",
            options: ["Does", "Do", "Is", "Are"],
            correct: 0,
            explanation: "Question for he/she/it: Does + subject + base verb?"
        },
        {
            question: "_____ they live near the school?",
            options: ["Do", "Does", "Are", "Is"],
            correct: 0,
            explanation: "Question for I/you/we/they: Do + subject + base verb?"
        },
        {
            question: "Where _____ your cousin study?",
            options: ["does", "do", "is", "are"],
            correct: 0,
            explanation: "Wh-question: Where + does + he/she/it + base verb?"
        },
        {
            question: "Which question is CORRECT?",
            options: ["Does he like swimming?", "Does he likes swimming?", "Do he like swimming?", "Is he like swimming?"],
            correct: 0,
            explanation: "Does + subject + base verb: Does he like…?"
        },
        {
            question: "Which sentence describes a HABIT?",
            options: ["I jog every morning.", "I am jogging now.", "I jogged yesterday.", "I will jog tomorrow."],
            correct: 0,
            explanation: "'Every morning' + simple present = a repeated habit."
        },
        {
            question: "Which sentence states a GENERAL FACT?",
            options: ["Water boils at 100°C.", "The water is boiling now.", "The water boiled.", "The water will boil."],
            correct: 0,
            explanation: "Facts that are always true use the simple present."
        },
        {
            question: "The last train _____ at 12:30 am, so don't miss it.",
            options: ["leaves", "leave", "is leave", "left"],
            correct: 0,
            explanation: "Timetables and schedules use the simple present, even for the future."
        },
        {
            question: "Which sentence is INCORRECT?",
            options: ["She like K-pop.", "She likes K-pop.", "They like K-pop.", "I like K-pop."],
            correct: 0,
            explanation: "He/she/it needs -s: She likes K-pop."
        }
    ];
</script>
