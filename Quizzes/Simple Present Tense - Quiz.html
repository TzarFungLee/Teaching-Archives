<div class="quiz-container">
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Answer the questions below</span>
            <button class="reset-btn" onclick="resetQuiz()">Reset All</button>
        </div>

        <form id="quizForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>
</div>

<script>
    let checkedQuestions = new Set();
    let currentQuestions = [];
    let answers = {};
    
    // Question bank with all possible questions
    const questionBank = [
        {
            question: "She _____ to school every day.",
            options: ["go", "goes", "going"],
            correct: 1,
            explanation: "Use 'goes' (verb + s) with third person singular (he/she/it) in simple present tense."
        },
        {
            question: "They _____ football on Sundays.",
            options: ["play", "plays", "playing"],
            correct: 0,
            explanation: "Use the base form 'play' with plural subjects (they, we) in simple present tense."
        },
        {
            question: "He _____ his homework after dinner.",
            options: ["do", "does", "doing"],
            correct: 1,
            explanation: "Use 'does' (verb + es) with third person singular (he/she/it) in simple present tense."
        },
        {
            question: "I _____ coffee every morning.",
            options: ["drink", "drinks", "drinking"],
            correct: 0,
            explanation: "Use the base form 'drink' with 'I' in simple present tense."
        },
        {
            question: "The sun _____ in the east.",
            options: ["rise", "rises", "rising"],
            correct: 1,
            explanation: "Use 'rises' (verb + s) with third person singular (the sun = it) for general truths."
        },
        {
            question: "We _____ English at school.",
            options: ["study", "studies", "studying"],
            correct: 0,
            explanation: "Use the base form 'study' with plural subject 'we' in simple present tense."
        },
        {
            question: "My brother _____ TV every evening.",
            options: ["watch", "watches", "watching"],
            correct: 1,
            explanation: "Use 'watches' (verb + es) with third person singular (my brother = he) in simple present tense."
        },
        {
            question: "Cats _____ mice.",
            options: ["catch", "catches", "catching"],
            correct: 0,
            explanation: "Use the base form 'catch' with plural subject 'cats' in simple present tense."
        },
        {
            question: "She _____ her teeth twice a day.",
            options: ["brush", "brushes", "brushing"],
            correct: 1,
            explanation: "Use 'brushes' (verb + es) with third person singular (she) in simple present tense."
        },
        {
            question: "Which sentence is CORRECT?",
            options: ["He go to work by bus.", "He goes to work by bus.", "He going to work by bus."],
            correct: 1,
            explanation: "Use 'goes' (verb + s) with third person singular 'he' in simple present tense."
        },
        {
            question: "You _____ very fast.",
            options: ["run", "runs", "running"],
            correct: 0,
            explanation: "Use the base form 'run' with 'you' in simple present tense."
        },
        {
            question: "The train _____ at 6 PM.",
            options: ["leave", "leaves", "leaving"],
            correct: 1,
            explanation: "Use 'leaves' (verb + s) with third person singular (the train = it) for scheduled events."
        },
        {
            question: "Birds _____ in the sky.",
            options: ["fly", "flies", "flying"],
            correct: 0,
            explanation: "Use the base form 'fly' with plural subject 'birds' in simple present tense."
        },
        {
            question: "My sister _____ in a hospital.",
            options: ["work", "works", "working"],
            correct: 1,
            explanation: "Use 'works' (verb + s) with third person singular (my sister = she) in simple present tense."
        },
        {
            question: "Which is INCORRECT?",
            options: ["They likes pizza.", "They like pizza.", "We like pizza."],
            correct: 0,
            explanation: "'They' is plural, so use the base form 'like', not 'likes'."
        },
        {
            question: "Water _____ at 100 degrees Celsius.",
            options: ["boil", "boils", "boiling"],
            correct: 1,
            explanation: "Use 'boils' (verb + s) with third person singular (water = it) for scientific facts."
        },
        {
            question: "I _____ my grandparents every weekend.",
            options: ["visit", "visits", "visiting"],
            correct: 0,
            explanation: "Use the base form 'visit' with 'I' in simple present tense."
        },
        {
            question: "The baby _____ at night.",
            options: ["cry", "cries", "crying"],
            correct: 1,
            explanation: "Use 'cries' (y changes to ies) with third person singular (the baby = it) in simple present tense."
        },
        {
            question: "We _____ our house clean.",
            options: ["keep", "keeps", "keeping"],
            correct: 0,
            explanation: "Use the base form 'keep' with plural subject 'we' in simple present tense."
        },
        {
            question: "She _____ three languages.",
            options: ["speak", "speaks", "speaking"],
            correct: 1,
            explanation: "Use 'speaks' (verb + s) with third person singular (she) in simple present tense."
        }
    ];

    // Shuffle array function
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Generate quiz on page load
    function generateQuiz() {
        // Shuffle and select 12 random questions
        const shuffled = shuffle(questionBank);
        currentQuestions = shuffled.slice(0, 12);
        
        // Generate HTML for questions
        const quizForm = document.getElementById('quizForm');
        quizForm.innerHTML = '';
        
        currentQuestions.forEach((q, index) => {
            const questionNum = index + 1;
            const questionId = `q${questionNum}`;
            
            // Shuffle options
            const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            const shuffledOptionsArray = shuffle(shuffledOptions);
            
            // Find correct answer index after shuffle
            const correctIndex = shuffledOptionsArray.findIndex(opt => opt.isCorrect);
            answers[questionId] = String.fromCharCode(97 + correctIndex); // 'a', 'b', 'c', etc.
            
            // Build question HTML
            const questionHTML = `
            <div class="question">
                <div class="question-text">${questionNum}. ${q.question} <span class="audio-icon" onclick="speakSentence(this)">🔊</span></div>
                <div class="options">
                    ${shuffledOptionsArray.map((opt, idx) => `
                    <label class="option">
                        <input type="radio" name="${questionId}" value="${String.fromCharCode(97 + idx)}">
                        ${opt.text}
                    </label>`).join('')}
                </div>
                <div class="feedback" id="feedback${questionNum}"></div>
                <div class="explanation" id="explanation${questionNum}">
                    ${q.explanation}
                </div>
                <button type="button" class="check-btn" onclick="checkQuestion(${questionNum})">Check Answer</button>
            </div>`;
            
            quizForm.innerHTML += questionHTML;
        });
    }

    // Initialize quiz on page load
    window.addEventListener('DOMContentLoaded', generateQuiz);

    function checkQuestion(questionNum) {
        const question = `q${questionNum}`;
        const selected = document.querySelector(`input[name="${question}"]:checked`);
        
        if (!selected) {
            alert('Please select an answer first.');
            return;
        }

        const isCorrect = (selected.value === answers[question]);
        renderSemanticFeedback(questionNum, isCorrect);
        
        const button = event.target;
        button.disabled = true;
        button.textContent = 'Checked ✓';
        
        checkedQuestions.add(questionNum);
        updateProgress();
    }
    
    function updateProgress() {
        const totalQuestions = Object.keys(answers).length;
        const checked = checkedQuestions.size;
        const progressText = document.getElementById('progressText');
        
        if (checked === 0) {
            progressText.textContent = 'Answer the questions below';
        } else if (checked === totalQuestions) {
            const correctCount = Array.from(checkedQuestions).filter(num => {
                const question = `q${num}`;
                const selected = document.querySelector(`input[name="${question}"]:checked`);
                return selected && selected.value === answers[question];
            }).length;
            
            progressText.textContent = `Quiz Complete! Score: ${correctCount}/${totalQuestions}`;
        } else {
            progressText.textContent = `Progress: ${checked}/${totalQuestions} questions checked`;
        }
    }

    function resetQuiz() {
        // Regenerate the quiz with new random questions
        generateQuiz();
        
        // Reset progress
        checkedQuestions.clear();
        updateProgress();
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
