layout: default
title: "Quiz: Pronoun Table"
category: "Quizzes"
icon: "📝"
---

<div class="quiz-container">
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Answer the questions below</span>
            <button class="reset-btn" onclick="resetQuiz()">Reset All</button>
        </div>

        <form id="quizForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>
</div>

<script>
    let checkedQuestions = new Set();
    let currentQuestions = [];
    let answers = {};
    
    // Question bank with all possible questions
    const questionBank = [
        {
            question: "This book is _____. I bought it yesterday.",
            options: ["mine", "my", "me"],
            correct: 0,
            explanation: "Use possessive pronoun 'mine' (not 'my') when not followed by a noun."
        },
        {
            question: "Can you help _____? I need assistance.",
            options: ["me", "I", "my"],
            correct: 0,
            explanation: "Use object pronoun 'me' after verbs and prepositions."
        },
        {
            question: "_____ am going to the store.",
            options: ["I", "Me", "My"],
            correct: 0,
            explanation: "Use subject pronoun 'I' as the subject of the sentence."
        },
        {
            question: "That car is _____. They bought it last week.",
            options: ["theirs", "their", "them"],
            correct: 0,
            explanation: "Use possessive pronoun 'theirs' when not followed by a noun."
        },
        {
            question: "_____ book is on the table.",
            options: ["Her", "She", "Hers"],
            correct: 0,
            explanation: "Use possessive adjective 'her' before a noun."
        },
        {
            question: "I saw _____ at the mall yesterday.",
            options: ["him", "he", "his"],
            correct: 0,
            explanation: "Use object pronoun 'him' as the object of the verb 'saw'."
        },
        {
            question: "Which is CORRECT?",
            options: ["This is my book.", "This book is my.", "This is me book."],
            correct: 0,
            explanation: "Use possessive adjective 'my' before a noun."
        },
        {
            question: "The cat licked _____ paws.",
            options: ["its", "it's", "it"],
            correct: 0,
            explanation: "Use possessive adjective 'its' (no apostrophe) to show possession."
        },
        {
            question: "_____ are students at this school.",
            options: ["We", "Us", "Our"],
            correct: 0,
            explanation: "Use subject pronoun 'we' as the subject of the sentence."
        },
        {
            question: "Is this pen _____?",
            options: ["yours", "your", "you"],
            correct: 0,
            explanation: "Use possessive pronoun 'yours' when not followed by a noun."
        },
        {
            question: "Please give the letter to _____.",
            options: ["her", "she", "hers"],
            correct: 0,
            explanation: "Use object pronoun 'her' after the preposition 'to'."
        },
        {
            question: "_____ house is bigger than _____.",
            options: ["Their, ours", "They, our", "Them, us"],
            correct: 0,
            explanation: "Use possessive adjective 'their' before noun, possessive pronoun 'ours' alone."
        },
        {
            question: "Which is INCORRECT?",
            options: ["Me and John went out.", "John and I went out.", "We went out."],
            correct: 0,
            explanation: "Use 'I' (not 'me') as a subject. Say 'John and I' not 'Me and John'."
        },
        {
            question: "_____ children are playing outside.",
            options: ["Our", "We", "Us"],
            correct: 0,
            explanation: "Use possessive adjective 'our' before a noun."
        },
        {
            question: "The teacher spoke to _____.",
            options: ["us", "we", "our"],
            correct: 0,
            explanation: "Use object pronoun 'us' after preposition 'to'."
        },
        {
            question: "_____ is raining outside.",
            options: ["It", "Its", "It's"],
            correct: 0,
            explanation: "Use subject pronoun 'it' for weather."
        },
        {
            question: "The decision is _____.",
            options: ["yours", "your", "you"],
            correct: 0,
            explanation: "Use possessive pronoun 'yours' when standing alone."
        },
        {
            question: "She hurt _____ while cooking.",
            options: ["herself", "her", "she"],
            correct: 0,
            explanation: "Use reflexive pronoun 'herself' when subject and object are the same person."
        },
        {
            question: "_____ wallet is this?",
            options: ["Whose", "Who's", "Who"],
            correct: 0,
            explanation: "Use 'whose' to ask about possession."
        },
        {
            question: "They enjoyed _____ at the party.",
            options: ["themselves", "them", "their"],
            correct: 0,
            explanation: "Use reflexive pronoun 'themselves' when the subject and object are the same."
        }
    ];

    // Shuffle array function
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Generate quiz on page load
    function generateQuiz() {
        // Shuffle and select 12 random questions
        const shuffled = shuffle(questionBank);
        currentQuestions = shuffled.slice(0, 12);
        
        // Generate HTML for questions
        const quizForm = document.getElementById('quizForm');
        quizForm.innerHTML = '';
        
        currentQuestions.forEach((q, index) => {
            const questionNum = index + 1;
            const questionId = `q${questionNum}`;
            
            // Shuffle options
            const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            const shuffledOptionsArray = shuffle(shuffledOptions);
            
            // Find correct answer index after shuffle
            const correctIndex = shuffledOptionsArray.findIndex(opt => opt.isCorrect);
            answers[questionId] = String.fromCharCode(97 + correctIndex); // 'a', 'b', 'c', etc.
            
            // Build question HTML
            const questionHTML = `
            <div class="question">
                <div class="question-text">${questionNum}. ${q.question} <span class="audio-icon" onclick="speakSentence(this)">🔊</span></div>
                <div class="options">
                    ${shuffledOptionsArray.map((opt, idx) => `
                    <label class="option">
                        <input type="radio" name="${questionId}" value="${String.fromCharCode(97 + idx)}">
                        ${opt.text}
                    </label>`).join('')}
                </div>
                <div class="feedback" id="feedback${questionNum}"></div>
                <div class="explanation" id="explanation${questionNum}">
                    ${q.explanation}
                </div>
                <button type="button" class="check-btn" onclick="checkQuestion(${questionNum})">Check Answer</button>
            </div>`;
            
            quizForm.innerHTML += questionHTML;
        });
    }

    // Initialize quiz on page load
    window.addEventListener('DOMContentLoaded', generateQuiz);

    function checkQuestion(questionNum) {
        const question = `q${questionNum}`;
        const selected = document.querySelector(`input[name="${question}"]:checked`);
        
        if (!selected) {
            alert('Please select an answer first.');
            return;
        }

        const isCorrect = (selected.value === answers[question]);
        renderSemanticFeedback(questionNum, isCorrect);
        
        const button = event.target;
        button.disabled = true;
        button.textContent = 'Checked ✓';
        
        checkedQuestions.add(questionNum);
        updateProgress();
    }
    
    function updateProgress() {
        const totalQuestions = Object.keys(answers).length;
        const checked = checkedQuestions.size;
        const progressText = document.getElementById('progressText');
        
        if (checked === 0) {
            progressText.textContent = 'Answer the questions below';
        } else if (checked === totalQuestions) {
            const correctCount = Array.from(checkedQuestions).filter(num => {
                const question = `q${num}`;
                const selected = document.querySelector(`input[name="${question}"]:checked`);
                return selected && selected.value === answers[question];
            }).length;
            
            progressText.textContent = `Quiz Complete! Score: ${correctCount}/${totalQuestions}`;
        } else {
            progressText.textContent = `Progress: ${checked}/${totalQuestions} questions checked`;
        }
    }

    function resetQuiz() {
        // Regenerate the quiz with new random questions
        generateQuiz();
        
        // Reset progress
        checkedQuestions.clear();
        updateProgress();
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
