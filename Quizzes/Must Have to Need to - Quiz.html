<div class="quiz-container">
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Answer the questions below</span>
            <button class="reset-btn" onclick="resetQuiz()">Reset All</button>
        </div>

        <form id="quizForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>
</div>

<script>
    let checkedQuestions = new Set();
    let currentQuestions = [];
    let answers = {};
    
    // Question bank with all possible questions
    const questionBank = [
        {
            question: "You _____ wear a seatbelt. It's the law.",
            options: ["must", "need", "should"],
            correct: 0,
            explanation: "Use 'must' for strong obligation or rules/laws."
        },
        {
            question: "She _____ to finish her homework before going out.",
            options: ["has", "must", "needs"],
            correct: 0,
            explanation: "Use 'has to' for external obligations."
        },
        {
            question: "Do I _____ to bring my passport?",
            options: ["need", "must", "have"],
            correct: 0,
            explanation: "Use 'need to' in questions about necessity."
        },
        {
            question: "You _____ be quiet in the library.",
            options: ["must", "need", "have"],
            correct: 0,
            explanation: "Use 'must' for rules and strong obligations."
        },
        {
            question: "He _____ to see a doctor about his cough.",
            options: ["needs", "musts", "has"],
            correct: 0,
            explanation: "Use 'needs to' for advice or recommendations."
        },
        {
            question: "We _____ hurry or we'll be late.",
            options: ["must", "need", "have"],
            correct: 0,
            explanation: "Use 'must' for urgent necessity from the speaker's perspective."
        },
        {
            question: "Students _____ to attend all classes.",
            options: ["have", "must", "need"],
            correct: 0,
            explanation: "Use 'have to' for external rules or requirements."
        },
        {
            question: "Which sentence expresses the STRONGEST obligation?",
            options: ["You should study.", "You must study.", "You need to study."],
            correct: 1,
            explanation: "'Must' expresses the strongest obligation or necessity."
        },
        {
            question: "You don't _____ to wear a uniform.",
            options: ["have", "must", "need"],
            correct: 0,
            explanation: "Use 'don't have to' or 'don't need to' to say something is not necessary."
        },
        {
            question: "I _____ remember to call my mother.",
            options: ["must", "have", "need"],
            correct: 0,
            explanation: "Use 'must' for personal obligations or reminders to oneself."
        },
        {
            question: "_____ she have to work on weekends?",
            options: ["Does", "Must", "Needs"],
            correct: 0,
            explanation: "Use 'Does... have to' for questions about external obligations."
        },
        {
            question: "You _____ not smoke in this building.",
            options: ["must", "have", "need"],
            correct: 0,
            explanation: "Use 'must not' for prohibition (it's forbidden)."
        },
        {
            question: "They _____ to leave early tomorrow.",
            options: ["need", "must", "have"],
            correct: 0,
            explanation: "Use 'need to' to express necessity."
        },
        {
            question: "Which is INCORRECT?",
            options: ["He musts go now.", "He must go now.", "He has to go now."],
            correct: 0,
            explanation: "'Must' doesn't add 's' in third person. 'He must go' is correct."
        },
        {
            question: "Children _____ respect their elders.",
            options: ["must", "have", "need"],
            correct: 0,
            explanation: "Use 'must' for moral obligations or strong advice."
        },
        {
            question: "Do we _____ to bring anything to the party?",
            options: ["need", "must", "have"],
            correct: 0,
            explanation: "Use 'need to' in questions about what is necessary."
        },
        {
            question: "She _____ to lose weight for health reasons.",
            options: ["needs", "musts", "has"],
            correct: 0,
            explanation: "Use 'needs to' for recommendations or advice."
        },
        {
            question: "You _____ not tell anyone about this.",
            options: ["must", "have", "need"],
            correct: 0,
            explanation: "Use 'must not' (mustn't) for strong prohibition."
        },
        {
            question: "I _____ to buy some milk on the way home.",
            options: ["need", "must", "have"],
            correct: 0,
            explanation: "Use 'need to' to express something that is necessary."
        },
        {
            question: "Drivers _____ stop at red lights.",
            options: ["must", "need", "have"],
            correct: 0,
            explanation: "Use 'must' for traffic laws and regulations."
        }
    ];

    // Shuffle array function
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Generate quiz on page load
    function generateQuiz() {
        // Shuffle and select 12 random questions
        const shuffled = shuffle(questionBank);
        currentQuestions = shuffled.slice(0, 12);
        
        // Generate HTML for questions
        const quizForm = document.getElementById('quizForm');
        quizForm.innerHTML = '';
        
        currentQuestions.forEach((q, index) => {
            const questionNum = index + 1;
            const questionId = `q${questionNum}`;
            
            // Shuffle options
            const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            const shuffledOptionsArray = shuffle(shuffledOptions);
            
            // Find correct answer index after shuffle
            const correctIndex = shuffledOptionsArray.findIndex(opt => opt.isCorrect);
            answers[questionId] = String.fromCharCode(97 + correctIndex); // 'a', 'b', 'c', etc.
            
            // Build question HTML
            const questionHTML = `
            <div class="question">
                <div class="question-text">${questionNum}. ${q.question} <span class="audio-icon" onclick="speakSentence(this)">🔊</span></div>
                <div class="options">
                    ${shuffledOptionsArray.map((opt, idx) => `
                    <label class="option">
                        <input type="radio" name="${questionId}" value="${String.fromCharCode(97 + idx)}">
                        ${opt.text}
                    </label>`).join('')}
                </div>
                <div class="feedback" id="feedback${questionNum}"></div>
                <div class="explanation" id="explanation${questionNum}">
                    ${q.explanation}
                </div>
                <button type="button" class="check-btn" onclick="checkQuestion(${questionNum})">Check Answer</button>
            </div>`;
            
            quizForm.innerHTML += questionHTML;
        });
    }

    // Initialize quiz on page load
    window.addEventListener('DOMContentLoaded', generateQuiz);

    function checkQuestion(questionNum) {
        const question = `q${questionNum}`;
        const selected = document.querySelector(`input[name="${question}"]:checked`);
        
        if (!selected) {
            alert('Please select an answer first.');
            return;
        }

        const isCorrect = (selected.value === answers[question]);
        renderSemanticFeedback(questionNum, isCorrect);
        
        const button = event.target;
        button.disabled = true;
        button.textContent = 'Checked ✓';
        
        checkedQuestions.add(questionNum);
        updateProgress();
    }
    
    function updateProgress() {
        const totalQuestions = Object.keys(answers).length;
        const checked = checkedQuestions.size;
        const progressText = document.getElementById('progressText');
        
        if (checked === 0) {
            progressText.textContent = 'Answer the questions below';
        } else if (checked === totalQuestions) {
            const correctCount = Array.from(checkedQuestions).filter(num => {
                const question = `q${num}`;
                const selected = document.querySelector(`input[name="${question}"]:checked`);
                return selected && selected.value === answers[question];
            }).length;
            
            progressText.textContent = `Quiz Complete! Score: ${correctCount}/${totalQuestions}`;
        } else {
            progressText.textContent = `Progress: ${checked}/${totalQuestions} questions checked`;
        }
    }

    function resetQuiz() {
        // Regenerate the quiz with new random questions
        generateQuiz();
        
        // Reset progress
        checkedQuestions.clear();
        updateProgress();
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
