        },
        {
            question: "She _____ finish her homework before going out.",

        },
        {
            question: "_____ I have to bring my passport?",
            options: ["Do", "Must", "Does", "Am"],
            correct: 0,

        {
            question: "You _____ be quiet in the library — it's the rule.",
            options: ["must", "don't have to", "needn't", "could"],

            question: "He _____ see a doctor about that cough.",
            options: ["needs to", "needs", "need to", "must to"],

        {
            question: "Entry to the museum is free, so you _____ pay.",
            options: ["don't have to", "must not", "must", "have to"],

            explanation: "No payment is REQUIRED (your choice) — don't have to. 'Must not pay' would mean paying is forbidden!"
        },
        {
            question: "You _____ cheat in the exam — it's strictly forbidden.",

        {
            question: "The dress code is casual, so you _____ wear a tie.",

        {
            question: "You _____ feed the animals at the zoo. It's dangerous and against the rules.",

        {
            question: "Tomorrow is a holiday, so I _____ wake up early.",
            options: ["don't have to", "mustn't", "must", "have to"],

        {
            question: "Which sentence expresses the STRONGEST obligation?",

        {
            question: "Which is INCORRECT?",

        {
            question: "_____ she have to work on Saturdays?",

            question: "We _____ hurry — the show doesn't start for two hours.",
