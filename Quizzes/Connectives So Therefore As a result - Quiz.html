---
layout: default
title: "Quiz: Connectives - So, Therefore, As a result"
category: "Quizzes"
icon: "📝"
---

<div class="quiz-container">
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Answer the questions below</span>
            <button class="reset-btn" onclick="resetQuiz()">Reset All</button>
        </div>

        <form id="quizForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>
</div>

<script>
    let checkedQuestions = new Set();
    let currentQuestions = [];
    let answers = {};
    
    // Question bank with all possible questions
    const questionBank = [
        {
            question: "Complete the sentence: It was cold, _____ I wore a jacket.",
            options: ["so", "Therefore", "As a result"],
            correct: 0,
            explanation: '"So" is correct here because it connects two clauses with a comma in the same sentence. "Therefore" and "As a result" would need a period before them.'
        },
        {
            question: "Which sentence is correctly punctuated?",
            options: ["The store was closed, therefore we left.", "The store was closed. Therefore, we left.", "The store was closed therefore, we left."],
            correct: 1,
            explanation: '"Therefore" starts a new sentence and requires a period before it and a comma after it: "Sentence. Therefore, sentence."'
        },
        {
            question: "Complete the formal sentence: Traffic was heavy. ______________, we arrived late.",
            options: ["so", "As a result", "as a result"],
            correct: 1,
            explanation: '"As a result" (with capital A) is correct for a formal sentence that starts after a period. Note: lowercase "so" cannot start a new sentence.'
        },
        {
            question: "Which sentence is INCORRECT?",
            options: ["I was tired, so I slept early.", "I was tired. Therefore, I slept early.", "I was tired. So, I slept early."],
            correct: 2,
            explanation: '"So" cannot start a new sentence after a period. It should be used with a comma: "I was tired, so I slept early."'
        },
        {
            question: "The experiment failed. ______________, we need to try again.",
            options: ["so", "Therefore,", "Therefore"],
            correct: 1,
            explanation: '"Therefore," (with a comma after) is correct. The pattern is: "Sentence. Therefore, sentence."'
        },
        {
            question: "She practiced every day, _____ she won the competition.",
            options: ["so", "Therefore,", "As a result,"],
            correct: 0,
            explanation: '"So" is correct because it follows a comma and connects two clauses. "Therefore" and "As a result" would need a period before them.'
        },
        {
            question: "The company lost money. ______________, they had to close several stores.",
            options: ["So", "As a result,", "so,"],
            correct: 1,
            explanation: '"As a result," is correct for formal writing when starting a new sentence after a period. "So" cannot start a new sentence.'
        },
        {
            question: "He didn't study, _____ he failed the test.",
            options: ["so", "Therefore", "As a result"],
            correct: 0,
            explanation: '"So" is correct because it connects two clauses with a comma in the same sentence. "Therefore" and "As a result" would need a period before them.'
        },
        {
            question: "Which sentence is correctly punctuated?",
            options: ["The weather was bad, as a result we cancelled the trip.", "The weather was bad. As a result, we cancelled the trip.", "The weather was bad as a result, we cancelled the trip."],
            correct: 1,
            explanation: '"As a result" starts a new sentence and requires a period before it and a comma after it: "Sentence. As a result, sentence."'
        },
        {
            question: "The train was delayed. ______________, I missed my meeting.",
            options: ["so", "Therefore,", "therefore"],
            correct: 1,
            explanation: '"Therefore," (with capital T and a comma after) is correct for a formal sentence after a period. "So" cannot start a new sentence.'
        },
        {
            question: "It was getting dark, _____ we turned on the lights.",
            options: ["so", "Therefore,", "As a result,"],
            correct: 0,
            explanation: '"So" is correct because it follows a comma and connects two clauses in the same sentence. "Therefore" and "As a result" would need a period before them.'
        },
        {
            question: "Which sentence is INCORRECT?",
            options: ["She was sick, so she stayed home.", "She was sick. As a result, she stayed home.", "She was sick, therefore she stayed home."],
            correct: 2,
            explanation: '"Therefore" cannot be used with just a comma before it. It needs a period: "She was sick. Therefore, she stayed home."'
        },
        {
            question: "The bus broke down, _____ we had to walk.",
            options: ["so", "Therefore", "As a result"],
            correct: 0,
            explanation: '"So" is correct because it connects two clauses with a comma in the same sentence.'
        },
        {
            question: "The meeting was cancelled. ______________, everyone went home.",
            options: ["So", "Therefore,", "so,"],
            correct: 1,
            explanation: '"Therefore," is correct for formal writing when starting a new sentence after a period.'
        },
        {
            question: "Which is the FORMAL option?",
            options: ["It rained, so we cancelled.", "It rained. Therefore, we cancelled.", "It rained so we cancelled."],
            correct: 1,
            explanation: '"Therefore" is formal and requires proper punctuation with a period before and comma after.'
        },
        {
            question: "She forgot her keys, _____ she couldn't enter.",
            options: ["so", "Therefore,", "As a result,"],
            correct: 0,
            explanation: '"So" connects two clauses with a comma in an informal sentence.'
        },
        {
            question: "The power went out. ______________, the computers shut down.",
            options: ["So", "As a result,", "so"],
            correct: 1,
            explanation: '"As a result," is correct for formal writing after a period.'
        },
        {
            question: "Which sentence is correctly punctuated?",
            options: ["He was late, therefore he missed the bus.", "He was late. Therefore, he missed the bus.", "He was late therefore, he missed the bus."],
            correct: 1,
            explanation: '"Therefore" needs a period before it and comma after: "Sentence. Therefore, sentence."'
        },
        {
            question: "The price was too high, _____ we didn't buy it.",
            options: ["so", "Therefore", "As a result"],
            correct: 0,
            explanation: '"So" connects two clauses with a comma in the same sentence.'
        },
        {
            question: "The deadline was extended. ______________, we had more time.",
            options: ["So,", "Therefore,", "so"],
            correct: 1,
            explanation: '"Therefore," is correct for formal writing after a period with proper capitalization and punctuation.'
        }
    ];

    // Shuffle array function
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Generate quiz on page load
    function generateQuiz() {
        // Shuffle and select 12 random questions
        const shuffled = shuffle(questionBank);
        currentQuestions = shuffled.slice(0, 12);
        
        // Generate HTML for questions
        const quizForm = document.getElementById('quizForm');
        quizForm.innerHTML = '';
        
        currentQuestions.forEach((q, index) => {
            const questionNum = index + 1;
            const questionId = `q${questionNum}`;
            
            // Shuffle options
            const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            const shuffledOptionsArray = shuffle(shuffledOptions);
            
            // Find correct answer index after shuffle
            const correctIndex = shuffledOptionsArray.findIndex(opt => opt.isCorrect);
            answers[questionId] = String.fromCharCode(97 + correctIndex); // 'a', 'b', 'c', etc.
            
            // Build question HTML
            const questionHTML = `
            <div class="question">
                <div class="question-text">${questionNum}. ${q.question}</div>
                <div class="options">
                    ${shuffledOptionsArray.map((opt, idx) => `
                    <label class="option">
                        <input type="radio" name="${questionId}" value="${String.fromCharCode(97 + idx)}">
                        ${opt.text}
                    </label>`).join('')}
                </div>
                <div class="feedback" id="feedback${questionNum}"></div>
                <div class="explanation" id="explanation${questionNum}">
                    ${q.explanation}
                </div>
                <button type="button" class="check-btn" onclick="checkQuestion(${questionNum})">Check Answer</button>
            </div>`;
            
            quizForm.innerHTML += questionHTML;
        });
    }

    // Initialize quiz on page load
    window.addEventListener('DOMContentLoaded', generateQuiz);

    function checkQuestion(questionNum) {
        const question = `q${questionNum}`;
        const selected = document.querySelector(`input[name="${question}"]:checked`);
        
        if (!selected) {
            alert('Please select an answer first.');
            return;
        }

        const feedbackEl = document.getElementById(`feedback${questionNum}`);
        const explanationEl = document.getElementById(`explanation${questionNum}`);
        const button = event.target;
        
        if (selected.value === answers[question]) {
            feedbackEl.className = 'feedback correct';
            feedbackEl.textContent = '✓ Correct!';
        } else {
            feedbackEl.className = 'feedback incorrect';
            feedbackEl.textContent = '✗ Incorrect. Check the explanation below.';
        }
        
        explanationEl.classList.add('show');
        button.disabled = true;
        button.textContent = 'Checked ✓';
        
        // Mark as checked
        checkedQuestions.add(questionNum);
        updateProgress();
    }
    
    function updateProgress() {
        const totalQuestions = Object.keys(answers).length;
        const checked = checkedQuestions.size;
        const progressText = document.getElementById('progressText');
        
        if (checked === 0) {
            progressText.textContent = 'Answer the questions below';
        } else if (checked === totalQuestions) {
            const correctCount = Array.from(checkedQuestions).filter(num => {
                const question = `q${num}`;
                const selected = document.querySelector(`input[name="${question}"]:checked`);
                return selected && selected.value === answers[question];
            }).length;
            
            progressText.textContent = `Quiz Complete! Score: ${correctCount}/${totalQuestions}`;
        } else {
            progressText.textContent = `Progress: ${checked}/${totalQuestions} questions checked`;
        }
    }

    function resetQuiz() {
        // Regenerate the quiz with new random questions
        generateQuiz();
        
        // Reset progress
        checkedQuestions.clear();
        updateProgress();
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
