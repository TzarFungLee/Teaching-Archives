---
layout: default
title: "Quiz: Adverbs of Sequence"
category: "Quizzes"
icon: "📝"
---

<div class="quiz-container">
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Answer the questions below</span>
            <button class="reset-btn" onclick="resetQuiz()">Reset All</button>
        </div>

        <form id="quizForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>
</div>

<script>
    let checkedQuestions = new Set();
    let currentQuestions = [];
    let answers = {};
    
    // Question bank with all possible questions
    const questionBank = [
        {
            question: "_____, I woke up at 7 AM. Then I had breakfast.",
            options: ["First", "Finally", "After that"],
            correct: 0,
            explanation: "Use 'First' to introduce the beginning action in a sequence."
        },
        {
            question: "I finished my homework. _____, I watched TV.",
            options: ["After that", "First", "Before"],
            correct: 0,
            explanation: "Use 'After that' or 'Then' to show what happened next."
        },
        {
            question: "_____, we arrived at the airport safely.",
            options: ["Finally", "First", "Next"],
            correct: 0,
            explanation: "Use 'Finally' to indicate the last action in a sequence."
        },
        {
            question: "First, mix the ingredients. _____, bake for 30 minutes.",
            options: ["Next", "Finally", "Before"],
            correct: 0,
            explanation: "Use 'Next' or 'Then' to show the following step."
        },
        {
            question: "I got dressed. _____ I left the house.",
            options: ["Then", "First", "Finally"],
            correct: 0,
            explanation: "Use 'Then' to connect consecutive actions."
        },
        {
            question: "Which adverb introduces the FIRST step?",
            options: ["First", "Then", "Finally"],
            correct: 0,
            explanation: "'First' or 'Firstly' introduces the beginning of a sequence."
        },
        {
            question: "First, boil water. Next, add pasta. _____, drain the water.",
            options: ["Finally", "First", "Then"],
            correct: 0,
            explanation: "Use 'Finally' to conclude the sequence of steps."
        },
        {
            question: "_____ going to bed, I brush my teeth.",
            options: ["Before", "After", "Then"],
            correct: 0,
            explanation: "Use 'Before' to show what happens earlier in time."
        },
        {
            question: "I studied hard. _____, I passed the exam.",
            options: ["As a result", "First", "Next"],
            correct: 0,
            explanation: "Use 'As a result' to show consequence, though it's more of a result connector than sequence."
        },
        {
            question: "Which is the CORRECT order?",
            options: ["First, Next, Finally", "Finally, First, Next", "Next, Finally, First"],
            correct: 0,
            explanation: "The logical sequence order is: First, Next/Then, Finally."
        },
        {
            question: "We arrived at the station. _____ we bought tickets.",
            options: ["Then", "Finally", "Before"],
            correct: 0,
            explanation: "Use 'Then' or 'After that' for the next action in sequence."
        },
        {
            question: "_____ eating dinner, I did the dishes.",
            options: ["After", "Before", "First"],
            correct: 0,
            explanation: "Use 'After' to show an action that follows another."
        },
        {
            question: "Turn on the computer. _____, open the program.",
            options: ["Next", "Finally", "Before"],
            correct: 0,
            explanation: "Use 'Next' or 'Then' for the subsequent step."
        },
        {
            question: "Which word shows the LAST action?",
            options: ["Finally", "First", "Next"],
            correct: 0,
            explanation: "'Finally' or 'Lastly' indicates the concluding action."
        },
        {
            question: "_____, preheat the oven. Then, prepare the ingredients.",
            options: ["First", "Finally", "After"],
            correct: 0,
            explanation: "Use 'First' to begin a sequence of instructions."
        },
        {
            question: "She read the instructions. _____, she assembled the furniture.",
            options: ["After that", "Before", "Finally"],
            correct: 0,
            explanation: "Use 'After that' or 'Then' to show the following action."
        },
        {
            question: "Add sugar. _____, stir well. Finally, serve.",
            options: ["Then", "First", "Before"],
            correct: 0,
            explanation: "Use 'Then' or 'Next' for middle steps in a sequence."
        },
        {
            question: "_____ leaving, I locked the door.",
            options: ["Before", "After", "Then"],
            correct: 0,
            explanation: "Use 'Before' to show what happens prior to another action."
        },
        {
            question: "I woke up, got dressed, had breakfast, and _____ left for work.",
            options: ["then", "first", "before"],
            correct: 0,
            explanation: "Use 'then' or 'finally' for the last action in a list."
        },
        {
            question: "Which is INCORRECT sequencing?",
            options: ["Finally, First, Next", "First, Then, Finally", "First, Next, Finally"],
            correct: 0,
            explanation: "'Finally' should come at the end, not the beginning of a sequence."
        }
    ];

    // Shuffle array function
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Generate quiz on page load
    function generateQuiz() {
        // Shuffle and select 12 random questions
        const shuffled = shuffle(questionBank);
        currentQuestions = shuffled.slice(0, 12);
        
        // Generate HTML for questions
        const quizForm = document.getElementById('quizForm');
        quizForm.innerHTML = '';
        
        currentQuestions.forEach((q, index) => {
            const questionNum = index + 1;
            const questionId = `q${questionNum}`;
            
            // Shuffle options
            const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            const shuffledOptionsArray = shuffle(shuffledOptions);
            
            // Find correct answer index after shuffle
            const correctIndex = shuffledOptionsArray.findIndex(opt => opt.isCorrect);
            answers[questionId] = String.fromCharCode(97 + correctIndex); // 'a', 'b', 'c', etc.
            
            // Build question HTML
            const questionHTML = `
            <div class="question">
                <div class="question-text">${questionNum}. ${q.question}</div>
                <div class="options">
                    ${shuffledOptionsArray.map((opt, idx) => `
                    <label class="option">
                        <input type="radio" name="${questionId}" value="${String.fromCharCode(97 + idx)}">
                        ${opt.text}
                    </label>`).join('')}
                </div>
                <div class="feedback" id="feedback${questionNum}"></div>
                <div class="explanation" id="explanation${questionNum}">
                    ${q.explanation}
                </div>
                <button type="button" class="check-btn" onclick="checkQuestion(${questionNum})">Check Answer</button>
            </div>`;
            
            quizForm.innerHTML += questionHTML;
        });
    }

    // Initialize quiz on page load
    window.addEventListener('DOMContentLoaded', generateQuiz);

    function checkQuestion(questionNum) {
        const question = `q${questionNum}`;
        const selected = document.querySelector(`input[name="${question}"]:checked`);
        
        if (!selected) {
            alert('Please select an answer first.');
            return;
        }

        const feedbackEl = document.getElementById(`feedback${questionNum}`);
        const explanationEl = document.getElementById(`explanation${questionNum}`);
        const button = event.target;
        
        if (selected.value === answers[question]) {
            feedbackEl.className = 'feedback correct';
            feedbackEl.textContent = '✓ Correct!';
        } else {
            feedbackEl.className = 'feedback incorrect';
            feedbackEl.textContent = '✗ Incorrect. Check the explanation below.';
        }
        
        explanationEl.classList.add('show');
        button.disabled = true;
        button.textContent = 'Checked ✓';
        
        // Mark as checked
        checkedQuestions.add(questionNum);
        updateProgress();
    }
    
    function updateProgress() {
        const totalQuestions = Object.keys(answers).length;
        const checked = checkedQuestions.size;
        const progressText = document.getElementById('progressText');
        
        if (checked === 0) {
            progressText.textContent = 'Answer the questions below';
        } else if (checked === totalQuestions) {
            const correctCount = Array.from(checkedQuestions).filter(num => {
                const question = `q${num}`;
                const selected = document.querySelector(`input[name="${question}"]:checked`);
                return selected && selected.value === answers[question];
            }).length;
            
            progressText.textContent = `Quiz Complete! Score: ${correctCount}/${totalQuestions}`;
        } else {
            progressText.textContent = `Progress: ${checked}/${totalQuestions} questions checked`;
        }
    }

    function resetQuiz() {
        // Regenerate the quiz with new random questions
        generateQuiz();
        
        // Reset progress
        checkedQuestions.clear();
        updateProgress();
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
