<script>
    // Question bank for the shared quiz engine (assets/js/quiz-engine.js)
    // Mirrors the lesson: defining vs non-defining, comma rules, the that-ban
    // in non-defining clauses, whose/where/when, and pronoun omission.
    const questionBank = [
        {
            question: "The book _____ I borrowed from the library is overdue.",
            options: ["that", "who", "whose", "where"],
            correct: 0,
            explanation: "A thing, defining clause: that (or which)."
        },
        {
            question: "My brother, _____ lives in London, is a doctor.",
            options: ["who", "that", "which", "whose"],
            correct: 0,
            explanation: "Non-defining clause about a person: who. (Never 'that' between commas!)"
        },
        {
            question: "Which sentence needs commas?",
            options: ["My mother who loves gardening grew these flowers.", "The girl who sits beside me is friendly.", "The bag that I lost was blue.", "People who exercise are healthier."],
            correct: 0,
            explanation: "You have only one mother — the clause is EXTRA info, so it needs commas."
        },
        {
            question: "The flat _____ we visited last weekend was tiny.",
            options: ["that", "who", "whose", "what"],
            correct: 0,
            explanation: "A thing, defining: that/which. ('What' is never a relative pronoun.)"
        },
        {
            question: "Hong Kong Park, _____ is in Admiralty, has a big aviary.",
            options: ["which", "that", "who", "where"],
            correct: 0,
            explanation: "Non-defining clause about a thing/place used as subject: which."
        },
        {
            question: "People _____ exercise regularly tend to sleep better.",
            options: ["who", "which", "whose", "when"],
            correct: 0,
            explanation: "People = who (or that) in a defining clause."
        },
        {
            question: "Which is CORRECT?",
            options: ["The man who I met was kind.", "The man, that I met, was kind.", "The man what I met was kind.", "The man, whose I met, was kind."],
            correct: 0,
            explanation: "Defining clause, no commas; 'that' can never sit between commas."
        },
        {
            question: "The students _____ passed the mock exam celebrated with bubble tea.",
            options: ["who", "which", "whose", "where"],
            correct: 0,
            explanation: "People as subject of a defining clause: who/that."
        },
        {
            question: "My bicycle, _____ I bought only last year, has already rusted.",
            options: ["which", "that", "who", "whose"],
            correct: 0,
            explanation: "Non-defining clause about a thing: which (that is banned here)."
        },
        {
            question: "Which is INCORRECT?",
            options: ["The book, that I read, was good.", "The book that I read was good.", "The book which I read was good.", "The book I read was good."],
            correct: 0,
            explanation: "'That' cannot be used in a non-defining (comma) clause — and this clause shouldn't have commas anyway."
        },
        {
            question: "The woman _____ works at the tuck shop is my aunt.",
            options: ["who", "which", "whose", "whom she"],
            correct: 0,
            explanation: "Person as subject: who."
        },
        {
            question: "Shakespeare, _____ wrote Hamlet, lived 400 years ago.",
            options: ["who", "that", "which", "whose"],
            correct: 0,
            explanation: "Non-defining, person: who."
        },
        {
            question: "My teacher, _____ name is Miss Chan, is very patient.",
            options: ["whose", "who's", "which", "who"],
            correct: 0,
            explanation: "Possession: whose. (who's = who is!)"
        },
        {
            question: "This is the boy _____ bag was stolen on the MTR.",
            options: ["whose", "who's", "that", "which"],
            correct: 0,
            explanation: "The bag belongs to the boy: whose."
        },
        {
            question: "The village _____ my grandparents live has no supermarket.",
            options: ["where", "which", "that", "who"],
            correct: 0,
            explanation: "A place + a full clause after it: where (= in which)."
        },
        {
            question: "I still remember the day _____ we first met.",
            options: ["when", "where", "who", "whose"],
            correct: 0,
            explanation: "A time: when."
        },
        {
            question: "Which needs NO commas?",
            options: ["The dog that barks all night lives next door.", "My dog which barks all night is old.", "Kowloon which is very crowded is exciting.", "Mr. Lee who teaches maths is retiring."],
            correct: 0,
            explanation: "Defining clause — it tells us WHICH dog — so no commas."
        },
        {
            question: "In which sentence can the pronoun be LEFT OUT?",
            options: ["The film that we watched was great.", "The man that helped us was kind.", "The bus that goes to Stanley is late.", "The girl that called you is here."],
            correct: 0,
            explanation: "Drop the pronoun only when it is the OBJECT (we watched [the film]). In the others it is the subject."
        },
        {
            question: "Mr. Smith, _____ is our neighbour, turned 80 yesterday.",
            options: ["who", "that", "which", "whose"],
            correct: 0,
            explanation: "Non-defining, person: who."
        },
        {
            question: "What does the comma pair signal in: 'My car, which is red, broke down'?",
            options: ["The clause is extra information", "The clause is essential to identify the car", "The sentence is a question", "The clause is in the past"],
            correct: 0,
            explanation: "Commas = non-defining = extra, removable information (you have one car)."
        }
    ];
</script>
