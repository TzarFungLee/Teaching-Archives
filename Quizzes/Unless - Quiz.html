icon: "📝"

<div class="quiz-container">
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Answer the questions below</span>
            <button class="reset-btn" onclick="resetQuiz()">Reset All</button>
        </div>

        <form id="quizForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>
</div>

<script>
    let checkedQuestions = new Set();
    let currentQuestions = [];
    let answers = {};
    
    // Question bank with all possible questions
    const questionBank = [
        {
            question: "You will fail _____ you study harder.",
            options: ["unless", "if", "when"],
            correct: 0,
            explanation: "'Unless' means 'if not'. 'You will fail unless you study' = 'You will fail if you don't study'."
        },
        {
            question: "Which has the SAME meaning as: 'Unless it rains, we'll go out'?",
            options: ["If it doesn't rain, we'll go out.", "If it rains, we'll go out.", "When it rains, we'll go out."],
            correct: 0,
            explanation: "'Unless' = 'if not'. So 'unless it rains' = 'if it doesn't rain'."
        },
        {
            question: "She won't come _____ you invite her.",
            options: ["unless", "if", "when"],
            correct: 0,
            explanation: "Use 'unless' to mean 'if not'. She won't come if you don't invite her."
        },
        {
            question: "_____ you hurry, you'll miss the bus.",
            options: ["Unless", "If", "When"],
            correct: 0,
            explanation: "'Unless you hurry' = 'If you don't hurry'."
        },
        {
            question: "Which is INCORRECT?",
            options: ["Unless you don't study, you'll fail.", "Unless you study, you'll fail.", "If you don't study, you'll fail."],
            correct: 0,
            explanation: "Don't use 'unless' with negative. Say 'unless you study' NOT 'unless you don't study'."
        },
        {
            question: "I won't go _____ you come with me.",
            options: ["unless", "if", "when"],
            correct: 0,
            explanation: "'Unless' means 'if not'. I won't go if you don't come with me."
        },
        {
            question: "_____ we leave now, we'll be late.",
            options: ["Unless", "If", "When"],
            correct: 0,
            explanation: "'Unless we leave now' = 'If we don't leave now'."
        },
        {
            question: "Rewrite: 'If you don't water plants, they die.' Using 'unless':",
            options: ["Unless you water plants, they die.", "Unless you don't water plants, they die.", "When you water plants, they die."],
            correct: 0,
            explanation: "'Unless' replaces 'if not', so remove 'don't' when converting."
        },
        {
            question: "They won't succeed _____ they work together.",
            options: ["unless", "if", "when"],
            correct: 0,
            explanation: "'Unless they work together' = 'If they don't work together'."
        },
        {
            question: "_____ you have a ticket, you can't enter.",
            options: ["Unless", "If", "When"],
            correct: 0,
            explanation: "'Unless you have a ticket' = 'If you don't have a ticket'."
        },
        {
            question: "Which means the SAME as: 'If you don't apologize, she'll be angry'?",
            options: ["Unless you apologize, she'll be angry.", "Unless you don't apologize, she'll be angry.", "When you apologize, she'll be angry."],
            correct: 0,
            explanation: "Convert 'if not' to 'unless' by removing the negative."
        },
        {
            question: "You won't improve _____ you practice.",
            options: ["unless", "if", "when"],
            correct: 0,
            explanation: "'Unless' = 'if not'. You won't improve if you don't practice."
        },
        {
            question: "_____ the weather improves, we'll cancel the trip.",
            options: ["Unless", "If", "When"],
            correct: 0,
            explanation: "'Unless the weather improves' = 'If the weather doesn't improve'."
        },
        {
            question: "Which is CORRECT?",
            options: ["I'll stay home unless it's sunny.", "I'll stay home unless it won't be sunny.", "I'll stay home unless not sunny."],
            correct: 0,
            explanation: "Use positive verb after 'unless'. Don't add another negative."
        },
        {
            question: "She can't drive _____ she gets a license.",
            options: ["unless", "if", "when"],
            correct: 0,
            explanation: "'Unless' means 'if not'. She can't drive if she doesn't get a license."
        },
        {
            question: "_____ you tell me the truth, I won't help you.",
            options: ["Unless", "If", "When"],
            correct: 0,
            explanation: "'Unless you tell me' = 'If you don't tell me'."
        },
        {
            question: "The plants will die _____ you water them.",
            options: ["unless", "if", "when"],
            correct: 0,
            explanation: "'Unless you water them' = 'If you don't water them'."
        },
        {
            question: "Rewrite using 'unless': 'If he doesn't call, I'll be worried.'",
            options: ["Unless he calls, I'll be worried.", "Unless he doesn't call, I'll be worried.", "When he calls, I'll be worried."],
            correct: 0,
            explanation: "Replace 'if not' with 'unless' and use positive verb."
        },
        {
            question: "You'll get sick _____ you eat properly.",
            options: ["unless", "if", "when"],
            correct: 0,
            explanation: "'Unless' = 'if not'. You'll get sick if you don't eat properly."
        },
        {
            question: "_____ it stops raining, the match will be cancelled.",
            options: ["Unless", "If", "When"],
            correct: 0,
            explanation: "'Unless it stops raining' = 'If it doesn't stop raining'."
        }
    ];

    // Shuffle array function
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Generate quiz on page load
    function generateQuiz() {
        // Shuffle and select 12 random questions
        const shuffled = shuffle(questionBank);
        currentQuestions = shuffled.slice(0, 12);
        
        // Generate HTML for questions
        const quizForm = document.getElementById('quizForm');
        quizForm.innerHTML = '';
        
        currentQuestions.forEach((q, index) => {
            const questionNum = index + 1;
            const questionId = `q${questionNum}`;
            
            // Shuffle options
            const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            const shuffledOptionsArray = shuffle(shuffledOptions);
            
            // Find correct answer index after shuffle
            const correctIndex = shuffledOptionsArray.findIndex(opt => opt.isCorrect);
            answers[questionId] = String.fromCharCode(97 + correctIndex); // 'a', 'b', 'c', etc.
            
            // Build question HTML
            const questionHTML = `
            <div class="question">
                <div class="question-text">${questionNum}. ${q.question} <span class="audio-icon" onclick="speakSentence(this)">🔊</span></div>
                <div class="options">
                    ${shuffledOptionsArray.map((opt, idx) => `
                    <label class="option">
                        <input type="radio" name="${questionId}" value="${String.fromCharCode(97 + idx)}">
                        ${opt.text}
                    </label>`).join('')}
                </div>
                <div class="feedback" id="feedback${questionNum}"></div>
                <div class="explanation" id="explanation${questionNum}">
                    ${q.explanation}
                </div>
                <button type="button" class="check-btn" onclick="checkQuestion(${questionNum})">Check Answer</button>
            </div>`;
            
            quizForm.innerHTML += questionHTML;
        });
    }

    // Initialize quiz on page load
    window.addEventListener('DOMContentLoaded', generateQuiz);

    function checkQuestion(questionNum) {
        const question = `q${questionNum}`;
        const selected = document.querySelector(`input[name="${question}"]:checked`);
        
        if (!selected) {
            alert('Please select an answer first.');
            return;
        }

        const isCorrect = (selected.value === answers[question]);
        renderSemanticFeedback(questionNum, isCorrect);
        
        const button = event.target;
        button.disabled = true;
        button.textContent = 'Checked ✓';
        
        checkedQuestions.add(questionNum);
        updateProgress();
    }
    
    function updateProgress() {
        const totalQuestions = Object.keys(answers).length;
        const checked = checkedQuestions.size;
        const progressText = document.getElementById('progressText');
        
        if (checked === 0) {
            progressText.textContent = 'Answer the questions below';
        } else if (checked === totalQuestions) {
            const correctCount = Array.from(checkedQuestions).filter(num => {
                const question = `q${num}`;
                const selected = document.querySelector(`input[name="${question}"]:checked`);
                return selected && selected.value === answers[question];
            }).length;
            
            progressText.textContent = `Quiz Complete! Score: ${correctCount}/${totalQuestions}`;
        } else {
            progressText.textContent = `Progress: ${checked}/${totalQuestions} questions checked`;
        }
    }

    function resetQuiz() {
        // Regenerate the quiz with new random questions
        generateQuiz();
        
        // Reset progress
        checkedQuestions.clear();
        updateProgress();
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
