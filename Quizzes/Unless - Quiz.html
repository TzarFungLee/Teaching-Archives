        {

        {

            explanation: "Never use NOT after unless — unless already contains the negative."

        {
            question: "I won't go to the concert _____ you come with me.",

        {
            question: "You won't improve _____ you practise every day.",

            question: "_____ the weather improves, we'll cancel the hike.",

        {
