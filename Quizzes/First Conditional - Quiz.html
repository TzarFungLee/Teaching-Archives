<div class="quiz-container">
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Answer the questions below</span>
            <button class="reset-btn" onclick="resetQuiz()">Reset All</button>
        </div>

        <form id="quizForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>
</div>

<script>
    let checkedQuestions = new Set();
    let currentQuestions = [];
    let answers = {};
    
    // Question bank with all possible questions
    const questionBank = [
        {
            question: "If it _____ tomorrow, we will cancel the picnic.",
            options: ["rains", "will rain", "rained"],
            correct: 0,
            explanation: "In first conditional, use simple present in the if-clause: If + present simple, will + verb."
        },
        {
            question: "She _____ pass the exam if she studies hard.",
            options: ["will", "would", "can"],
            correct: 0,
            explanation: "Use 'will' in the main clause of first conditional sentences."
        },
        {
            question: "If you _____ late, you will miss the bus.",
            options: ["are", "will be", "were"],
            correct: 0,
            explanation: "Use simple present tense in the if-clause of first conditional."
        },
        {
            question: "They will come to the party if they _____ time.",
            options: ["have", "will have", "had"],
            correct: 0,
            explanation: "In the if-clause of first conditional, use simple present, not 'will'."
        },
        {
            question: "If he _____ me, I will help him.",
            options: ["asks", "will ask", "asked"],
            correct: 0,
            explanation: "Use simple present in the if-clause: If + present simple."
        },
        {
            question: "We _____ go to the beach if the weather is nice.",
            options: ["will", "would", "can"],
            correct: 0,
            explanation: "Use 'will' in the main clause of first conditional."
        },
        {
            question: "If you _____ your homework, you can watch TV.",
            options: ["finish", "will finish", "finished"],
            correct: 0,
            explanation: "Use simple present in the if-clause of first conditional."
        },
        {
            question: "Which sentence is CORRECT?",
            options: ["If she will come, I will be happy.", "If she comes, I will be happy.", "If she come, I will be happy."],
            correct: 1,
            explanation: "First conditional: If + present simple, will + verb. 'If she comes' is correct."
        },
        {
            question: "You will get wet if it _____.",
            options: ["rains", "will rain", "rained"],
            correct: 0,
            explanation: "Use simple present in the if-clause, not 'will'."
        },
        {
            question: "If I _____ enough money, I will buy a new car.",
            options: ["have", "will have", "had"],
            correct: 0,
            explanation: "Use simple present in the if-clause of first conditional."
        },
        {
            question: "She _____ be angry if you don't call her.",
            options: ["will", "would", "can"],
            correct: 0,
            explanation: "Use 'will' in the main clause for future results in first conditional."
        },
        {
            question: "If they _____ the train, they will arrive on time.",
            options: ["catch", "will catch", "caught"],
            correct: 0,
            explanation: "Use simple present in the if-clause of first conditional."
        },
        {
            question: "I will lend you my book if you _____ it carefully.",
            options: ["use", "will use", "used"],
            correct: 0,
            explanation: "Use simple present in the if-clause, not future tense."
        },
        {
            question: "Which is INCORRECT?",
            options: ["If you will study, you will pass.", "If you study, you will pass.", "You will pass if you study."],
            correct: 0,
            explanation: "Don't use 'will' in the if-clause. Use simple present instead."
        },
        {
            question: "If she _____ early, we can go shopping.",
            options: ["arrives", "will arrive", "arrived"],
            correct: 0,
            explanation: "Use simple present in the if-clause of first conditional."
        },
        {
            question: "They _____ miss the flight if they don't hurry.",
            options: ["will", "would", "can"],
            correct: 0,
            explanation: "Use 'will' in the main clause to express future consequence."
        },
        {
            question: "If you _____ water, it boils.",
            options: ["heat", "will heat", "heated"],
            correct: 0,
            explanation: "Use simple present in the if-clause for general truths and habits."
        },
        {
            question: "He will be late if he _____ now.",
            options: ["doesn't leave", "won't leave", "didn't leave"],
            correct: 0,
            explanation: "Use simple present negative in the if-clause of first conditional."
        },
        {
            question: "If it _____ cold, we will turn on the heater.",
            options: ["gets", "will get", "got"],
            correct: 0,
            explanation: "Use simple present in the if-clause of first conditional."
        },
        {
            question: "You _____ feel better if you take this medicine.",
            options: ["will", "would", "can"],
            correct: 0,
            explanation: "Use 'will' in the main clause for future predictions in first conditional."
        }
    ];

    // Shuffle array function
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Generate quiz on page load
    function generateQuiz() {
        // Shuffle and select 12 random questions
        const shuffled = shuffle(questionBank);
        currentQuestions = shuffled.slice(0, 12);
        
        // Generate HTML for questions
        const quizForm = document.getElementById('quizForm');
        quizForm.innerHTML = '';
        
        currentQuestions.forEach((q, index) => {
            const questionNum = index + 1;
            const questionId = `q${questionNum}`;
            
            // Shuffle options
            const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            const shuffledOptionsArray = shuffle(shuffledOptions);
            
            // Find correct answer index after shuffle
            const correctIndex = shuffledOptionsArray.findIndex(opt => opt.isCorrect);
            answers[questionId] = String.fromCharCode(97 + correctIndex); // 'a', 'b', 'c', etc.
            
            // Build question HTML
            const questionHTML = `
            <div class="question">
                <div class="question-text">${questionNum}. ${q.question}</div>
                <div class="options">
                    ${shuffledOptionsArray.map((opt, idx) => `
                    <label class="option">
                        <input type="radio" name="${questionId}" value="${String.fromCharCode(97 + idx)}">
                        ${opt.text}
                    </label>`).join('')}
                </div>
                <div class="feedback" id="feedback${questionNum}"></div>
                <div class="explanation" id="explanation${questionNum}">
                    ${q.explanation}
                </div>
                <button type="button" class="check-btn" onclick="checkQuestion(${questionNum})">Check Answer</button>
            </div>`;
            
            quizForm.innerHTML += questionHTML;
        });
    }

    // Initialize quiz on page load
    window.addEventListener('DOMContentLoaded', generateQuiz);

    function checkQuestion(questionNum) {
        const question = `q${questionNum}`;
        const selected = document.querySelector(`input[name="${question}"]:checked`);
        
        if (!selected) {
            alert('Please select an answer first.');
            return;
        }

        const feedbackEl = document.getElementById(`feedback${questionNum}`);
        const explanationEl = document.getElementById(`explanation${questionNum}`);
        const button = event.target;
        
        if (selected.value === answers[question]) {
            feedbackEl.className = 'feedback correct';
            feedbackEl.textContent = '✓ Correct!';
        } else {
            feedbackEl.className = 'feedback incorrect';
            feedbackEl.textContent = '✗ Incorrect. Check the explanation below.';
        }
        
        explanationEl.classList.add('show');
        button.disabled = true;
        button.textContent = 'Checked ✓';
        
        // Mark as checked
        checkedQuestions.add(questionNum);
        updateProgress();
    }
    
    function updateProgress() {
        const totalQuestions = Object.keys(answers).length;
        const checked = checkedQuestions.size;
        const progressText = document.getElementById('progressText');
        
        if (checked === 0) {
            progressText.textContent = 'Answer the questions below';
        } else if (checked === totalQuestions) {
            const correctCount = Array.from(checkedQuestions).filter(num => {
                const question = `q${num}`;
                const selected = document.querySelector(`input[name="${question}"]:checked`);
                return selected && selected.value === answers[question];
            }).length;
            
            progressText.textContent = `Quiz Complete! Score: ${correctCount}/${totalQuestions}`;
        } else {
            progressText.textContent = `Progress: ${checked}/${totalQuestions} questions checked`;
        }
    }

    function resetQuiz() {
        // Regenerate the quiz with new random questions
        generateQuiz();
        
        // Reset progress
        checkedQuestions.clear();
        updateProgress();
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
