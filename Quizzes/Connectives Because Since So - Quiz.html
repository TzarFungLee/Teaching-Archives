---
layout: default
title: "Quiz: Connectives Because Since So"
category: "Quizzes"
icon: "📝"
---

<div class="quiz-container">
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Answer the questions below</span>
            <button class="reset-btn" onclick="resetQuiz()">Reset All</button>
        </div>

        <form id="quizForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>
</div>

<script>
    let checkedQuestions = new Set();
    let currentQuestions = [];
    let answers = {};
    
    // Question bank with all possible questions
    const questionBank = [
        {
            question: "I stayed home _____ I was sick.",
            options: ["because", "so", "therefore"],
            correct: 0,
            explanation: "Use 'because' to introduce the reason (comes before the reason)."
        },
        {
            question: "It was raining, _____ I took an umbrella.",
            options: ["so", "because", "since"],
            correct: 0,
            explanation: "Use 'so' to show the result or consequence (comes before the result)."
        },
        {
            question: "_____ it was late, we went to bed.",
            options: ["Since", "So", "Therefore"],
            correct: 0,
            explanation: "Use 'since' at the beginning of a sentence to give the reason."
        },
        {
            question: "She studied hard _____ she wanted to pass.",
            options: ["because", "so", "therefore"],
            correct: 0,
            explanation: "Use 'because' to connect a result to its reason."
        },
        {
            question: "The weather was bad, _____ the match was cancelled.",
            options: ["so", "because", "since"],
            correct: 0,
            explanation: "Use 'so' to show what happened as a result."
        },
        {
            question: "Which sentence is CORRECT?",
            options: ["So it was cold, I wore a coat.", "Because it was cold, I wore a coat.", "I wore a coat so it was cold."],
            correct: 1,
            explanation: "'Because' introduces the reason and can start a sentence. Pattern: Because + reason, result."
        },
        {
            question: "I was tired, _____ I went to bed early.",
            options: ["so", "because", "since"],
            correct: 0,
            explanation: "Use 'so' after stating the reason to show the result."
        },
        {
            question: "_____ he didn't study, he failed the exam.",
            options: ["Since", "So", "Therefore"],
            correct: 0,
            explanation: "Use 'since' or 'because' at the start to introduce the reason."
        },
        {
            question: "The shop was closed _____ it was Sunday.",
            options: ["because", "so", "therefore"],
            correct: 0,
            explanation: "Use 'because' to explain the reason why something happened."
        },
        {
            question: "He was hungry, _____ he made a sandwich.",
            options: ["so", "because", "since"],
            correct: 0,
            explanation: "Use 'so' to show the action taken as a result."
        },
        {
            question: "Which is INCORRECT?",
            options: ["I ate because I was hungry.", "I was hungry so I ate.", "Because I was hungry so I ate."],
            correct: 2,
            explanation: "Don't use both 'because' and 'so' together. Use one or the other."
        },
        {
            question: "_____ she loves animals, she became a vet.",
            options: ["Since", "So", "Therefore"],
            correct: 0,
            explanation: "Use 'since' or 'because' to introduce the reason at the beginning."
        },
        {
            question: "I forgot my keys, _____ I couldn't enter.",
            options: ["so", "because", "since"],
            correct: 0,
            explanation: "Use 'so' to show the consequence of forgetting keys."
        },
        {
            question: "We left early _____ we wanted good seats.",
            options: ["because", "so", "therefore"],
            correct: 0,
            explanation: "Use 'because' to explain the reason for an action."
        },
        {
            question: "The road was icy, _____ we drove slowly.",
            options: ["so", "because", "since"],
            correct: 0,
            explanation: "Use 'so' to show what action was taken as a result."
        },
        {
            question: "_____ I love chocolate, I eat it every day.",
            options: ["Because", "So", "Therefore"],
            correct: 0,
            explanation: "Use 'because' at the start to give the reason."
        },
        {
            question: "She was ill, _____ she didn't come to work.",
            options: ["so", "because", "since"],
            correct: 0,
            explanation: "Use 'so' to show the result of being ill."
        },
        {
            question: "I'm learning English _____ I want to travel.",
            options: ["because", "so", "therefore"],
            correct: 0,
            explanation: "Use 'because' to explain the motivation or reason."
        },
        {
            question: "_____ the movie was boring, we left early.",
            options: ["Since", "So", "Therefore"],
            correct: 0,
            explanation: "Use 'since' or 'because' at the beginning to state the reason."
        },
        {
            question: "He missed breakfast, _____ he was very hungry.",
            options: ["so", "because", "since"],
            correct: 0,
            explanation: "Use 'so' to show the result of missing breakfast."
        }
    ];

    // Shuffle array function
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Generate quiz on page load
    function generateQuiz() {
        // Shuffle and select 12 random questions
        const shuffled = shuffle(questionBank);
        currentQuestions = shuffled.slice(0, 12);
        
        // Generate HTML for questions
        const quizForm = document.getElementById('quizForm');
        quizForm.innerHTML = '';
        
        currentQuestions.forEach((q, index) => {
            const questionNum = index + 1;
            const questionId = `q${questionNum}`;
            
            // Shuffle options
            const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            const shuffledOptionsArray = shuffle(shuffledOptions);
            
            // Find correct answer index after shuffle
            const correctIndex = shuffledOptionsArray.findIndex(opt => opt.isCorrect);
            answers[questionId] = String.fromCharCode(97 + correctIndex); // 'a', 'b', 'c', etc.
            
            // Build question HTML
            const questionHTML = `
            <div class="question">
                <div class="question-text">${questionNum}. ${q.question}</div>
                <div class="options">
                    ${shuffledOptionsArray.map((opt, idx) => `
                    <label class="option">
                        <input type="radio" name="${questionId}" value="${String.fromCharCode(97 + idx)}">
                        ${opt.text}
                    </label>`).join('')}
                </div>
                <div class="feedback" id="feedback${questionNum}"></div>
                <div class="explanation" id="explanation${questionNum}">
                    ${q.explanation}
                </div>
                <button type="button" class="check-btn" onclick="checkQuestion(${questionNum})">Check Answer</button>
            </div>`;
            
            quizForm.innerHTML += questionHTML;
        });
    }

    // Initialize quiz on page load
    window.addEventListener('DOMContentLoaded', generateQuiz);

    function checkQuestion(questionNum) {
        const question = `q${questionNum}`;
        const selected = document.querySelector(`input[name="${question}"]:checked`);
        
        if (!selected) {
            alert('Please select an answer first.');
            return;
        }

        const feedbackEl = document.getElementById(`feedback${questionNum}`);
        const explanationEl = document.getElementById(`explanation${questionNum}`);
        const button = event.target;
        
        if (selected.value === answers[question]) {
            feedbackEl.className = 'feedback correct';
            feedbackEl.textContent = '✓ Correct!';
        } else {
            feedbackEl.className = 'feedback incorrect';
            feedbackEl.textContent = '✗ Incorrect. Check the explanation below.';
        }
        
        explanationEl.classList.add('show');
        button.disabled = true;
        button.textContent = 'Checked ✓';
        
        // Mark as checked
        checkedQuestions.add(questionNum);
        updateProgress();
    }
    
    function updateProgress() {
        const totalQuestions = Object.keys(answers).length;
        const checked = checkedQuestions.size;
        const progressText = document.getElementById('progressText');
        
        if (checked === 0) {
            progressText.textContent = 'Answer the questions below';
        } else if (checked === totalQuestions) {
            const correctCount = Array.from(checkedQuestions).filter(num => {
                const question = `q${num}`;
                const selected = document.querySelector(`input[name="${question}"]:checked`);
                return selected && selected.value === answers[question];
            }).length;
            
            progressText.textContent = `Quiz Complete! Score: ${correctCount}/${totalQuestions}`;
        } else {
            progressText.textContent = `Progress: ${checked}/${totalQuestions} questions checked`;
        }
    }

    function resetQuiz() {
        // Regenerate the quiz with new random questions
        generateQuiz();
        
        // Reset progress
        checkedQuestions.clear();
        updateProgress();
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
