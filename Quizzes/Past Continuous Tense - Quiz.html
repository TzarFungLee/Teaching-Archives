---
layout: default
title: "Quiz: Past Continuous Tense"
category: "Quizzes"
icon: "📝"
---

<div class="quiz-container">
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Answer the questions below</span>
            <button class="reset-btn" onclick="resetQuiz()">Reset All</button>
        </div>

        <form id="quizForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>
</div>

<script>
    let checkedQuestions = new Set();
    let currentQuestions = [];
    let answers = {};
    
    // Question bank with all possible questions
    const questionBank = [
        {
            question: "She _____ reading when I called her.",
            options: ["was", "were", "is"],
            correct: 0,
            explanation: "Use 'was' with singular subjects (I/he/she/it) in past continuous."
        },
        {
            question: "They _____ playing football at 5 PM yesterday.",
            options: ["was", "were", "are"],
            correct: 1,
            explanation: "Use 'were' with plural subjects (they/we/you) in past continuous."
        },
        {
            question: "I _____ studying when the power went out.",
            options: ["was", "were", "am"],
            correct: 0,
            explanation: "Use 'was' with 'I' in past continuous tense."
        },
        {
            question: "He _____ not listening during the class.",
            options: ["was", "were", "is"],
            correct: 0,
            explanation: "Use 'was not' (wasn't) with singular subjects in negative past continuous."
        },
        {
            question: "_____ you sleeping when I knocked?",
            options: ["Was", "Were", "Are"],
            correct: 1,
            explanation: "Use 'Were' with 'you' in past continuous questions."
        },
        {
            question: "The children _____ playing outside all afternoon.",
            options: ["was", "were", "are"],
            correct: 1,
            explanation: "Use 'were' with plural subjects like 'children' in past continuous."
        },
        {
            question: "My mother _____ cooking dinner at 7 PM.",
            options: ["was", "were", "is"],
            correct: 0,
            explanation: "Use 'was' with singular subjects in past continuous."
        },
        {
            question: "We _____ watching TV when you arrived.",
            options: ["was", "were", "are"],
            correct: 1,
            explanation: "Use 'were' with 'we' in past continuous tense."
        },
        {
            question: "What _____ she doing at that time?",
            options: ["was", "were", "is"],
            correct: 0,
            explanation: "Use 'was' with third person singular in past continuous questions."
        },
        {
            question: "Which sentence is CORRECT?",
            options: ["He was run in the park.", "He was running in the park.", "He were running in the park."],
            correct: 1,
            explanation: "Past continuous uses 'was/were + verb-ing'. 'He was running' is correct."
        },
        {
            question: "The dog _____ barking all night long.",
            options: ["was", "were", "is"],
            correct: 0,
            explanation: "Use 'was' with singular subjects like 'dog' in past continuous."
        },
        {
            question: "You _____ making noise during the movie.",
            options: ["was", "were", "are"],
            correct: 1,
            explanation: "Use 'were' with 'you' in past continuous tense."
        },
        {
            question: "I _____ not feeling well yesterday.",
            options: ["was", "were", "am"],
            correct: 0,
            explanation: "Use 'was not' with 'I' in negative past continuous sentences."
        },
        {
            question: "Where _____ they going when you saw them?",
            options: ["was", "were", "are"],
            correct: 1,
            explanation: "Use 'were' with 'they' in wh-questions in past continuous."
        },
        {
            question: "The students _____ taking notes during the lecture.",
            options: ["was", "were", "are"],
            correct: 1,
            explanation: "Use 'were' with plural subjects like 'students' in past continuous."
        },
        {
            question: "Which is INCORRECT?",
            options: ["They was playing.", "They were playing.", "We were playing."],
            correct: 0,
            explanation: "'They' is plural, so use 'were', not 'was'."
        },
        {
            question: "It _____ raining when we left home.",
            options: ["was", "were", "is"],
            correct: 0,
            explanation: "Use 'was' with 'it' in past continuous tense."
        },
        {
            question: "Why _____ he laughing?",
            options: ["was", "were", "is"],
            correct: 0,
            explanation: "Use 'was' with third person singular in wh-questions in past continuous."
        },
        {
            question: "My friends _____ waiting for me at the station.",
            options: ["was", "were", "are"],
            correct: 1,
            explanation: "Use 'were' with plural subjects like 'friends' in past continuous."
        },
        {
            question: "She _____ wearing a red dress at the party.",
            options: ["was", "were", "is"],
            correct: 0,
            explanation: "Use 'was' with third person singular subjects in past continuous."
        }
    ];

    // Shuffle array function
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Generate quiz on page load
    function generateQuiz() {
        // Shuffle and select 12 random questions
        const shuffled = shuffle(questionBank);
        currentQuestions = shuffled.slice(0, 12);
        
        // Generate HTML for questions
        const quizForm = document.getElementById('quizForm');
        quizForm.innerHTML = '';
        
        currentQuestions.forEach((q, index) => {
            const questionNum = index + 1;
            const questionId = `q${questionNum}`;
            
            // Shuffle options
            const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            const shuffledOptionsArray = shuffle(shuffledOptions);
            
            // Find correct answer index after shuffle
            const correctIndex = shuffledOptionsArray.findIndex(opt => opt.isCorrect);
            answers[questionId] = String.fromCharCode(97 + correctIndex); // 'a', 'b', 'c', etc.
            
            // Build question HTML
            const questionHTML = `
            <div class="question">
                <div class="question-text">${questionNum}. ${q.question}</div>
                <div class="options">
                    ${shuffledOptionsArray.map((opt, idx) => `
                    <label class="option">
                        <input type="radio" name="${questionId}" value="${String.fromCharCode(97 + idx)}">
                        ${opt.text}
                    </label>`).join('')}
                </div>
                <div class="feedback" id="feedback${questionNum}"></div>
                <div class="explanation" id="explanation${questionNum}">
                    ${q.explanation}
                </div>
                <button type="button" class="check-btn" onclick="checkQuestion(${questionNum})">Check Answer</button>
            </div>`;
            
            quizForm.innerHTML += questionHTML;
        });
    }

    // Initialize quiz on page load
    window.addEventListener('DOMContentLoaded', generateQuiz);

    function checkQuestion(questionNum) {
        const question = `q${questionNum}`;
        const selected = document.querySelector(`input[name="${question}"]:checked`);
        
        if (!selected) {
            alert('Please select an answer first.');
            return;
        }

        const feedbackEl = document.getElementById(`feedback${questionNum}`);
        const explanationEl = document.getElementById(`explanation${questionNum}`);
        const button = event.target;
        
        if (selected.value === answers[question]) {
            feedbackEl.className = 'feedback correct';
            feedbackEl.textContent = '✓ Correct!';
        } else {
            feedbackEl.className = 'feedback incorrect';
            feedbackEl.textContent = '✗ Incorrect. Check the explanation below.';
        }
        
        explanationEl.classList.add('show');
        button.disabled = true;
        button.textContent = 'Checked ✓';
        
        // Mark as checked
        checkedQuestions.add(questionNum);
        updateProgress();
    }
    
    function updateProgress() {
        const totalQuestions = Object.keys(answers).length;
        const checked = checkedQuestions.size;
        const progressText = document.getElementById('progressText');
        
        if (checked === 0) {
            progressText.textContent = 'Answer the questions below';
        } else if (checked === totalQuestions) {
            const correctCount = Array.from(checkedQuestions).filter(num => {
                const question = `q${num}`;
                const selected = document.querySelector(`input[name="${question}"]:checked`);
                return selected && selected.value === answers[question];
            }).length;
            
            progressText.textContent = `Quiz Complete! Score: ${correctCount}/${totalQuestions}`;
        } else {
            progressText.textContent = `Progress: ${checked}/${totalQuestions} questions checked`;
        }
    }

    function resetQuiz() {
        // Regenerate the quiz with new random questions
        generateQuiz();
        
        // Reset progress
        checkedQuestions.clear();
        updateProgress();
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
