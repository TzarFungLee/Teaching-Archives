<script>
    // Question bank for the shared quiz engine (assets/js/quiz-engine.js)
    // Mirrors the lesson: was/were agreement, interrupted actions with 'when',
    // parallel actions with 'while', negatives and questions.
    const questionBank = [
        {
            question: "She _____ reading when I called her.",
            options: ["was", "were", "is", "did"],
            correct: 0,
            explanation: "Third person singular (she) takes 'was'."
        },
        {
            question: "They _____ playing football at 5 PM yesterday.",
            options: ["were", "was", "are", "did"],
            correct: 0,
            explanation: "Plural subject (they) takes 'were'."
        },
        {
            question: "I _____ studying when the power went out.",
            options: ["was", "were", "am", "did"],
            correct: 0,
            explanation: "'I' takes 'was' in the past continuous."
        },
        {
            question: "_____ you sleeping when I knocked?",
            options: ["Were", "Was", "Are", "Did"],
            correct: 0,
            explanation: "Question: Was/Were before the subject. You → were."
        },
        {
            question: "The children _____ playing outside all afternoon.",
            options: ["were", "was", "are", "be"],
            correct: 0,
            explanation: "'The children' is plural → were."
        },
        {
            question: "I was _____ dinner when you arrived.",
            options: ["cooking", "cook", "cooked", "cooks"],
            correct: 0,
            explanation: "Past continuous = was/were + verb-ing: was cooking."
        },
        {
            question: "He was _____ in the library at 4 pm.",
            options: ["sitting", "siting", "sitt", "sat"],
            correct: 0,
            explanation: "Spelling: sit → sitting (double the final consonant)."
        },
        {
            question: "She was _____ a letter when the bell rang.",
            options: ["writing", "writting", "writeing", "wrote"],
            correct: 0,
            explanation: "Spelling: drop the silent 'e' — write → writing."
        },
        {
            question: "I was watching TV _____ the typhoon signal was raised.",
            options: ["when", "while during", "what", "who"],
            correct: 0,
            explanation: "Long action in progress + 'when' + the shorter event."
        },
        {
            question: "_____ I was doing my homework, my brother was playing games.",
            options: ["While", "During", "Until when", "What"],
            correct: 0,
            explanation: "'While' joins two longer actions happening at the same time."
        },
        {
            question: "She was cooking dinner when the phone _____.",
            options: ["rang", "was ringing", "rings", "ring"],
            correct: 0,
            explanation: "The short interrupting action uses the SIMPLE past: …when the phone rang."
        },
        {
            question: "When the fire alarm went off, everyone _____ lunch.",
            options: ["was eating", "ate", "is eating", "eats"],
            correct: 0,
            explanation: "The action already in progress uses the past continuous."
        },
        {
            question: "Which sentence is CORRECT?",
            options: ["He was running in the park.", "He was run in the park.", "He were running in the park.", "He was runs in the park."],
            correct: 0,
            explanation: "Past continuous needs was/were + verb-ing: was running."
        },
        {
            question: "Which sentence is INCORRECT?",
            options: ["They was watching a film.", "They were watching a film.", "She was watching a film.", "I was watching a film."],
            correct: 0,
            explanation: "'They' needs 'were', not 'was'."
        },
        {
            question: "He _____ not listening during the class.",
            options: ["was", "were", "did", "is"],
            correct: 0,
            explanation: "Negative: was/were + not + verb-ing. He → was not listening."
        },
        {
            question: "We _____ paying attention, so we missed the announcement.",
            options: ["weren't", "wasn't", "didn't", "aren't"],
            correct: 0,
            explanation: "'We' takes 'were' → weren't (were not) + verb-ing."
        },
        {
            question: "What _____ she doing at that time?",
            options: ["was", "were", "is", "did"],
            correct: 0,
            explanation: "Wh-question: What + was/were + subject + verb-ing? She → was."
        },
        {
            question: "Where _____ they going when you saw them?",
            options: ["were", "was", "are", "did"],
            correct: 0,
            explanation: "'They' takes 'were': Where were they going?"
        },
        {
            question: "Which sentence describes an action IN PROGRESS at a past moment?",
            options: ["At 9 pm I was doing my homework.", "At 9 pm I did my homework.", "I do my homework at 9 pm.", "I will do my homework at 9 pm."],
            correct: 0,
            explanation: "Past continuous shows the action was ongoing at that exact time."
        },
        {
            question: "Which time expression fits the PAST CONTINUOUS best?",
            options: ["at that moment", "every day", "tomorrow", "since 2019"],
            correct: 0,
            explanation: "'At that moment' pinpoints a past moment when something was happening."
        }
    ];
</script>
