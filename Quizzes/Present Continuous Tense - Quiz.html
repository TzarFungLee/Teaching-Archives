<script>
    // Question bank for the shared quiz engine (assets/js/quiz-engine.js)
    // Mirrors the lesson: am/is/are agreement, -ing spelling changes,
    // and when to use continuous vs simple present.
    const questionBank = [
        {
            question: "She _____ reading a book right now.",
            options: ["is", "are", "am", "be"],
            correct: 0,
            explanation: "Third person singular (she) takes 'is'."
        },
        {
            question: "They _____ playing football at the moment.",
            options: ["are", "is", "am", "be"],
            correct: 0,
            explanation: "Plural subject (they) takes 'are'."
        },
        {
            question: "I _____ studying for my exam now.",
            options: ["am", "is", "are", "be"],
            correct: 0,
            explanation: "'I' always takes 'am'."
        },
        {
            question: "_____ you working on your project?",
            options: ["Are", "Is", "Am", "Do"],
            correct: 0,
            explanation: "Questions: move am/is/are before the subject. You → are."
        },
        {
            question: "The children _____ sleeping upstairs.",
            options: ["are", "is", "am", "be"],
            correct: 0,
            explanation: "'The children' is plural → are."
        },
        {
            question: "It _____ raining outside.",
            options: ["is", "are", "am", "be"],
            correct: 0,
            explanation: "'It' takes 'is'."
        },
        {
            question: "He is _____ in the park.",
            options: ["running", "runing", "runting", "runng"],
            correct: 0,
            explanation: "Spelling: short vowel + consonant → double the consonant (run → running)."
        },
        {
            question: "She is _____ a letter.",
            options: ["writing", "writeing", "writting", "writng"],
            correct: 0,
            explanation: "Spelling: drop the silent 'e' before -ing (write → writing)."
        },
        {
            question: "They are _____ in the pool.",
            options: ["swimming", "swiming", "swimmng", "swimeing"],
            correct: 0,
            explanation: "Spelling: swim → swimming (double the final consonant)."
        },
        {
            question: "I am _____ dinner for the family.",
            options: ["making", "makeing", "makking", "makng"],
            correct: 0,
            explanation: "Spelling: drop the 'e' (make → making)."
        },
        {
            question: "The children are _____ on the floor.",
            options: ["lying", "lieing", "lying down on", "liying"],
            correct: 0,
            explanation: "Spelling: lie → lying (ie changes to y before -ing)."
        },
        {
            question: "We are _____ for the bus.",
            options: ["waiting", "waitting", "waiteing", "waitng"],
            correct: 0,
            explanation: "Just add -ing: wait → waiting (no doubling after two vowels)."
        },
        {
            question: "Which sentence is happening RIGHT NOW?",
            options: ["She is practising the piano.", "She practises the piano daily.", "She practised the piano.", "She will practise the piano."],
            correct: 0,
            explanation: "Present continuous (is practising) = in progress at this moment."
        },
        {
            question: "I usually walk to school, but today I _____ the bus.",
            options: ["am taking", "take", "took", "will take"],
            correct: 0,
            explanation: "'Today' contrasts with the usual habit — use present continuous."
        },
        {
            question: "Listen! Someone _____ at the door.",
            options: ["is knocking", "knocks", "knocked", "knock"],
            correct: 0,
            explanation: "'Listen!' signals something happening now — present continuous."
        },
        {
            question: "Which sentence needs SIMPLE PRESENT (not continuous)?",
            options: ["Water _____ at 0 degrees. (freeze)", "Look, it _____! (snow)", "Shh! The baby _____. (sleep)", "Right now I _____ TV. (watch)"],
            correct: 0,
            explanation: "General facts use the simple present: water freezes at 0 degrees."
        },
        {
            question: "He _____ not listening to the teacher.",
            options: ["is", "are", "am", "does"],
            correct: 0,
            explanation: "Negative: is/are/am + not + verb-ing. He → is not listening."
        },
        {
            question: "What _____ you doing right now?",
            options: ["are", "is", "am", "do"],
            correct: 0,
            explanation: "Wh-question: What + are + you + verb-ing?"
        },
        {
            question: "Which sentence is CORRECT?",
            options: ["He is running in the park.", "He is run in the park.", "He are running in the park.", "He running in the park."],
            correct: 0,
            explanation: "Present continuous needs BOTH parts: is/are/am + verb-ing."
        },
        {
            question: "Which sentence is INCORRECT?",
            options: ["They is playing chess.", "They are playing chess.", "She is playing chess.", "I am playing chess."],
            correct: 0,
            explanation: "'They' needs 'are', not 'is': They are playing."
        }
    ];
</script>
