    // tense from time markers and context.
    const questionBank = [
        {
            question: "I _____ to school by MTR every day.",
            options: ["go", "am going", "went", "will go"],
            correct: 0,
            explanation: "'Every day' signals a habit — use the simple present."
        },
        {
            question: "Look! It _____ outside.",
            options: ["is raining", "rains", "rained", "will rain"],
            correct: 0,
            explanation: "'Look!' means it is happening right now — present continuous."
        },
        {
            question: "They _____ to Ocean Park last Sunday.",
            options: ["went", "go", "are going", "will go"],

            explanation: "'Last Sunday' is finished time — use the simple past."

        {
            question: "While I _____ my homework, my brother was watching TV.",
            options: ["was doing", "did", "am doing", "do"],
            correct: 0,
            explanation: "'While' + two actions in progress at the same past time — past continuous."
        },
        {
            question: "The Earth _____ around the Sun.",
            options: ["moves", "is moving", "moved", "will move"],
            correct: 0,
            explanation: "A general fact that is always true — simple present."
        },
        {
            question: "She _____ her project tomorrow evening.",
            options: ["will finish", "finishes", "finished", "was finishing"],
            correct: 0,
            explanation: "'Tomorrow evening' points to the future — will + base verb."
        },
        {
            question: "Shh, be quiet! The baby _____.",
            options: ["is sleeping", "sleeps", "slept", "will sleep"],
            correct: 0,
            explanation: "The action is in progress at this moment — present continuous."
        },
        {
            question: "What _____ you doing at 9 pm last night?",
            options: ["were", "are", "did", "do"],

        {
            question: "My father _____ coffee every morning, but today he _____ tea.",
            options: ["drinks / is drinking", "is drinking / drinks", "drank / drinks", "drinks / drank"],

        },
        {
            question: "Which sentence is about a FINISHED action?",
            options: ["I watched the match last night.", "I watch matches on TV.", "I am watching the match.", "I will watch the match."],
            correct: 0,
            explanation: "'Watched … last night' is completed past time — simple past."
        },
        {
            question: "They _____ badminton when it started to rain.",
            options: ["were playing", "play", "are playing", "will play"],
            correct: 0,
            explanation: "A longer action interrupted by a short one — past continuous for the longer action."
        },
        {
            question: "Don't worry — I _____ you with the project next week.",
            options: ["will help", "help", "helped", "was helping"],
            correct: 0,
            explanation: "A promise about the future — will + base verb."
        },
        {
            question: "Water _____ at 100 degrees Celsius.",
            options: ["boils", "is boiling", "boiled", "will boil"],
            correct: 0,
            explanation: "A scientific fact — simple present."
        },
        {
            question: "Miss Lee _____ at this school five years ago.",
            options: ["taught", "teaches", "is teaching", "will teach"],
            correct: 0,
            explanation: "'Five years ago' is finished past time — simple past."
        },
        {
            question: "Hurry up! The bus _____ now.",
            options: ["is leaving", "leaves", "left", "will leave"],
            correct: 0,
            explanation: "Happening at this moment — present continuous."
        },
        {
            question: "Which sentence is CORRECT?",
            options: ["She was reading when I called.", "She reading when I called.", "She were reading when I called.", "She is read when I called."],
            correct: 0,
            explanation: "Past continuous = was/were + verb-ing: 'She was reading…'."
        },
        {
            question: "Every weekend, we _____ our grandparents in Sha Tin.",
            options: ["visit", "are visiting", "visited", "will visit"],
            correct: 0,
            explanation: "'Every weekend' signals a routine — simple present."
        },
        {
            question: "The students _____ quietly while the teacher was marking.",
            options: ["were reading", "read", "are reading", "will read"],
            correct: 0,
            explanation: "'While' links two past actions in progress — past continuous."
        },
        {
            question: "The film _____ at 7:30 tonight, so don't be late.",
            options: ["starts", "started", "was starting", "will have started"],
            correct: 0,
            explanation: "Timetabled events use the simple present, even for future time."

        {
            question: "Which time marker goes with the PAST CONTINUOUS?",
            options: ["at 5 pm yesterday", "every day", "tomorrow", "in general"],
            correct: 0,
            explanation: "'At 5 pm yesterday' pinpoints a moment when an action was in progress."
        }
    ];
