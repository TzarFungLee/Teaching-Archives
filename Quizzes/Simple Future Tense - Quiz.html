---
layout: default
title: "Quiz: Simple Future Tense"
category: "Quizzes"
icon: "📝"
---

<div class="quiz-container">
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Answer the questions below</span>
            <button class="reset-btn" onclick="resetQuiz()">Reset All</button>
        </div>

        <form id="quizForm">
            <!-- Questions will be dynamically generated here -->
        </form>
    </div>
</div>

<script>
    let checkedQuestions = new Set();
    let currentQuestions = [];
    let answers = {};
    
    // Question bank with all possible questions
    const questionBank = [
        {
            question: "I _____ visit my grandmother tomorrow.",
            options: ["will", "am", "going"],
            correct: 0,
            explanation: "Use 'will' + base form to express future actions."
        },
        {
            question: "She _____ be late for the meeting.",
            options: ["won't", "doesn't", "isn't"],
            correct: 0,
            explanation: "Use 'won't' (will not) for negative future sentences."
        },
        {
            question: "They _____ start the project next week.",
            options: ["are", "will", "were"],
            correct: 1,
            explanation: "Use 'will' to express future plans or intentions."
        },
        {
            question: "_____ you help me with this task?",
            options: ["Do", "Will", "Are"],
            correct: 1,
            explanation: "Use 'Will' for questions about future actions or requests."
        },
        {
            question: "We _____ travel to Spain next summer.",
            options: ["will", "are", "do"],
            correct: 0,
            explanation: "Use 'will' to express future travel plans."
        },
        {
            question: "He _____ not attend the party tonight.",
            options: ["will", "does", "is"],
            correct: 0,
            explanation: "Use 'will not' (won't) for negative future statements."
        },
        {
            question: "_____ it rain tomorrow?",
            options: ["Does", "Is", "Will"],
            correct: 2,
            explanation: "Use 'Will' to ask questions about future predictions."
        },
        {
            question: "The concert _____ begin at 8 PM.",
            options: ["will", "is", "does"],
            correct: 0,
            explanation: "Use 'will' for scheduled future events."
        },
        {
            question: "I think she _____ pass the exam.",
            options: ["will", "is", "does"],
            correct: 0,
            explanation: "Use 'will' for predictions about the future."
        },
        {
            question: "Which sentence is CORRECT?",
            options: ["He will goes to the store.", "He will go to the store.", "He will going to the store."],
            correct: 1,
            explanation: "Use 'will' + base form (not 'goes' or 'going')."
        },
        {
            question: "We _____ buy a new car next month.",
            options: ["won't", "don't", "aren't"],
            correct: 0,
            explanation: "Use 'won't' (will not) for negative future plans."
        },
        {
            question: "They _____ finish the work by Friday.",
            options: ["will", "are", "were"],
            correct: 0,
            explanation: "Use 'will' to express future completion."
        },
        {
            question: "_____ she come to the party?",
            options: ["Does", "Will", "Is"],
            correct: 1,
            explanation: "Use 'Will' for yes/no questions about the future."
        },
        {
            question: "I promise I _____ be there on time.",
            options: ["will", "am", "do"],
            correct: 0,
            explanation: "Use 'will' to make promises about future actions."
        },
        {
            question: "The sun _____ rise at 6 AM tomorrow.",
            options: ["will", "is", "does"],
            correct: 0,
            explanation: "Use 'will' for predictable future events."
        },
        {
            question: "Which is INCORRECT?",
            options: ["They will arrives soon.", "They will arrive soon.", "Will they arrive soon?"],
            correct: 0,
            explanation: "After 'will', use the base form 'arrive', not 'arrives'."
        },
        {
            question: "You _____ regret this decision.",
            options: ["will", "are", "do"],
            correct: 0,
            explanation: "Use 'will' for warnings or predictions."
        },
        {
            question: "It _____ be difficult to finish on time.",
            options: ["won't", "isn't", "doesn't"],
            correct: 0,
            explanation: "Use 'won't' for negative future predictions."
        },
        {
            question: "When _____ you return home?",
            options: ["will", "do", "are"],
            correct: 0,
            explanation: "Use 'will' in wh-questions about future actions."
        },
        {
            question: "Maybe they _____ join us later.",
            options: ["will", "are", "do"],
            correct: 0,
            explanation: "Use 'will' to express possibility about future events."
        }
    ];

    // Shuffle array function
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Generate quiz on page load
    function generateQuiz() {
        // Shuffle and select 12 random questions
        const shuffled = shuffle(questionBank);
        currentQuestions = shuffled.slice(0, 12);
        
        // Generate HTML for questions
        const quizForm = document.getElementById('quizForm');
        quizForm.innerHTML = '';
        
        currentQuestions.forEach((q, index) => {
            const questionNum = index + 1;
            const questionId = `q${questionNum}`;
            
            // Shuffle options
            const shuffledOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
            const shuffledOptionsArray = shuffle(shuffledOptions);
            
            // Find correct answer index after shuffle
            const correctIndex = shuffledOptionsArray.findIndex(opt => opt.isCorrect);
            answers[questionId] = String.fromCharCode(97 + correctIndex); // 'a', 'b', 'c', etc.
            
            // Build question HTML
            const questionHTML = `
            <div class="question">
                <div class="question-text">${questionNum}. ${q.question}</div>
                <div class="options">
                    ${shuffledOptionsArray.map((opt, idx) => `
                    <label class="option">
                        <input type="radio" name="${questionId}" value="${String.fromCharCode(97 + idx)}">
                        ${opt.text}
                    </label>`).join('')}
                </div>
                <div class="feedback" id="feedback${questionNum}"></div>
                <div class="explanation" id="explanation${questionNum}">
                    ${q.explanation}
                </div>
                <button type="button" class="check-btn" onclick="checkQuestion(${questionNum})">Check Answer</button>
            </div>`;
            
            quizForm.innerHTML += questionHTML;
        });
    }

    // Initialize quiz on page load
    window.addEventListener('DOMContentLoaded', generateQuiz);

    function checkQuestion(questionNum) {
        const question = `q${questionNum}`;
        const selected = document.querySelector(`input[name="${question}"]:checked`);
        
        if (!selected) {
            alert('Please select an answer first.');
            return;
        }

        const feedbackEl = document.getElementById(`feedback${questionNum}`);
        const explanationEl = document.getElementById(`explanation${questionNum}`);
        const button = event.target;
        
        if (selected.value === answers[question]) {
            feedbackEl.className = 'feedback correct';
            feedbackEl.textContent = '✓ Correct!';
        } else {
            feedbackEl.className = 'feedback incorrect';
            feedbackEl.textContent = '✗ Incorrect. Check the explanation below.';
        }
        
        explanationEl.classList.add('show');
        button.disabled = true;
        button.textContent = 'Checked ✓';
        
        // Mark as checked
        checkedQuestions.add(questionNum);
        updateProgress();
    }
    
    function updateProgress() {
        const totalQuestions = Object.keys(answers).length;
        const checked = checkedQuestions.size;
        const progressText = document.getElementById('progressText');
        
        if (checked === 0) {
            progressText.textContent = 'Answer the questions below';
        } else if (checked === totalQuestions) {
            const correctCount = Array.from(checkedQuestions).filter(num => {
                const question = `q${num}`;
                const selected = document.querySelector(`input[name="${question}"]:checked`);
                return selected && selected.value === answers[question];
            }).length;
            
            progressText.textContent = `Quiz Complete! Score: ${correctCount}/${totalQuestions}`;
        } else {
            progressText.textContent = `Progress: ${checked}/${totalQuestions} questions checked`;
        }
    }

    function resetQuiz() {
        // Regenerate the quiz with new random questions
        generateQuiz();
        
        // Reset progress
        checkedQuestions.clear();
        updateProgress();
        
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
